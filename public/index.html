          (b.cells[ci].lines||[]).forEach(l=>{
            const ln = el(`<div style="white-space:nowrap; padding-left:${l.indent||0}pt; margin-bottom:${l.gap||0}pt; font:${l.italic?'italic ':''}${l.bold?'700 ':'400 '}${l.size}pt/${lh} Arial, Helvetica, sans-serif; color:${rgb(l.color)};"></div>`);
            if(l.link){ const a = el(`<a target="_blank" rel="noopener" style="color:${rgb(l.color)}; text-decoration:underline;"></a>`); a.href = l.link; a.textContent = l.text; ln.appendChild(a); }
            else ln.textContent = l.text || '\u00a0';
            cell.appendChild(ln);
          });
          row.appendChild(cell);
        });
        f.appendChild(row); return;
      }
      if(b.kind==='rule'){ f.appendChild(el(`<div style="margin:${b.before}pt 0 ${b.after}pt; border-top:0.9pt solid ${rgb(b.color)};"></div>`)); return; }
      const box = el(`<div style="margin:${b.before||0}pt 0 ${b.after||0}pt; padding-left:${b.indent||0}pt; font:${b.italic?'italic ':''}${b.bold?'700 ':'400 '}${b.size}pt/${lh} Arial, Helvetica, sans-serif; color:${rgb(b.color)};"></div>`);
      (b.lines||[]).forEach(line=>{
        const row = el(`<div style="white-space:nowrap;"></div>`);
        if(b.kind==='link' && b.link){ const a = el(`<a target="_blank" rel="noopener" style="color:${rgb(b.color)}; text-decoration:underline;"></a>`); a.href = b.link; a.textContent = line; row.appendChild(a); }
        else row.textContent = line || '\u00a0';
        box.appendChild(row);
      });
      f.appendChild(box);
    });
    return f;
  };
  sheet.appendChild(fiche(0));
  if(layout.copies===2){
    sheet.appendChild(fiche(5.5));
    sheet.appendChild(el(`<div style="position:absolute; left:.25in; right:.25in; top:5.5in; border-top:1px dashed #9a9aa5;"></div>`));
  } else if(layout.pageCount>1){
    sheet.appendChild(el(`<div style="position:absolute; bottom:.3in; left:0; right:0; text-align:center; font:8pt Arial; color:#777;">Page ${pageNo} / ${layout.pageCount}</div>`));
  }
  return sheet;
}

/** Feuille modifiable : même apparence que l'aperçu, mais on écrit directement dans les cellules (comme dans Word). */
function pedaEditSheet(layout, logoUrl, onEdit){
  const rgb = c=>`rgb(${c.map(v=>Math.round(v*255)).join(',')})`;
  const M = layout.margin, lh = layout.lineHeight;
  const sheet = el(`<div style="position:relative; width:8.5in; min-height:${layout.copies===2?5.5:11}in; background:#fff; box-shadow:0 2px 14px rgba(0,0,0,.25); margin:0 auto 14px; zoom:.78; padding:${M.t}pt ${M.r}pt ${M.b}pt ${M.l}pt; box-sizing:border-box;"></div>`);
  if(logoUrl) sheet.appendChild(el(`<img src="${logoUrl}" alt="" style="position:absolute; right:${M.r}pt; top:${M.t}pt; max-width:${layout.logoSize}pt; max-height:${layout.logoSize}pt;">`));
  const grid = '0.5pt solid #bdc2d1';
  const seenRef = new Set(); let seenHead = false, firstTitle = true;
  const staticRow = b=>{
    const row = el(`<div style="display:flex; width:${layout.frame.w}pt; border-left:${grid}; border-top:${grid}; ${b.fill?'background:'+rgb(b.fill)+';':'background:#fff;'}"></div>`);
    b.cols.forEach((w,ci)=>{
      const cell = el(`<div style="width:${w}pt; box-sizing:border-box; padding:${b.padY}pt ${b.padX}pt; border-right:${grid}; border-bottom:${grid};"></div>`);
      (b.cells[ci].lines||[]).forEach(l=>{ const ln = el(`<div style="white-space:nowrap; padding-left:${l.indent||0}pt; font:${l.bold?'700 ':'400 '}${l.size}pt/${lh} Arial, Helvetica, sans-serif; color:${rgb(l.color)};"></div>`); ln.textContent = l.text || ' '; cell.appendChild(ln); });
      row.appendChild(cell);
    });
    return row;
  };
  layout.pages.forEach(page=>page.blocks.forEach(b=>{
    if(b.kind==='thead'){ if(seenHead) return; seenHead = true; sheet.appendChild(staticRow(b)); return; }
    if(b.kind==='tcat'){ sheet.appendChild(staticRow(b)); return; }
    if(b.kind==='trow'){
      if(!b.ref){ sheet.appendChild(staticRow(b)); return; }
      if(seenRef.has(b.ref.id)) return; seenRef.add(b.ref.id);
      const row = el(`<div style="display:flex; width:${layout.frame.w}pt; border-left:${grid}; border-top:${grid}; background:#fff;"></div>`);
      b.cols.forEach((w,ci)=>{
        const first = (b.cells[ci].lines||[])[0] || {size:b.cells[0].lines[0]?b.cells[0].lines[0].size:9, bold:false, color:[0.12,0.12,0.14]};
        const cell = el(`<div contenteditable="true" spellcheck="true" style="width:${w}pt; box-sizing:border-box; padding:${b.padY}pt ${b.padX}pt; border-right:${grid}; border-bottom:${grid}; white-space:pre-wrap; word-break:break-word; outline:none; cursor:text; font:${first.bold?'700 ':'400 '}${first.size}pt/${lh} Arial, Helvetica, sans-serif; color:${rgb(first.color)};"></div>`);
        const raw = b.ref.raw[ci] || '';
        cell.textContent = raw;
        cell.onfocus = ()=>{ cell.style.background = '#fff9d6'; }; cell.onblur = ()=>{ cell.style.background = ''; };
        cell.addEventListener('paste', e=>{ e.preventDefault(); const tx = (e.clipboardData||window.clipboardData).getData('text/plain'); document.execCommand('insertText', false, tx); });
        cell.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); document.execCommand('insertLineBreak'); } });
        cell.addEventListener('input', ()=>{
          let v = cell.innerText.replace(/ /g,' ').replace(/\r/g,''); if(v.endsWith('\n')) v = v.slice(0,-1);
          onEdit(b.ref.id, b.ref.fields[ci], v, raw);
        });
        row.appendChild(cell);
      });
      sheet.appendChild(row); return;
    }
    if(b.kind==='rule'){ sheet.appendChild(el(`<div style="margin:${b.before}pt 0 ${b.after}pt; border-top:0.9pt solid ${rgb(b.color)};"></div>`)); return; }
    if(b.kind==='title'){ if(!firstTitle) return; firstTitle = false; }
    const box = el(`<div style="margin:${b.before||0}pt 0 ${b.after||0}pt; padding-left:${b.indent||0}pt; ${b.header?'padding-right:'+(layout.logoSize+14)+'pt;':''} font:${b.italic?'italic ':''}${b.bold?'700 ':'400 '}${b.size}pt/${lh} Arial, Helvetica, sans-serif; color:${rgb(b.color)};"></div>`);
    (b.lines||[]).forEach(line=>{
      if(b.ref){ return; }
      const row = el(`<div style="white-space:nowrap;"></div>`);
      if(b.kind==='link' && b.link){ const a = el(`<a target="_blank" rel="noopener" style="color:${rgb(b.color)}; text-decoration:underline;"></a>`); a.href = b.link; a.textContent = line; row.appendChild(a); } else row.textContent = line || ' ';
      box.appendChild(row);
    });
    if(b.ref){ // mode liste : paragraphe modifiable
      box.contentEditable = 'true'; box.style.whiteSpace = 'pre-wrap'; box.style.outline = 'none'; box.style.cursor = 'text'; box.textContent = b.ref.raw[0] || '';
      box.onfocus = ()=>{ box.style.background = '#fff9d6'; }; box.onblur = ()=>{ box.style.background = ''; };
      box.addEventListener('paste', e=>{ e.preventDefault(); document.execCommand('insertText', false, (e.clipboardData||window.clipboardData).getData('text/plain')); });
      box.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); document.execCommand('insertLineBreak'); } });
      box.addEventListener('input', ()=>{ let v = box.innerText.replace(/ /g,' '); if(v.endsWith('\n')) v = v.slice(0,-1); onEdit(b.ref.id, b.ref.fields[0], v, b.ref.raw[0] || ''); });
    }
    sheet.appendChild(box);
  }));
  return sheet;
}

async function pedaPreview(type, data, startVersion, onDownload, opts){
  opts = opts || {};
  let version = startVersion || 'parents', lang = opts.lang || 'fr', editing = false;
  const ov = el(`<div style="position:fixed; inset:0; background:rgba(20,24,35,.72); z-index:70; overflow:auto; padding:2vh 1em;">
    <div style="max-width:760px; margin:0 auto;">
      <div class="card" style="background:var(--paper-raised); margin-bottom:.8em;">
        <div class="row" style="justify-content:space-between; align-items:center;"><h3 style="margin:0;" id="pvTitle">Aperçu du document</h3><span style="display:inline-flex; gap:.4em;">${opts.onSave?'<button class="btn btn-primary btn-sm" id="pvEdit" type="button">MODIFIER</button>':''}<button class="btn btn-ghost btn-sm" id="pvClose" type="button">Fermer</button></span></div>
        <div class="row" style="margin-top:.6em; align-items:center;">
          <div class="seg" id="pvVer" style="${opts.hideVersion?'display:none;':''}"><button type="button" data-v="parents">Aperçu, version parents</button><button type="button" data-v="eleves">Aperçu, version élèves</button></div>
          <div class="seg" id="pvLang"></div></div>
        <p class="muted" id="pvInfo" style="font-size:.85rem; margin:.5em 0 0;">Chargement…</p>
        <div class="row" id="pvDl" style="margin-top:.5em;"></div>
      </div>
      <div id="pvPages"></div></div></div>`);
  document.body.appendChild(ov);
  ov.querySelector('#pvClose').onclick = ()=>{ if(editing && Object.keys(pending).length && !confirm('Vos modifications ne sont pas sauvegardées. Fermer quand même ?')) return; ov.remove(); };
  let pending = {}; // {`${id}|${champ}`: {id, field, value}}
  function drawLangSeg(){
    const seg = ov.querySelector('#pvLang'); const ls = opts.fetchLayout ? (opts.langs||['fr']) : pedaLangs(data);
    if(ls.length<2){ seg.style.display = 'none'; return; }
    seg.style.display = ''; seg.innerHTML = ls.map(l=>`<button type="button" data-l="${l}" class="${l===lang?'on':''}">${LANG_LABELS[l]}</button>`).join('');
    seg.querySelectorAll('button').forEach(b=>b.onclick = ()=>{ if(editing && Object.keys(pending).length && !confirm('Changer de langue abandonne les modifications non sauvegardées. Continuer ?')) return; pending = {}; lang = b.dataset.l; load(); });
  }
  async function load(){
    editing = false; ov.querySelector('#pvTitle').textContent = 'Aperçu du document';
    ov.querySelectorAll('#pvVer button').forEach(b=>b.classList.toggle('on', b.dataset.v===version));
    drawLangSeg();
    const pages = ov.querySelector('#pvPages'); pages.innerHTML = ''; ov.querySelector('#pvInfo').textContent = 'Chargement…';
    if(opts.onSave) ov.querySelector('#pvEdit').style.display = '';
    try{
      const r = opts.fetchLayout ? await opts.fetchLayout(lang) : await api('/api/peda/apercu', {method:'POST', body:{type, data, version, lang}});
      const L = r.layout; const logoUrl = r.logoId ? `${getApiBase()}/api/uploads/${r.logoId}` : '';
      ov.querySelector('#pvInfo').innerHTML = `${version==='eleves' ? 'Version élèves : deux fiches identiques de 8,5 x 5,5 po par feuille Letter (8,5 x 11 po).' : 'Version parents : une fiche par feuille Letter (8,5 x 11 po).'} Nombre de ${version==='eleves'?'feuilles':'pages'} : <strong>${L.pageCount}</strong> · taille du texte : ${Math.round(L.scale*100)} %.${L.pageCount>1 ? ' <span style="color:#B45F06;">Le contenu dépasse une page : il est réparti automatiquement.</span>' : ''}${logoUrl ? '' : ' <span style="color:#B45F06;">Aucun logo enregistré.</span>'}`;
      L.pages.forEach((p,i)=>pages.appendChild(pedaSheet(L, p, logoUrl, i+1)));
      ov.dataset.layout = '1'; ov._layout = L; ov._logo = logoUrl;
    }catch(e){ ov.querySelector('#pvInfo').textContent = e.message; }
    const dl = ov.querySelector('#pvDl'); dl.innerHTML = '';
    if(onDownload){
      (opts.pdfOnly ? [['pdf','PDF']] : [['docx','Word'],['pdf','PDF']]).forEach(([f,l])=>{ const b = el(`<button class="btn btn-primary btn-sm" type="button">TÉLÉCHARGER ${l.toUpperCase()}, ${version==='eleves'?'ÉLÈVES':'PARENTS'}${lang==='fr'?'':' ('+LANG_LABELS[lang]+')'}</button>`); b.onclick = ()=>onDownload(version, f, lang); dl.appendChild(b); });
    }
  }
  ov.querySelectorAll('#pvVer button').forEach(b=>b.onclick = ()=>{ version = b.dataset.v; load(); });

  /* Modification directe : la feuille reste exactement comme elle est ; on écrit dans les cellules, puis on sauvegarde. */
  function startEdit(){
    if(!ov._layout) return;
    editing = true; pending = {};
    ov.querySelector('#pvTitle').textContent = 'Modification du document';
    const pages = ov.querySelector('#pvPages'); pages.innerHTML = '';
    pages.appendChild(pedaEditSheet(ov._layout, ov._logo, (id, field, value, raw)=>{
      const k = id+'|'+field;
      if(value===raw) delete pending[k]; else pending[k] = {id, field, value};
      ov.querySelector('#pvInfo').innerHTML = Object.keys(pending).length ? `<strong style="color:#B45F06;">${Object.keys(pending).length} modification(s) non sauvegardée(s).</strong>` : 'Cliquez dans le texte pour le modifier.';
    }));
    ov.querySelector('#pvInfo').textContent = "Cliquez dans le texte pour le modifier, comme dans Word. La touche Entrée ajoute une ligne (utile pour aérer le texte). Cliquez ensuite sur SAUVEGARDER.";
    const dl = ov.querySelector('#pvDl'); dl.innerHTML = '';
    const save = el(`<button class="btn btn-primary btn-sm" type="button">SAUVEGARDER</button>`), cancel = el(`<button class="btn btn-ghost btn-sm" type="button">Annuler</button>`);
    cancel.onclick = ()=>{ if(Object.keys(pending).length && !confirm('Abandonner les modifications ?')) return; pending = {}; load(); };
    save.onclick = async ()=>{
      const draft = JSON.parse(JSON.stringify(data));
      Object.values(pending).forEach(p=>{ const it = draft.items.find(x=>x.id===p.id); if(it){ pedaSetPath(it, p.field, p.value); it.manuel = true; } });
      try{ await opts.onSave(draft); data = draft; pending = {}; await load(); }catch(e){ alert(e.message); }
    };
    dl.appendChild(save); dl.appendChild(cancel);
    ov.querySelector('#pvEdit').style.display = 'none'; ov.scrollTop = 0;
  }
  if(opts.onSave) ov.querySelector('#pvEdit').onclick = startEdit;
  load();
}

  function showAccueil(){

        act('TÉLÉCHARGER', ()=>{
          const m = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:1em;"><div class="card" style="max-width:380px; width:100%; background:var(--paper-raised);"><h3 style="margin-top:0;">Télécharger</h3><div id="dl" style="display:grid; gap:.5em;"></div><div class="row" style="justify-content:flex-end; margin-top:.8em;"><button class="btn btn-ghost btn-sm" id="dlX" type="button">Fermer</button></div></div></div>`);
          pedaLangs(d.data).forEach(lg=>{
            const sfx = lg==='fr' ? '' : ` (${LANG_LABELS[lg]})`;
            [['docx','parents','TÉLÉCHARGER WORD, PARENTS'],['pdf','parents','TÉLÉCHARGER PDF, PARENTS'],['docx','eleves','TÉLÉCHARGER WORD, ÉLÈVES'],['pdf','eleves','TÉLÉCHARGER PDF, ÉLÈVES']].forEach(([f,v,l])=>{
              const b = el(`<button class="btn btn-primary btn-sm" type="button">${l}${sfx}</button>`); b.onclick = ()=>pedaDownload(d.type,d.data,v,f,lg).catch(e=>alert(e.message)); m.querySelector('#dl').appendChild(b);
            });
          });
          m.querySelector('#dlX').onclick = ()=>m.remove(); document.body.appendChild(m);
        });
        act('💾 COPIE (.json)', ()=>pedaExportFile(d));
        act('SUPPRIMER', ()=>{
          const m = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:70; padding:1em;"><div class="card" style="max-width:420px; width:100%; background:var(--paper-raised);"><h3 style="margin-top:0;">Voulez-vous vraiment supprimer ce document ?</h3><p>Cette action supprimera définitivement le document, pour vous et pour le professeur à qui il est assigné.</p><div class="banner" style="margin:.6em 0; display:flex; align-items:center; gap:.6em; flex-wrap:wrap;"><span>Vous voulez le garder pour plus tard ?</span><button class="btn btn-ghost btn-sm" id="cSave" type="button">💾 Télécharger une copie (.json)</button></div><div class="row" style="justify-content:flex-end;"><button class="btn btn-ghost" id="cNo" type="button">ANNULER</button><button class="btn btn-primary" id="cYes" type="button" style="background:var(--bad);">SUPPRIMER DÉFINITIVEMENT</button></div></div></div>`);
          m.querySelector('#cNo').onclick = ()=>m.remove();
          m.querySelector('#cSave').onclick = ()=>pedaExportFile(d);
          m.querySelector('#cYes').onclick = async ()=>{ try{ await api(`/api/peda/documents/${d.id}`, {method:'DELETE'}); m.remove(); showMes(); }catch(e){ alert(e.message); } };
          document.body.appendChild(m);
        }, true);
        body.appendChild(card);
      });
    });
  }

  /* ---------------- Éditeur ---------------- */
  function showEditor(){
    const E = pedaNav.editor, T = PEDA_TYPES[E.type], info = E.data.info, guide = E.type==='guide';
    body.innerHTML = '';
    E.langs = E.langs || pedaLangs(E.data).filter(l=>l!=='fr');
    const dl = (id, arr)=>`<datalist id="${id}">${[...new Set(arr.filter(Boolean))].map(x=>`<option value="${escapeHtml(x)}">`).join('')}</datalist>`;
    const matNames = struct.matieres.length ? struct.matieres.map(m=>m.nom) : ['Français','Sciences'];
    const sections = struct.nodes.filter(n=>n.kind==='section');
    const header = el(`<div><div class="row" style="justify-content:space-between; align-items:center;"><h2 style="margin:0;">${escapeHtml(T.titre)}</h2><button class="btn btn-ghost btn-sm" id="eBack" type="button">Retour</button></div>
      <p class="muted" style="margin-top:.3em;">Le logo officiel du Collège Albert Camus est placé automatiquement en haut à droite de chaque document.</p></div>`);
    header.querySelector('#eBack').onclick = ()=>{ if(!E.id && E.data.items.length && !confirm("Ce document n'est pas sauvegardé. Quitter quand même ?")) return; showAccueil(); };
    body.appendChild(header);

    /* 1. Informations */
    const s1 = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">1. Informations de l'établissement</h3>
      <div class="row"><div class="field" style="flex:1; min-width:200px;"><label>Établissement</label><input value="Collège Albert Camus" disabled></div>
        <div class="field" style="flex:1; min-width:160px;"><label>Matière</label><input data-k="matiere" list="dlMat" value="${escapeHtml(info.matiere)}"></div>
        <div class="field" style="flex:1; min-width:140px;"><label>Année scolaire</label><input data-k="annee" list="dlAnnee" value="${escapeHtml(info.annee)}" placeholder="2026-2027"></div></div>
      <div class="row"><div class="field" style="flex:1; min-width:150px;"><label>Section</label><input data-k="section" list="dlSec" value="${escapeHtml(info.section)}"></div>
        <div class="field" style="flex:1; min-width:150px;"><label>Niveau / classe</label><input data-k="classe" list="dlCl" value="${escapeHtml(info.classe)}"></div>
        <div class="field" style="flex:1; min-width:120px;"><label>Groupe</label><input data-k="groupe" list="dlGr" value="${escapeHtml(info.groupe)}"></div>
        <div class="field" style="flex:1; min-width:150px;"><label>Période / trimestre</label><input data-k="periode" list="dlPer" value="${escapeHtml(info.periode)}" placeholder="Période 1"></div></div>
      <div class="row"><div class="field" style="flex:2; min-width:200px;"><label>Nom de l'enseignant</label><input data-k="enseignant" list="dlEns" value="${escapeHtml(info.enseignant)}" placeholder="Choisir dans la liste ou écrire un nom"></div>
        <div class="field" id="fLing" style="flex:1; min-width:150px;"><label>Niveau linguistique (français)</label><input data-k="niveauLinguistique" list="dlNiv" value="${escapeHtml(info.niveauLinguistique)}" placeholder="A1, A2, B1…"></div>
        ${guide?`<div class="field" style="flex:1; min-width:180px;"><label>Intitulé de l'examen</label><input data-k="examenLabel" value="${escapeHtml(info.examenLabel)}"></div>`:''}</div>
      <p class="muted" style="font-size:.8rem; margin:0;">Les suggestions viennent de la structure de l'établissement (module Suivi des évaluations) ; vous pouvez aussi écrire librement.</p>
      ${dl('dlEns',teacherNames)}${dl('dlMat',matNames)}${dl('dlAnnee',struct.years.map(y=>y.label))}${dl('dlSec',sections.map(s=>s.nom))}${dl('dlCl',[])}${dl('dlGr',[])}${dl('dlPer',['Trimestre 1','Trimestre 2','Trimestre 3','Période 1','Période 2','Période 3'])}${dl('dlNiv',struct.niveaux.length?struct.niveaux.map(n=>n.nom):['A1','A2','B1','B1+','B2','B2+'])}</div>`);
    const refreshSuggest = ()=>{
      const sec = sections.find(s=>s.nom.toLowerCase()===String(info.section||'').toLowerCase());
      const classes = struct.nodes.filter(n=>n.kind==='classe' && (!sec || n.parentId===sec.id));
      const cl = classes.find(c=>c.nom.toLowerCase()===String(info.classe||'').toLowerCase());
      const groups = struct.nodes.filter(n=>n.kind==='groupe' && (!cl || n.parentId===cl.id));
      s1.querySelector('#dlCl').innerHTML = [...new Set(classes.map(c=>c.nom))].map(x=>`<option value="${escapeHtml(x)}">`).join('');
      s1.querySelector('#dlGr').innerHTML = [...new Set(groups.map(g=>g.nom))].map(x=>`<option value="${escapeHtml(x)}">`).join('');
      s1.querySelector('#fLing').style.display = String(info.matiere||'').toLowerCase().startsWith('fran') ? '' : 'none';
    };
    s1.querySelectorAll('input[data-k]').forEach(inp=>inp.addEventListener('input', ()=>{ info[inp.dataset.k] = inp.value; if(inp.dataset.k==='matiere'){ drawItems(); } refreshSuggest(); }));
    body.appendChild(s1); refreshSuggest();
    drawSchoolLogoControl(s1);

    /* 2. Contenus */
    const s2 = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">2. Contenus</h3>
      <p class="muted" style="font-size:.85rem; margin-top:-.3em;">${guide ? 'Pour chaque sujet ou notion : ce que l\'élève doit savoir, ce qu\'il doit savoir faire, et les ressources disponibles.' : 'Saisissez les contenus transmis par les enseignants ; l\'IA les transformera en apprentissages attendus.'}</p>
      <div class="row" style="align-items:center;"><button class="btn btn-primary" id="addBtn" type="button" style="font-size:1rem; padding:.7em 1.4em;">${escapeHtml(T.add)}</button>
        <button class="btn btn-ghost" id="impBtn" type="button" style="font-size:1rem; padding:.7em 1.4em;">IMPORTER UN DOCUMENT WORD OU PDF</button><input type="file" id="impFile" accept=".docx,.pdf" style="display:none;"></div>
      <p id="impMsg" class="muted" style="margin:.5em 0 0; font-size:.88rem;">${guide?"Vous avez le contenu à réviser dans un document ? Importez-le : l'IA repère les sujets, rédige ce que l'élève doit savoir et savoir faire, et sépare les ressources (livre, pages, vidéos) si elles sont écrites dans le document.":"Vous avez les contenus dans un document ? Importez-le : l'IA repère les sujets et rédige les apprentissages attendus."}</p>
      <div id="addPanel" style="display:none; margin-top:.8em; padding:.8em; border:1px solid var(--line); border-radius:10px;"></div>
      <div id="items" style="margin-top:1em;"></div></div>`);
    body.appendChild(s2);
    const addPanel = s2.querySelector('#addPanel'), itemsDiv = s2.querySelector('#items');
    s2.querySelector('#addBtn').onclick = ()=>{
      const cats = pedaCategories(E.type, info.matiere);
      addPanel.style.display = 'block'; addPanel.innerHTML = '';
      const f = el(`<div><div class="row"><div class="field" style="flex:1; min-width:200px;"><label>Catégorie</label><select>${cats.map(c=>`<option>${escapeHtml(c)}</option>`).join('')}</select></div>
        <div class="field" style="flex:2; min-width:220px;"><label>${guide?'Nom du sujet ou de la notion':'Contenu (sujet, notion, titre…)'}</label><input placeholder="${guide?'ex : Les articles définis et indéfinis':'ex : Les salutations'}"></div></div>
        ${guide?'':`<div class="field"><label>Précisions (facultatif)</label><textarea rows="2" placeholder="Compléments utiles pour la rédaction"></textarea></div>`}
        <div class="row"><button class="btn btn-primary btn-sm" type="button" id="aOk">Ajouter</button><button class="btn btn-ghost btn-sm" type="button" id="aNo">Annuler</button></div></div>`);
      f.querySelector('#aNo').onclick = ()=>{ addPanel.style.display = 'none'; };
      f.querySelector('#aOk').onclick = ()=>{
        const nom = f.querySelector('input').value.trim(); if(!nom){ alert('Écrivez le nom du contenu.'); return; }
        E.data.items.push({id:pedaId('it_'), categorie:f.querySelector('select').value, nom, indication: guide?'':(f.querySelector('textarea').value.trim()), texte:'', savoir:'', savoirFaire:'', manuel:false, ressources:[]});
        f.querySelector('input').value = ''; drawItems(); refreshState(); f.querySelector('input').focus();
      };
      addPanel.appendChild(f); f.querySelector('input').focus();
    };

    const impFile = s2.querySelector('#impFile'), impMsg = s2.querySelector('#impMsg');
    s2.querySelector('#impBtn').onclick = ()=>impFile.click();
    impFile.onchange = async ()=>{
      const file = impFile.files[0]; impFile.value = ''; if(!file) return;
      const ext = (file.name.split('.').pop()||'').toLowerCase();
      try{
        impMsg.textContent = 'Lecture du document…';
        let text;
        if(ext==='docx') text = (await extractDocx(file)).text;
        else if(ext==='pdf') text = await extractPdf(file);
        else throw new Error(ext==='doc' ? "Les anciens fichiers .doc ne peuvent pas être lus : enregistrez-le en .docx ou en PDF." : "Choisissez un fichier Word (.docx) ou PDF.");
        if(text.replace(/\s+/g,'').length < 20) throw new Error("Aucun texte lisible dans ce document (PDF scanné ?).");
        impMsg.textContent = "L'IA prépare le document…";
        const r = await api('/api/peda/depuis-document', {method:'POST', body:{type:E.type, info, text, categories:pedaCategories(E.type, info.matiere)}});
        if(!r.items.length){ impMsg.textContent = 'Aucun contenu trouvé dans ce document.'; return; }
        r.items.forEach(x=>E.data.items.push({id:pedaId('it_'), categorie:x.categorie, nom:x.nom, indication:x.indication||'', texte:x.texte||'', savoir:x.savoir||'', savoirFaire:x.savoirFaire||'', manuel:false, generated:r.ia && !!(x.texte||x.savoir||x.savoirFaire), ressources:(x.ressources||[]).map(rr=>({id:pedaId('r_'), type:rr.type, titre:rr.titre||'', chapitre:rr.chapitre||'', debut:rr.debut||'', fin:rr.fin||'', url:rr.url||'', commentaire:rr.commentaire||''}))}));
        E.ia = r.ia;
        impMsg.textContent = r.error ? r.error : `${r.items.length} contenu(s) ajouté(s) depuis « ${file.name} ». Vérifiez chaque élément ci-dessous : modifiez, supprimez ou régénérez.`;
        drawItems(); refreshState();
      }catch(e){ impMsg.textContent = e.message; }
    };

    function move(i, d){ const a = E.data.items; const j = i+d; if(j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; drawItems(); }
    function markManual(it){ if(it.generated){ it.manuel = true; } }

    function drawItems(){
      itemsDiv.innerHTML = '';
      const items = E.data.items;
      if(!items.length){ itemsDiv.appendChild(el(`<p class="muted">Aucun contenu pour le moment.</p>`)); return; }
      items.forEach((it,i)=>{
        const card = el(`<div class="card" style="margin-bottom:.7em; background:var(--paper);"></div>`);
        card.appendChild(el(`<div class="row" style="justify-content:space-between; align-items:center;"><span class="muted" style="font-size:.75rem; letter-spacing:.06em;">${escapeHtml((it.categorie||'').toUpperCase())}${it.manuel?' · MODIFIÉ MANUELLEMENT':(it.generated?' · RÉDIGÉ PAR '+(E.ia===false?'RÈGLES AUTOMATIQUES':'IA'):'')}</span>
          <span style="display:inline-flex; gap:.3em;"><button class="btn btn-ghost btn-sm" type="button" data-a="up">Monter</button><button class="btn btn-ghost btn-sm" type="button" data-a="down">Descendre</button><button class="btn btn-ghost btn-sm" type="button" data-a="del" style="color:var(--bad);">Supprimer</button></span></div>`));
        card.querySelector('[data-a=up]').onclick = ()=>move(i,-1); card.querySelector('[data-a=down]').onclick = ()=>move(i,1);
        card.querySelector('[data-a=del]').onclick = ()=>{ if(confirm('Supprimer ce contenu ?')){ items.splice(i,1); drawItems(); refreshState(); } };
        const nom = el(`<div class="field" style="margin:.4em 0;"><label>${guide?'Sujet ou notion':'Contenu'}</label><input value="${escapeHtml(it.nom)}"></div>`);
        nom.querySelector('input').oninput = e=>{ it.nom = e.target.value; }; card.appendChild(nom);
        if(guide){
          const sv = el(`<div class="field" style="margin:.4em 0;"><label>Ce que l'élève doit savoir</label><textarea rows="2">${escapeHtml(it.savoir||'')}</textarea></div>`);
          sv.querySelector('textarea').oninput = e=>{ it.savoir = e.target.value; markManual(it); }; card.appendChild(sv);
          const sf = el(`<div class="field" style="margin:.4em 0;"><label>Ce que l'élève doit savoir faire</label><textarea rows="2">${escapeHtml(it.savoirFaire||'')}</textarea></div>`);
          sf.querySelector('textarea').oninput = e=>{ it.savoirFaire = e.target.value; markManual(it); }; card.appendChild(sf);
          card.appendChild(resourcesEditor(it));
        } else {
          const ind = el(`<div class="field" style="margin:.4em 0;"><label>Précisions (facultatif)</label><textarea rows="2">${escapeHtml(it.indication||'')}</textarea></div>`);
          ind.querySelector('textarea').oninput = e=>{ it.indication = e.target.value; }; card.appendChild(ind);
          const tx = el(`<div class="field" style="margin:.4em 0;"><label>Apprentissage attendu (à vérifier et modifier)</label><textarea rows="2" placeholder="Rédigé par l'IA après « ${escapeHtml(T.gen)} », ou écrivez-le vous-même">${escapeHtml(it.texte||'')}</textarea></div>`);
          tx.querySelector('textarea').oninput = e=>{ it.texte = e.target.value; it.manuel = !!it.texte.trim(); }; card.appendChild(tx);
        }
        const rg = el(`<button class="btn btn-ghost btn-sm" type="button">Régénérer cet élément</button>`);
        rg.onclick = ()=>{ if(it.manuel && !confirm('Ce texte a été modifié manuellement. Le remplacer par une nouvelle rédaction ?')) return; generate([it.id], true); };
        card.appendChild(rg);
        itemsDiv.appendChild(card);
      });
    }
    function resourcesEditor(it){
      const box = el(`<div style="margin:.6em 0; padding:.6em; border:1px dashed var(--line); border-radius:8px;"><div class="muted" style="font-size:.78rem; letter-spacing:.06em;">RESSOURCES</div><div class="rl"></div>
        <div class="row" style="align-items:center; margin-top:.4em;"><select>${PEDA_RES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" type="button">Ajouter une ressource</button></div></div>`);
      const rl = box.querySelector('.rl');
      const fields = {
        livre:[['titre','Nom du livre'],['chapitre','Chapitre / unité'],['debut','Page de début'],['fin','Page de fin'],['commentaire','Commentaire']],
        cahier:[['titre',"Nom du cahier (facultatif)"],['debut','Page de début'],['fin','Page de fin'],['commentaire','Commentaire']],
        video:[['titre','Titre'],['url','Lien de la vidéo (URL)']], lien:[['titre','Titre'],['url','Lien (URL)'],['commentaire','Description']],
        document:[['titre','Nom du document ou de la fiche'],['commentaire','Commentaire']], exercice:[['titre',"Exercice ou série d'exercices à revoir"]],
      };
      function draw(){
        rl.innerHTML = '';
        it.ressources.forEach((r,ri)=>{
          const row = el(`<div style="margin:.4em 0; padding:.4em; background:var(--paper-raised); border-radius:8px;"><div class="row" style="justify-content:space-between; align-items:center;"><strong style="font-size:.85rem;">${escapeHtml((PEDA_RES.find(x=>x[0]===r.type)||[0,r.type])[1])}</strong><button class="btn btn-ghost btn-sm" type="button" style="color:var(--bad);">Supprimer la ressource</button></div><div class="row"></div></div>`);
          row.querySelector('button').onclick = ()=>{ it.ressources.splice(ri,1); draw(); };
          (fields[r.type]||[['titre','Titre']]).forEach(([k,label])=>{
            const f = el(`<div class="field" style="flex:1; min-width:${k==='debut'||k==='fin'?'90':'160'}px; margin:.2em 0;"><label style="font-size:.75rem;">${label}</label><input value="${escapeHtml(r[k]||'')}"></div>`);
            f.querySelector('input').oninput = e=>{ r[k] = e.target.value; }; row.querySelector('.row:last-child').appendChild(f);
          });
          rl.appendChild(row);
        });
      }
      box.querySelector('button').onclick = ()=>{ it.ressources.push({id:pedaId('r_'), type:box.querySelector('select').value, titre:'', chapitre:'', debut:'', fin:'', url:'', commentaire:''}); draw(); };
      draw(); return box;
    }

    /* 3. Génération */
    const s3 = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">3. Génération</h3>
      <p class="muted" style="font-size:.85rem; margin-top:-.3em;">${guide ? "L'IA rédige « ce que je dois savoir » et « ce que je dois savoir faire ». Elle n'invente jamais de pages, de liens, de vidéos ni de ressources : elles sont reprises telles que vous les avez saisies." : "L'IA propose une première rédaction adaptée au niveau. Les textes que vous avez modifiés à la main ne sont jamais remplacés par une génération globale."}</p>
      <div class="field" style="margin:.2em 0 .8em;"><label>Langues du document</label>
        <div class="row" id="langChecks" style="gap:1.2em;"><label style="display:inline-flex; gap:.35em; align-items:center; margin:0;"><input type="checkbox" checked disabled style="width:auto;"> Français</label>
          <label style="display:inline-flex; gap:.35em; align-items:center; margin:0;"><input type="checkbox" data-l="es" style="width:auto;" ${E.langs.includes('es')?'checked':''}> Español</label>
          <label style="display:inline-flex; gap:.35em; align-items:center; margin:0;"><input type="checkbox" data-l="en" style="width:auto;" ${E.langs.includes('en')?'checked':''}> English</label></div>
        <p class="muted" style="font-size:.8rem; margin:.3em 0 0;">Pour les parents qui ne parlent pas français : cochez Español et/ou English, le même document sera aussi généré dans ces langues. Si vous changez ensuite un texte français, cliquez sur « Traduire à nouveau ».</p></div>
      <div class="row"><button class="btn btn-primary" id="genBtn" type="button" style="font-size:1rem; padding:.7em 1.4em;">${escapeHtml(T.gen)}</button><button class="btn btn-ghost" id="trBtn" type="button" style="font-size:1rem; padding:.7em 1.4em;">Traduire à nouveau</button></div><p id="genMsg" class="muted" style="margin:.6em 0 0; font-size:.88rem;"></p></div>`);
    body.appendChild(s3);
    async function generate(only, force){
      const items = E.data.items.filter(it=> only ? only.includes(it.id) : !it.manuel);
      if(!items.length){ s3.querySelector('#genMsg').textContent = only ? '' : 'Aucun contenu à générer (les textes modifiés à la main sont conservés).'; return; }
      const msg = s3.querySelector('#genMsg'); msg.textContent = 'Rédaction en cours…'; s3.querySelector('#genBtn').disabled = true;
      try{
        const r = await api('/api/peda/generer', {method:'POST', body:{type:E.type, info, items:items.map(it=>({id:it.id, categorie:it.categorie, nom:it.nom, indication:it.indication, savoir:it.savoir, savoirFaire:it.savoirFaire}))}});
        E.ia = r.ia;
        r.items.forEach(g=>{ const it = E.data.items.find(x=>x.id===g.id); if(!it) return; if(guide){ it.savoir = g.savoir; it.savoirFaire = g.savoirFaire; } else it.texte = g.texte; it.generated = true; it.manuel = false; });
        msg.textContent = r.error ? r.error : (r.ia ? 'Rédaction terminée. Vérifiez chaque élément ci-dessus : modifiez, supprimez, réorganisez ou régénérez.' : "L'IA n'est pas configurée sur ce serveur : une rédaction automatique simple a été utilisée. Modifiez-la librement.");
        drawItems();
        if(E.langs.length) await translateAll(msg);
      }catch(e){ msg.textContent = e.message; }
      s3.querySelector('#genBtn').disabled = false;
    }
    s3.querySelectorAll('#langChecks input[data-l]').forEach(c=>c.onchange = ()=>{
      E.langs = [...s3.querySelectorAll('#langChecks input[data-l]:checked')].map(x=>x.dataset.l);
      E.data.items.forEach(it=>{ if(it.tr) ['es','en'].forEach(l=>{ if(!E.langs.includes(l)) delete it.tr[l]; }); });
      ['es','en'].forEach(l=>{ if(!E.langs.includes(l) && E.data.trInfo) delete E.data.trInfo[l]; });
      drawDl();
    });
    async function translateAll(msg){
      const langs = E.langs; if(!langs.length) return;
      msg.textContent = 'Traduction en cours…';
      try{
        const items = E.data.items.map(it=>({id:it.id, nom:it.nom, texte:it.texte, savoir:it.savoir, savoirFaire:it.savoirFaire}));
        const r = await api('/api/peda/traduire', {method:'POST', body:{info, items, langs}});
        E.data.trInfo = E.data.trInfo || {};
        langs.forEach(l=>{ const x = r[l]; if(!x) return; E.data.trInfo[l] = x.info; E.data.items.forEach(it=>{ const tr = x.items[it.id]; if(tr){ it.tr = it.tr || {}; it.tr[l] = tr; } }); });
        msg.textContent = 'Traductions prêtes (' + langs.map(l=>LANG_LABELS[l]).join(', ') + '). Ouvrez l\'aperçu pour les voir et les modifier.';
        drawDl();
      }catch(e){ msg.textContent = 'Traduction impossible : ' + e.message; }
    }
    s3.querySelector('#trBtn').onclick = async ()=>{ if(!E.langs.length){ s3.querySelector('#genMsg').textContent = 'Cochez Español et/ou English.'; return; } s3.querySelector('#trBtn').disabled = true; await translateAll(s3.querySelector('#genMsg')); s3.querySelector('#trBtn').disabled = false; };
    s3.querySelector('#genBtn').onclick = ()=>generate(null, false);

    /* 4. Aperçu et téléchargement */
    const s4 = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">4. Aperçu et téléchargement</h3>
      <div class="field" style="margin:0 0 .8em;"><label>Présentation du document</label><div class="seg" id="presSeg"><button type="button" data-p="tableau">Tableau</button><button type="button" data-p="liste">Liste</button></div></div>
      <div class="row"><button class="btn btn-primary" id="pvBtn" type="button" style="font-size:1rem; padding:.7em 1.4em;">APERÇU DU DOCUMENT</button>
        <button class="btn btn-ghost" id="pvP" type="button">APERÇU — VERSION PARENTS</button><button class="btn btn-ghost" id="pvE" type="button">APERÇU — VERSION ÉLÈVES</button></div>
      <label style="display:flex; gap:.5em; align-items:flex-start; margin:1em 0 .6em;"><input type="checkbox" id="valid" style="width:auto; margin-top:.25em;"><span>J'ai relu le contenu et je le valide. Aucun texte rédigé par l'IA n'est définitif sans cette validation.</span></label>
      <div id="dlBox"></div></div>`);
    body.appendChild(s4);
    const drawPres = ()=>s4.querySelectorAll('#presSeg button').forEach(b=>b.classList.toggle('on', b.dataset.p===(E.data.presentation==='liste'?'liste':'tableau')));
    s4.querySelectorAll('#presSeg button').forEach(b=>b.onclick = ()=>{ E.data.presentation = b.dataset.p; drawPres(); });
    drawPres();
    let dlBtns = [];
    const valid = s4.querySelector('#valid');
    const download = async (v,f,lg)=>{ try{ await pedaDownload(E.type, E.data, v, f, lg); }catch(e){ alert(e.message); } };
    valid.onchange = ()=>{ E.valide = valid.checked; refreshState(); };
    function drawDl(){
      const box = s4.querySelector('#dlBox'); box.innerHTML = '';
      ['fr', ...E.langs].forEach(lg=>{
        const sfx = lg==='fr' ? '' : ` (${LANG_LABELS[lg]})`;
        box.appendChild(el(`<div class="muted" style="font-size:.8rem; letter-spacing:.06em; margin-top:.6em;">VERSION PARENTS${sfx.toUpperCase()}, feuille Letter, une fiche par feuille</div>`));
        const r1 = el(`<div class="row" style="margin:.3em 0 .6em;"></div>`);
        [['docx','Word'],['pdf','PDF']].forEach(([f,l])=>{ const b = el(`<button class="btn btn-primary btn-sm dl" type="button">TÉLÉCHARGER ${l.toUpperCase()}, PARENTS${sfx}</button>`); b.onclick = ()=>download('parents', f, lg); r1.appendChild(b); });
        box.appendChild(r1);
        box.appendChild(el(`<div class="muted" style="font-size:.8rem; letter-spacing:.06em;">VERSION ÉLÈVES${sfx.toUpperCase()}, deux fiches identiques de 8,5 x 5,5 po par feuille Letter, prêtes à découper</div>`));
        const r2 = el(`<div class="row" style="margin:.3em 0;"></div>`);
        [['docx','Word'],['pdf','PDF']].forEach(([f,l])=>{ const b = el(`<button class="btn btn-primary btn-sm dl" type="button">TÉLÉCHARGER ${l.toUpperCase()}, ÉLÈVES${sfx}</button>`); b.onclick = ()=>download('eleves', f, lg); r2.appendChild(b); });
        box.appendChild(r2);
      });
      dlBtns = box.querySelectorAll('.dl'); refreshState();
    }
    const openPv = v=>{ if(!E.data.items.length){ alert('Ajoutez au moins un contenu.'); return; } pedaPreview(E.type, E.data, v, (vv,f,lg)=>{ if(!E.valide){ alert("Cochez d'abord la validation du contenu (section 4)."); return; } download(vv,f,lg); }, {onSave: async nd=>{ E.data.items.splice(0, E.data.items.length, ...nd.items); drawItems(); }}); };
    s4.querySelector('#pvBtn').onclick = ()=>openPv('parents'); s4.querySelector('#pvP').onclick = ()=>openPv('parents'); s4.querySelector('#pvE').onclick = ()=>openPv('eleves');
    function refreshState(){ const ok = E.valide && E.data.items.length>0; dlBtns.forEach(b=>{ b.disabled = !ok; b.style.opacity = ok ? '' : '.5'; b.title = ok ? '' : 'Ajoutez des contenus et cochez la validation pour télécharger.'; }); }

    /* 5. Sauvegarde */
    const s5 = el(`<div class="card"><h3 style="margin-top:0;">5. Sauvegarde</h3>
      <div class="field"><label>Titre du document (facultatif — généré automatiquement sinon)</label><input id="titre" value="${escapeHtml(E.titre||'')}"></div>
      <div class="row"><button class="btn btn-primary" id="saveBtn" type="button">SAUVEGARDER</button><button class="btn btn-ghost" id="mesBtn" type="button">Mes documents</button></div>
      <p class="muted" style="font-size:.82rem; margin:.5em 0 0;">Les documents sauvegardés ne sont jamais supprimés automatiquement : vous les supprimez vous-même, quand vous le décidez.</p></div>`);
    s5.querySelector('#titre').oninput = e=>{ E.titre = e.target.value; };
    s5.querySelector('#saveBtn').onclick = async ()=>{
      if(!E.data.items.length){ alert('Ajoutez au moins un contenu avant de sauvegarder.'); return; }
      try{
        ['es','en'].forEach(l=>{ if(!E.langs.includes(l)){ E.data.items.forEach(it=>{ if(it.tr) delete it.tr[l]; }); if(E.data.trInfo) delete E.data.trInfo[l]; } });
        const body_ = {type:E.type, titre:E.titre, data:E.data};
        const d = E.id ? await api(`/api/peda/documents/${E.id}`, {method:'PUT', body:body_}) : await api('/api/peda/documents', {method:'POST', body:body_});
        E.id = d.id; E.titre = d.titre; s5.querySelector('#titre').value = d.titre; alert('Document sauvegardé dans « Mes documents ».');
      }catch(e){ alert(e.message); }
    };
    s5.querySelector('#mesBtn').onclick = ()=>showMes();
    body.appendChild(s5);
    drawItems(); drawDl();
  }

  if(pedaNav.view==='editeur' && pedaNav.editor) showEditor(); else if(pedaNav.view==='mes') showMes(); else showAccueil();
  return wrap;
}

const statsState = {days:30, user:''};
async function statsView(){
  const wrap = el(`<div><h2>Statistiques d'utilisation</h2><p class="muted" style="margin-top:-.4em;">Qui se connecte, à quelle heure, depuis quel appareil et ce que chacun fait dans l'application. Les heures sont celles de votre ordinateur.</p>
    <div class="seg" id="stDays" style="margin:.4em 0 1em;">${[[7,'7 jours'],[30,'30 jours'],[90,'3 mois'],[365,'1 an']].map(([d,l])=>`<button type="button" data-d="${d}" class="${statsState.days===d?'on':''}">${l}</button>`).join('')}</div><div id="stBody"></div></div>`);
  wrap.querySelectorAll('#stDays button').forEach(b=>b.onclick = ()=>{ statsState.days = Number(b.dataset.d); render(); });
  const body = wrap.querySelector('#stBody');
  const fmt = d=>d ? new Date(d).toLocaleString('fr-FR', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) : 'jamais';
  const d = await api(`/api/activity/stats?days=${statsState.days}&tz=${new Date().getTimezoneOffset()}`);
  const T = d.totals;
  body.appendChild(el(`<div class="stats" style="margin-bottom:1.2em;">
    <div class="stat" style="border-top-color:var(--admin);"><div class="num">${T.logins}</div><div class="lbl">Connexions</div></div>
    <div class="stat" style="border-top-color:var(--chart-teal);"><div class="num">${T.activeUsers} / ${T.users}</div><div class="lbl">Comptes actifs</div></div>
    <div class="stat" style="border-top-color:var(--chart-amber);"><div class="num">${T.actions}</div><div class="lbl">Actions (créer, modifier, assigner…)</div></div>
    <div class="stat" style="border-top-color:var(--bad);"><div class="num" style="color:var(--bad);">${T.failed}</div><div class="lbl">Connexions refusées</div></div></div>`));
  // heures de connexion
  const maxH = Math.max(1, ...d.byHour);
  const hours = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">À quelle heure les gens se connectent</h3><div style="display:flex; align-items:flex-end; gap:3px; height:120px;"></div><div style="display:flex; gap:3px; font-size:.65rem; color:var(--ink-soft);"></div></div>`);
  const bars = hours.children[1], labs = hours.children[2];
  d.byHour.forEach((n,h)=>{ bars.appendChild(el(`<div title="${h} h : ${n} connexion(s)" style="flex:1; background:${n?'var(--admin)':'var(--line)'}; height:${n?Math.max(4,Math.round(110*n/maxH)):3}px; border-radius:3px 3px 0 0;"></div>`)); labs.appendChild(el(`<div style="flex:1; text-align:center;">${h%3===0?h:''}</div>`)); });
  body.appendChild(hours);
  // jours
  if(d.byDay.length){
    const maxD = Math.max(1, ...d.byDay.map(x=>x.logins+x.actions));
    const days = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">Activité par jour</h3><div class="dl"></div></div>`);
    d.byDay.slice(-31).reverse().forEach(x=>days.querySelector('.dl').appendChild(el(`<div class="bar-row"><div style="width:90px; font-size:.82rem;">${new Date(x.day+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short', day:'numeric', month:'short'})}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(100*(x.logins+x.actions)/maxD)}%; background:var(--admin);"></div></div><div style="width:150px; text-align:right; font-size:.8rem;">${x.logins} connexion(s), ${x.actions} action(s)</div></div>`)));
    body.appendChild(days);
  }
  // par personne
  const users = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">Par personne</h3><div class="overflow-x"><table><thead><tr><th>Nom</th><th>Rôle</th><th>Connexions</th><th>Actions</th><th>Pages vues</th><th>Dernière activité</th><th>Appareils</th><th></th></tr></thead><tbody></tbody></table></div></div>`);
  d.users.forEach(u=>{
    const tr = el(`<tr><td><strong>${escapeHtml(u.name)}</strong><br><span class="muted" style="font-size:.76rem;">${escapeHtml(u.email||'')}</span></td><td>${u.role==='ADMIN'?'Administrateur':'Professeur'}</td><td>${u.logins}${u.failed?` <span style="color:var(--bad); font-size:.76rem;">(${u.failed} refusée${u.failed>1?'s':''})</span>`:''}</td><td>${u.actions}</td><td>${u.pages}</td><td>${u.lastSeen?fmt(u.lastSeen):'<span class="muted">aucune sur la période</span>'}</td><td style="font-size:.78rem;">${escapeHtml(u.devices.join(' ; ')||'')}</td><td><button class="btn btn-ghost btn-sm" type="button">Détail</button></td></tr>`);
    tr.querySelector('button').onclick = ()=>{ statsState.user = u.id; showRecent(); };
    users.querySelector('tbody').appendChild(tr);
  });
  body.appendChild(users);
  if(d.topActions.length){
    const top = el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">Actions les plus fréquentes</h3></div>`);
    const maxA = d.topActions[0].count;
    d.topActions.forEach(a=>top.appendChild(el(`<div class="bar-row"><div style="width:280px; font-size:.82rem;">${escapeHtml(a.action)}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(100*a.count/maxA)}%; background:var(--chart-teal);"></div></div><div style="width:40px; text-align:right; font-size:.82rem;">${a.count}</div></div>`)));
    body.appendChild(top);
  }
  if(d.devices.length) body.appendChild(el(`<div class="card" style="margin-bottom:1em;"><h3 style="margin-top:0;">Appareils utilisés pour se connecter</h3>${d.devices.map(x=>`<div style="margin:.2em 0; font-size:.88rem;">${escapeHtml(x.name)} : <strong>${x.count}</strong></div>`).join('')}</div>`));
  // journal récent
  const recent = el(`<div class="card"><h3 style="margin-top:0;">Journal récent</h3><div class="field" style="max-width:320px;"><label>Personne</label><select id="stUser"><option value="">Tout le monde</option>${d.users.map(u=>`<option value="${u.id}" ${statsState.user===u.id?'selected':''}>${escapeHtml(u.name)}</option>`).join('')}</select></div><div id="stRecent"><p class="muted">Chargement…</p></div></div>`);
  body.appendChild(recent);
  const KIND = {login:'Connexion', login_failed:'Refusée', action:'Action', page:'Page'};
  async function showRecent(){
    recent.querySelector('#stUser').value = statsState.user;
    const box = recent.querySelector('#stRecent'); box.innerHTML = '<p class="muted">Chargement…</p>';
    try{
      const list = await api(`/api/activity/recent?limit=150${statsState.user?'&userId='+encodeURIComponent(statsState.user):''}`);
      if(!list.length){ box.innerHTML = '<p class="muted">Rien d\'enregistré pour le moment.</p>'; return; }
      box.innerHTML = `<div class="overflow-x"><table><thead><tr><th>Quand</th><th>Qui</th><th>Type</th><th>Ce qui s'est passé</th><th>Appareil</th></tr></thead><tbody>${list.map(r=>`<tr><td style="white-space:nowrap;">${escapeHtml(fmt(r.at))}</td><td>${escapeHtml(r.userName||r.detail||'(inconnu)')}</td><td>${KIND[r.kind]||r.kind}</td><td>${escapeHtml(r.kind==='page'?'Ouvre la page : '+r.action:r.action)}</td><td style="font-size:.78rem;">${escapeHtml(r.device||'')}</td></tr>`).join('')}</tbody></table></div>`;
    }catch(e){ box.textContent = e.message; }
  }
  recent.querySelector('#stUser').onchange = e=>{ statsState.user = e.target.value; showRecent(); };
  showRecent();
  return wrap;
}

/* =========================================================
   STUDENT FLOW — public endpoints only, no login
   ========================================================= */
async function viewStudentEntry(){
  const params = new URLSearchParams(location.search);
  const pre = params.get('session') || '';
  const wrap = el(`<div class="auth-card">
    <button class="link-btn" id="back">&larr; Retour</button>
    <h2 style="margin-top:.6em;">Accès élève</h2>
    <p class="muted">Entrez le code fourni par votre professeur, ou utilisez le lien/QR code reçu.</p>
    <div class="card" style="margin-top:1em;">
      <div class="field"><label>Code de session</label><input id="code" value="${escapeHtml(pre)}" placeholder="ex : AB12CD" style="text-transform:uppercase;"></div>
      <div id="err" style="color:var(--bad); font-size:.85rem; min-height:1.2em;"></div>
      <button class="btn btn-primary big-btn" id="go" style="width:100%; background:var(--student);">Continuer</button>
    </div>
  </div>`);
  wrap.querySelector('#back').onclick = ()=>{ROUTE={view:'home'};render();};
  async function attempt(){
    const token = wrap.querySelector('#code').value.trim();
    const errBox = wrap.querySelector('#err');
    if(!token){ errBox.textContent = 'Merci de saisir un code.'; return; }
    try{
      const data = await api(`/api/sessions/by-token/${encodeURIComponent(token)}`, {auth:false});
      if(data.statut==='préparé'){ errBox.textContent = "La session n'a pas encore été démarrée par le professeur."; return; }
      if(data.statut==='terminé'){ errBox.textContent = 'Cette session est terminée.'; return; }
      ROUTE = {view:'student-id', sessionToken: token.toUpperCase(), sessionId: data.sessionId, examSanitized: data.exam};
      render();
    }catch(e){ errBox.textContent = e.message; }
  }
  wrap.querySelector('#go').onclick = attempt;
  if(pre) setTimeout(attempt, 0);
  return wrap;
}
