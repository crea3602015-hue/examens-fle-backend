<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google" content="notranslate">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Examens FLE — Plateforme d'établissement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --ink:#14213D; --ink-soft:#48577A;
  --paper:#F5F7FA; --paper-raised:#FFFFFF;
  --line: rgba(20,33,61,0.12);
  --admin:#1E3A8A; --admin-soft:#E3EAFB;
  --teacher:#3E4C8C; --teacher-soft:#E8EAF7;
  --student:#C1272D; --student-soft:#FBE8E8;
  --good:#2F7D46; --good-soft:#E4F3E7;
  --bad:#B3261E; --bad-soft:#FBE7E4;
  --radius:10px;
  --serif:'Fraunces', Georgia, serif;
  --sans:'IBM Plex Sans', -apple-system, sans-serif;
  /* Palette fixe pour l'écran de passation d'examen — ne change JAMAIS avec le
     mode sombre du système, pour garantir une bonne lisibilité aux élèves quel
     que soit leur appareil. */
  --exam-ink:#14213D; --exam-bg:#FBEAEA; --exam-card:#FFFFFF; --exam-line:#E3C7C7;
  --exam-accent:#C1272D; --exam-accent-soft:#FBE3E3;
  --exam-good:#2F7D46; --exam-good-soft:#E4F3E7;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#EDEEF3; --ink-soft:#C3C9DA;
    --paper:#12172A; --paper-raised:#1B2138;
    --line: rgba(237,238,243,0.14);
    --admin-soft:#1E2C55; --teacher-soft:#242A4F; --student-soft:#3A1518;
    --good-soft:#122A1B; --bad-soft:#301513;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; margin:0 0 .3em 0; letter-spacing:-0.01em;}
h1{font-size:2rem;} h2{font-size:1.5rem;} h3{font-size:1.15rem;} h4{font-size:1rem;}
p{margin:.3em 0;}
a{color:inherit;}
button{font-family:var(--sans); cursor:pointer; border:none; border-radius:var(--radius); font-size:0.95rem;}
input,select,textarea{font-family:var(--sans); font-size:0.95rem; border-radius:8px; border:1px solid var(--line); padding:.55em .7em; background:var(--paper-raised); color:var(--ink); width:100%; transition:border-color .15s ease, box-shadow .15s ease;}
input:focus,select:focus,textarea:focus{border-color:var(--admin); box-shadow:0 0 0 3px var(--admin-soft);}
button:focus-visible{outline:2px solid currentColor; outline-offset:2px;}
label{font-size:.85rem; color:var(--ink-soft); display:block; margin-bottom:.25em;}
.field{margin-bottom:.9em;}
.btn{padding:.6em 1.1em; font-weight:600; transition:transform .12s ease, box-shadow .15s ease, opacity .15s ease;}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(135deg, var(--ink) 0%, #22335C 100%); color:var(--paper); box-shadow:0 2px 8px rgba(20,33,61,.18);}
.btn-primary:hover{box-shadow:0 6px 18px rgba(20,33,61,.28); transform:translateY(-1px);}
.btn-ghost{background:transparent; color:var(--ink); border:1px solid var(--line);}
.btn-ghost:hover{background:var(--paper); border-color:var(--ink-soft);}
.btn-danger{background:var(--bad); color:white;}
.btn-sm{padding:.4em .75em; font-size:.85rem;}
.btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important;}
.card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:1.2em; box-shadow:0 1px 2px rgba(20,33,61,.04); transition:box-shadow .2s ease, transform .2s ease;}
.container{max-width:1100px; margin:0 auto; padding:0 20px;}
.muted{color:var(--ink-soft);}
.tag{display:inline-block; padding:.15em .6em; border-radius:20px; font-size:.75rem; font-weight:600;}
.row{display:flex; gap:1em; flex-wrap:wrap;}
.grid{display:grid; gap:1em;}
table{width:100%; border-collapse:collapse; font-size:.92rem;}
th,td{text-align:left; padding:.6em .5em; border-bottom:1px solid var(--line);}
th{color:var(--ink-soft); font-weight:600; font-size:.8rem; text-transform:none;}
tbody tr{transition:background .12s ease;}
tbody tr:hover{background:var(--paper);}
.overflow-x{overflow-x:auto;}
.hidden{display:none !important;}
.banner{background:var(--admin-soft); border-radius:var(--radius); padding:.8em 1em; font-size:.85rem; margin-bottom:1em;}
.banner-error{background:var(--bad-soft); color:var(--bad);}
.link-btn{background:none;border:none;color:inherit;text-decoration:underline;padding:0;font:inherit;cursor:pointer;}

/* Palette étendue pour les graphiques — la marque reste bleu/blanc/rouge,
   mais les données (barres, anneaux) peuvent respirer avec plus de teintes. */
:root{
  --chart-teal:#0E9187; --chart-amber:#D9A441; --chart-purple:#7C5CBF; --chart-pink:#D0679B; --chart-coral:#E0724B;
}

#app{min-height:100vh;}
.main, .landing{animation: fade-in-up .35s ease;}
@keyframes fade-in-up{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
.topbar{display:flex; align-items:center; justify-content:space-between; padding:.9em 20px; border-bottom:1px solid var(--line); background:var(--paper-raised);}
.brand{display:flex; align-items:center; gap:.6em; font-family:var(--serif); font-weight:700; font-size:1.15rem;}
.brand .dot{width:10px;height:10px;border-radius:50%;}
.shell{display:flex; min-height:calc(100vh - 58px);}
.sidebar{width:230px; flex:none; border-right:1px solid var(--line); padding:1em .6em;}
.sidebar button{display:block; width:100%; text-align:left; background:none; padding:.6em .8em; border-radius:8px; color:var(--ink-soft); font-weight:500; margin-bottom:.15em; border-left:3px solid transparent; transition:background .12s ease, border-color .12s ease, color .12s ease;}
.sidebar button.active{background:var(--paper); color:var(--ink); font-weight:700;}
.sidebar button:hover{background:var(--paper);}
.main{flex:1; padding:1.6em 24px; max-width:980px;}
.role-admin .sidebar button.active{background:var(--admin-soft); color:var(--admin); border-left-color:var(--admin);}
.role-teacher .sidebar button.active{background:var(--teacher-soft); color:var(--teacher); border-left-color:var(--teacher);}

.landing{max-width:760px;margin:0 auto;padding:6vh 20px 4vh;text-align:center; position:relative;}
.landing::before{content:''; position:absolute; top:-4vh; left:50%; transform:translateX(-50%); width:120%; height:340px; z-index:-1;
  background:radial-gradient(ellipse at top, var(--admin-soft) 0%, transparent 65%);}
.role-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1em; margin-top:2em;}
@media (max-width:900px){.role-grid{grid-template-columns:1fr 1fr;}}
@media (max-width:520px){.role-grid{grid-template-columns:1fr;}}
.role-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; padding:1.6em 1.2em; text-align:left; transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease; box-shadow:0 1px 3px rgba(20,33,61,.05);}
.role-card:hover{transform:translateY(-4px); box-shadow:0 14px 28px rgba(20,33,61,.14); border-color:transparent;}
.role-card h3{margin-bottom:.2em;}
.swatch{width:48px;height:48px;border-radius:14px;margin-bottom:.8em; display:flex; align-items:center; justify-content:center; font-size:1.5rem;}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8em; margin-bottom:1.4em;}
.stat{background:var(--paper-raised); border:1px solid var(--line); border-top:3px solid var(--admin); border-radius:var(--radius); padding:1em; transition:transform .15s ease, box-shadow .15s ease;}
.stat:hover{transform:translateY(-3px); box-shadow:0 10px 20px rgba(20,33,61,.1);}
.stat .num{font-family:var(--serif); font-size:1.9rem; font-weight:600;}
.stat .lbl{font-size:.8rem; color:var(--ink-soft);}
.bar-row{display:flex; align-items:center; gap:.7em; margin:.35em 0; min-height:1.8em;}
.bar-row>div:first-child{overflow-wrap:anywhere; line-height:1.25;}
.bar-row .bar-track{flex:1; min-width:60px;}
.bar-track{flex:1; height:10px; border-radius:6px; background:var(--paper); overflow:hidden;}
.bar-fill{height:100%; border-radius:6px; transition:width .5s ease;}

.section-block{border:1px solid var(--line); border-radius:var(--radius); padding:1em; margin-bottom:1em; background:var(--paper-raised);}
.question-block{border:1px dashed var(--line); border-radius:8px; padding:.9em; margin:.7em 0; background:var(--paper);}
.qtype-badge{font-size:.72rem; padding:.15em .5em; border-radius:6px; background:var(--paper-raised); border:1px solid var(--line);}

.exam-shell{min-height:100vh; background:var(--exam-bg); color:var(--exam-ink); display:flex; flex-direction:column;}
.exam-header{display:flex; justify-content:space-between; align-items:center; padding:.8em 1.2em; background:var(--exam-card); color:var(--exam-ink); border-bottom:1px solid var(--exam-line);}
.exam-body{flex:1; max-width:760px; margin:0 auto; padding:1.6em 1.2em; width:100%; color:var(--exam-ink);}
.timer{font-family:var(--serif); font-weight:600; font-size:1.1rem; color:var(--exam-ink);}
.progress-track{height:8px; background:var(--exam-accent-soft); border-radius:6px; overflow:hidden; margin-bottom:1.4em;}
.progress-fill{height:100%; background:var(--exam-accent); border-radius:6px; transition:width .25s;}
.option-btn{display:block; width:100%; text-align:left; padding:.85em 1em; border:2px solid var(--exam-line); border-radius:10px; background:var(--exam-card); color:var(--exam-ink); margin-bottom:.6em; font-size:1rem;}
.option-btn.selected{border-color:var(--exam-accent); background:var(--exam-accent-soft);}
.option-btn:disabled{opacity:.75;}
.big-btn{padding:1em 1.6em; font-size:1.05rem; border-radius:12px;}

.auth-card{max-width:400px; margin:8vh auto; padding:0 20px;}

.kbd-note{font-size:.78rem; color:var(--ink-soft);}
.pair-cols{display:flex; gap:1.2em; margin:.6em 0;}
.pair-col{flex:1;}
.pair-item{padding:.7em .9em; border:2px solid var(--exam-line); border-radius:10px; background:var(--exam-card); color:var(--exam-ink); margin-bottom:.5em; cursor:pointer; font-size:.95rem;}
.pair-item.selected{border-color:var(--exam-accent);}
.pair-item.matched{border-color:var(--exam-good); background:var(--exam-good-soft);}
.rank-item{display:flex; align-items:center; gap:.6em; padding:.6em .8em; border:1px solid var(--exam-line); border-radius:10px; background:var(--exam-card); color:var(--exam-ink); margin-bottom:.5em;}
.rank-item .handle{cursor:grab; color:var(--exam-ink); opacity:.6;}

.image-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.9em; margin:.8em 0;}
.image-tile{border:3px solid var(--exam-line); border-radius:14px; padding:.6em; background:var(--exam-card); color:var(--exam-ink); cursor:pointer; text-align:center;}
.image-tile img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:10px; display:block;}
.image-tile .cap{margin-top:.4em; font-size:.9rem;}
.image-tile.selected{border-color:var(--exam-accent); background:var(--exam-accent-soft);}
.image-tile.matched{border-color:var(--exam-good); background:var(--exam-good-soft);}
.big-audio-btn{display:flex; align-items:center; gap:.6em; padding:.9em 1.3em; border-radius:16px; background:var(--exam-accent); color:white; font-size:1.05rem; font-weight:700; border:none; margin:.6em 0;}
.big-audio-btn:active{transform:scale(.97);}
.draw-toolbar{display:flex; align-items:center; gap:.5em; margin-bottom:.6em; flex-wrap:wrap;}
.color-dot{width:30px; height:30px; border-radius:50%; border:2px solid var(--exam-line); cursor:pointer;}
.color-dot.active{border-color:var(--exam-ink); border-width:3px;}
.draw-canvas-wrap{border:2px solid var(--exam-line); border-radius:14px; overflow:hidden; touch-action:none; background:white;}
.thumb-drawing{max-width:220px; border-radius:10px; border:1px solid var(--line); display:block; margin-top:.4em;}
.passage-box{background:var(--paper); border:1px solid var(--line); border-left:4px solid var(--ink-soft); border-radius:8px; padding:1em; margin:.6em 0; font-size:.95rem; line-height:1.6; white-space:pre-wrap;}
.exam-shell .passage-box{background:var(--exam-card); border-color:var(--exam-line); border-left-color:var(--exam-accent); color:var(--exam-ink);}

.niveau-prescolaire .exam-body{max-width:640px;}
.niveau-prescolaire h3{font-size:1.4rem;}
.niveau-prescolaire .option-btn{font-size:1.2rem; padding:1.1em 1.2em;}
.niveau-prescolaire .image-tile .cap{font-size:1.05rem; font-weight:600;}
.niveau-prescolaire .big-btn{font-size:1.2rem; padding:1.1em 1.8em;}
.niveau-prescolaire .progress-track{height:12px;}
.icon-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}

.loading-screen{display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--ink-soft); font-size:.95rem;}
 *{scrollbar-width:none;} *::-webkit-scrollbar{display:none; width:0; height:0;}
.server-pill{position:fixed; bottom:10px; right:12px; font-size:.72rem; color:var(--ink-soft); background:var(--paper-raised); border:1px solid var(--line); padding:.3em .6em; border-radius:20px; z-index:20;}
.quiz-score-big{font-family:var(--serif); font-size:3rem; font-weight:700; text-align:center; margin:.3em 0;}
.leader-row{display:flex; align-items:center; gap:.7em; padding:.5em 0; border-bottom:1px solid var(--line);}
.leader-row .rank{width:24px; text-align:center; font-weight:700; color:var(--ink-soft);}
.presence-alert{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:200; background:var(--bad); color:white;
  padding:.8em 1.4em; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.25); font-weight:700; max-width:90vw; text-align:center;}
.presence-alert.blink{animation: presence-blink 1s infinite;}
@keyframes presence-blink{ 0%,100%{opacity:1;} 50%{opacity:.55;} }
.presence-alert .names{font-weight:400; font-size:.9rem; margin-top:.2em;}
.install-banner{background:var(--admin-soft); border:2px solid var(--admin); border-radius:14px; padding:1em 1.2em; margin:1.2em auto; max-width:480px; text-align:left;}
.install-banner .row{align-items:center;}
.flash-highlight{outline:3px solid var(--student); outline-offset:3px; border-radius:10px; transition:outline-color .3s;}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; flex-wrap:wrap;}
.seg button{background:var(--paper-raised); color:var(--ink-soft); padding:.45em .9em; border:none; border-right:1px solid var(--line); font-weight:500; font-size:.88rem; border-radius:0;}
.seg button:last-child{border-right:none;}
.seg button.on{background:var(--ink); color:var(--paper); font-weight:700;}
.suivi-pill{display:inline-block; padding:.2em .7em; border-radius:20px; font-size:.78rem; font-weight:600; border:1px solid;}
.suivi-cell{padding:.35em .7em; border:1px solid; border-radius:8px; font-size:.82rem; font-weight:600; width:100%; min-width:120px; text-align:left; cursor:pointer;}
.suivi-cell:hover{filter:brightness(.95);}
.suivi-opt{display:block; width:100%; text-align:left; padding:.6em .8em; border:1px solid; border-radius:10px; font-weight:600; margin-bottom:.4em; cursor:pointer;}

/* Indicateur de travail en cours */
#busyBar{position:fixed; top:0; left:0; right:0; height:4px; z-index:200; overflow:hidden; display:none; background:rgba(20,81,74,.15);}
#busyBar::before{content:""; position:absolute; top:0; bottom:0; width:35%; background:#14514A; animation:busyslide 1.1s ease-in-out infinite;}
@keyframes busyslide{0%{left:-35%} 100%{left:100%}}
#busyPill{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:200; display:none; background:#1C2420; color:#fff; padding:.55em 1.1em; border-radius:999px; font-size:.9rem; box-shadow:0 4px 14px rgba(0,0,0,.25);}
.spin{display:inline-block; animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
/* Clavier de l'application */
#appKb{position:fixed; left:0; right:0; bottom:0; z-index:120; background:#E8E4DA; border-top:2px solid #14514A; padding:.5em .4em calc(.5em + env(safe-area-inset-bottom)); display:none; user-select:none; -webkit-user-select:none; touch-action:manipulation;}
#appKb .kbrow{display:flex; justify-content:center; gap:.3em; margin-bottom:.3em;}
#appKb button{flex:1 1 0; max-width:64px; min-width:0; height:46px; font-size:1.15rem; border:1px solid #B9B3A3; border-radius:8px; background:#fff; color:#1C2420; cursor:pointer; padding:0;}
#appKb button:active{background:#CFE5E0;}
#appKb button.wide{max-width:110px; flex:1.6 1 0;}
#appKb button.space{max-width:none; flex:6 1 0;}
#appKb button.on{background:#14514A; color:#fff;}
#appKb .kbhead{display:flex; justify-content:space-between; align-items:center; font-size:.8rem; color:#555; margin:0 .4em .3em;}
/* Minuteur */
.timer.warn{color:#B45F06;} .timer.alert{color:#B3261E; animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.45}}
#timeToast{position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:150; background:#B45F06; color:#fff; padding:.7em 1.4em; border-radius:12px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.3); display:none; max-width:92vw; text-align:center;}
#timeToast.red{background:#B3261E;}
#lastSecs{position:fixed; inset:0; z-index:140; display:none; align-items:center; justify-content:center; pointer-events:none; font-size:30vw; font-weight:800; color:rgba(179,38,30,.55); font-family:var(--serif);}
#examBlock{position:fixed; inset:0; z-index:160; background:rgba(20,28,26,.94); color:#fff; display:none; align-items:center; justify-content:center; text-align:center; padding:2em;}
#examBlock .inner{max-width:420px;} #examBlock h2{color:#fff; margin-bottom:.4em;}
.pair-item .dot{display:inline-block; width:.8em; height:.8em; border-radius:50%; margin-right:.5em; vertical-align:middle;}
.pair-item.pc{color:var(--exam-ink); font-weight:600;}
.exam-logo{height:34px; max-width:120px; object-fit:contain; margin-right:.6em; vertical-align:middle;}
#dropHint{position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:300; background:#14514A; color:#fff; padding:.8em 1.4em; border-radius:12px; font-weight:600; box-shadow:0 6px 20px rgba(0,0,0,.3); display:none; pointer-events:none; max-width:92vw; text-align:center;}
body.dragging-files label:has(input[type=file]){outline:3px dashed #14514A; outline-offset:3px; background:#E3F1EE;}
.drop-hint{font-size:.78rem; color:var(--ink-soft,#666); margin-left:.5em; vertical-align:middle;}
</style>
</head>

<script>
/* =========================================================
   CONFIG — this build talks to a real backend over HTTP.
   The API base URL is set once by whoever deploys this page
   (or typed in on first load) and stored in localStorage.
   ========================================================= */
const API_BASE_KEY = 'fle_api_base';
const AUTH_KEY = 'fle_auth';
// Adresse du backend déployé — pré-configurée pour que les professeurs et
// élèves n'aient jamais à la saisir. Un administrateur peut toujours la
// changer via le lien "changer" en bas de l'écran (utile si vous redéployez
// le backend ailleurs plus tard).
const DEFAULT_API_BASE = 'https://examens-fle-backend.onrender.com';

function getApiBase(){ return (localStorage.getItem(API_BASE_KEY) || DEFAULT_API_BASE).replace(/\/$/, ''); }
function setApiBase(url){ localStorage.setItem(API_BASE_KEY, url.trim().replace(/\/$/, '')); }
// Chaque onglet a sa propre session : on peut garder ouverts en même temps un compte administrateur et
// plusieurs comptes professeurs (sur le même ordinateur) sans qu'ils se déconnectent les uns les autres.
// localStorage ne sert qu'à rouvrir l'application avec la dernière connexion dans un nouvel onglet.
function getAuth(){
  try{
    const mine = sessionStorage.getItem(AUTH_KEY);
    if(mine) return JSON.parse(mine);
    const last = localStorage.getItem(AUTH_KEY);
    if(last){ sessionStorage.setItem(AUTH_KEY, last); return JSON.parse(last); }
  }catch(e){}
  return null;
}
function setAuth(a){
  try{
    if(a){ const v = JSON.stringify(a); sessionStorage.setItem(AUTH_KEY, v); localStorage.setItem(AUTH_KEY, v); }
    else { sessionStorage.removeItem(AUTH_KEY); /* la déconnexion d'un onglet n'en ferme pas d'autre */ }
  }catch(e){}
}


/* Les mots de passe ne doivent pas être enregistrés par le navigateur (sinon, sur un ordinateur partagé,
   n'importe qui peut choisir le compte d'un collègue). Le champ est masqué par le style, et non par le type
   « password », ce qui empêche le gestionnaire de mots de passe de le mémoriser ou de le remplir. */
(function(){
  const canMask = typeof CSS!=='undefined' && CSS.supports && CSS.supports('-webkit-text-security','disc');
  function harden(root){
    root.querySelectorAll && root.querySelectorAll('input[type="password"]').forEach(inp=>{
      inp.setAttribute('autocomplete', canMask ? 'off' : 'new-password'); inp.setAttribute('data-lpignore','true'); inp.setAttribute('data-form-type','other');
      if(canMask){ inp.type = 'text'; inp.style.webkitTextSecurity = 'disc'; inp.setAttribute('autocapitalize','off'); inp.setAttribute('spellcheck','false'); }
    });
    root.querySelectorAll && root.querySelectorAll('input[type="email"]').forEach(inp=>{ inp.setAttribute('autocomplete','off'); inp.setAttribute('data-lpignore','true'); });
  }
  new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType===1){ if(n.matches && (n.matches('input[type="password"]')||n.matches('input[type="email"]'))) harden({querySelectorAll:()=>[n]}); harden(n); } })))
    .observe(document.documentElement, {childList:true, subtree:true});
})();

/** Indicateur « travail en cours » : barre en haut de l'écran dès qu'une opération dure plus d'un instant. */
let BUSY_N = 0, BUSY_T = null;
function busyStart(label){
  BUSY_N++;
  if(BUSY_N===1){ clearTimeout(BUSY_T); BUSY_T = setTimeout(()=>{
    let bar = document.getElementById('busyBar'), pill = document.getElementById('busyPill');
    if(!bar){ bar = document.createElement('div'); bar.id='busyBar'; document.body.appendChild(bar); pill = document.createElement('div'); pill.id='busyPill'; pill.textContent='Traitement en cours, merci de patienter…'; document.body.appendChild(pill); }
    bar.style.display='block'; pill.style.display='block';
  }, 350); }
}
function busyEnd(){
  BUSY_N = Math.max(0, BUSY_N-1);
  if(BUSY_N===0){ clearTimeout(BUSY_T); const b=document.getElementById('busyBar'), p=document.getElementById('busyPill'); if(b) b.style.display='none'; if(p) p.style.display='none'; }
}

/** Core fetch wrapper. Throws Error with a French, user-facing message on failure. */
async function api(path, {method='GET', body, auth=true, raw=false} = {}){
  const base = getApiBase();
  if(!base) throw new Error("Adresse du serveur non configurée.");
  const headers = {'Content-Type':'application/json'};
  const a = getAuth();
  if(auth && a && a.token) headers['Authorization'] = 'Bearer ' + a.token;
  let res;
  const quiet = /\/presence|\/incident|\/activity\/ping|\/live$|\/api\/attempts\/[^/?]+$/.test(path); // appels de fond : pas d'indicateur
  if(!quiet) busyStart();
  try{
    try{
      res = await fetch(base + path, {method, headers, body: body !== undefined ? JSON.stringify(body) : undefined});
    }catch(e){
      throw new Error("Impossible de joindre le serveur. Vérifiez votre connexion ou l'adresse configurée.");
    }
    if(raw){ if(!quiet) busyEnd(); const rr = res; return rr; }
  }catch(e){ if(!quiet) busyEnd(); throw e; }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!quiet) busyEnd();
  if(!res.ok){
    if(res.status===401){ setAuth(null); SESSION = null; }
    const err = new Error((data && data.error) || ('Erreur ' + res.status));
    err.status = res.status; err.data = data;
    throw err;
  }
  return data;
}

async function downloadFromApi(path, filename){
  const res = await api(path, {raw:true});
  if(!res.ok){ alert("Impossible de télécharger ce fichier."); return; }
  const blob = await res.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}

/** Uploads an image/audio File to the backend and returns its absolute URL —
    usable directly wherever a media URL is expected (question media, project
    image, school logo...). Keeps files small (2 Mo max, enforced server-side). */
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadSchoolLogo(file, onStatus){
  if(file.size > 2*1024*1024){ throw new Error(`Fichier trop lourd (${Math.round(file.size/1024)} Ko) — compressez-le, 2 Mo maximum.`); }
  onStatus?.('Envoi en cours…');
  const dataBase64 = await fileToBase64(file);
  const data = await api('/api/uploads', {method:'POST', body:{dataBase64, mimeType:file.type}});
  await api('/api/settings', {method:'PUT', body:{schoolLogoId:data.id}});
  onStatus?.('');
  return getApiBase() + data.path;
}

async function uploadFile(file, onStatus){
  if(file.size > 2*1024*1024){ throw new Error(`Fichier trop lourd (${Math.round(file.size/1024)} Ko) — compressez-le, 2 Mo maximum.`); }
  onStatus?.('Envoi en cours…');

    }catch(e){ status.textContent = ''; alert(e.message); }
  };

  return wrap;
}

/* =========================================================
   RENDER ROOT (async — every view fetches its own data)
   ========================================================= */
async function render(){
  const myGen = ++renderGen;
  const root = document.getElementById('app');
  root.innerHTML = '<div class="loading-screen">Chargement…</div>';
  const wakeupTimer = setTimeout(()=>{
    const ls = root.querySelector('.loading-screen');
    if(ls) ls.innerHTML = 'Réveil du serveur en cours…<br><span class="muted" style="font-size:.8rem;">Ça peut prendre jusqu\'à 50 secondes après une période sans utilisation — c\'est normal, patientez un instant.</span>';
  }, 3000);
  let view;
  try{
    if(ROUTE.view==='setup') view = viewSetup();
    else if(ROUTE.view==='home') view = viewHome();
    else if(ROUTE.view==='admin-login') view = viewLogin('admin');
    else if(ROUTE.view==='teacher-login') view = viewLogin('teacher');
    else if(ROUTE.view==='access-request') view = viewAccessRequest();
    else if(ROUTE.view==='student-entry') view = await viewStudentEntry();
    else if(ROUTE.view==='student-id') view = viewStudentIdentify();
    else if(ROUTE.view==='student-warning') view = viewStudentWarning();
    else if(ROUTE.view==='student-exam') view = viewStudentExam();
    else if(ROUTE.view==='student-done') view = viewStudentDone();
    else if(ROUTE.view==='quiz-entry') view = await viewQuizEntry();
    else if(ROUTE.view==='quiz-id') view = viewQuizIdentify();
    else if(ROUTE.view==='quiz-play') view = viewQuizPlay();
    else if(ROUTE.view==='quiz-done') view = viewQuizDone();
    else if(ROUTE.view==='admin-shell') view = await viewShell('admin');
    else if(ROUTE.view==='teacher-shell') view = await viewShell('teacher');
    else view = viewHome();
  }catch(e){
    view = el(`<div class="auth-card"><div class="card banner banner-error"><strong>Erreur</strong><p>${escapeHtml(e.message||String(e))}</p></div>
      <button class="btn btn-ghost" id="backHome">Retour à l'accueil</button></div>`);
    view.querySelector('#backHome').onclick = ()=>{ ROUTE={view:'home'}; render(); };
  }
  if(myGen !== renderGen) return; // a newer render started meanwhile — drop this one
  clearTimeout(wakeupTimer);
  root.innerHTML = '';
  root.appendChild(view);
  const pill = el(`<div class="server-pill">Serveur : ${escapeHtml(getApiBase().replace(/^https?:\/\//,''))} · <button class="link-btn" id="chgServer">changer</button></div>`);
  pill.querySelector('#chgServer').onclick = ()=>{ ROUTE={view:'setup'}; render(); };
  if(ROUTE.view==='admin-shell' || ROUTE.view==='teacher-shell') root.appendChild(pill);
}

/** Word (.docx) généré par le serveur : le logo de l'examen et les images des questions sont intégrés. */
async function downloadExamWord(exam, answers){
  const name = (exam.titre||'examen').replace(/[^\w\-À-ÿ ]/g,'').trim().replace(/\s+/g,'_') + (answers ? '_professeur' : '') + '.docx';
  try{
    const res = await api('/api/export/exam-word', {method:'POST', body:{exam:{...exam}, answers:!!answers}, raw:true});
    if(!res.ok) throw new Error('serveur');
    const blob = await res.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  }catch(e){
    // Serveur pas à jour ou injoignable : ancienne méthode (fichier Word simple)
    await downloadWordDoc(name.replace(/\.docx$/,'.doc'), examToWordHTML(exam, examLogoUrl(exam)));
  }
}
function examLogoUrl(exam){ return exam && exam.logoId ? `${getApiBase()}/api/uploads/${exam.logoId}` : ''; }
function examToWordHTML(exam, logoUrl){
  let body = `${logoUrl ? `<img src="${logoUrl}" style="height:60px; float:right;">` : ''}<h1 style="font-family:Georgia,serif;">${escapeHtml(exam.titre)}</h1>
  <p><em>Niveau : ${escapeHtml(exam.niveau)} · Matière : ${escapeHtml(exam.matiere||'Français')} — Total : ${examTotalPoints(exam)} points</em></p>`;
  exam.sections.forEach((sec,si)=>{
    body += `<h2 style="font-family:Georgia,serif; border-bottom:1px solid #999;">SECTION ${si+1} — ${escapeHtml(sec.titre)} (${sectionPoints(sec)} points)</h2>`;
    if(sec.consigne) body += `<p><em>${escapeHtml(sec.consigne)}</em></p>`;
    sec.questions.forEach((q,qi)=>{
      if(q.passage){ body += `<p style="border-left:3px solid #999; padding-left:.8em; color:#333;">${escapeHtml(q.passage).replace(/\n/g,'<br>')}</p>`; }
      body += `<p><strong>Question ${qi+1}</strong> (${q.points} pt${q.points>1?'s':''}, ${escapeHtml(qLabel(q.type))})<br>${escapeHtml(q.enonce||'')}</p>`;
      if(q.type==='choix_unique' || q.type==='choix_multiple'){
        body += '<ul>' + (q.options||[]).map(o=>`<li>${escapeHtml(o)}</li>`).join('') + '</ul>';
      } else if(q.type==='association'){
        body += '<ul>' + (q.pairs||[]).map(p=>`<li>${escapeHtml(p.left)} — ${escapeHtml(p.right)}</li>`).join('') + '</ul>';
      } else if(q.type==='classement'){
        body += '<ol>' + (q.items||[]).map(i=>`<li>${escapeHtml(i)}</li>`).join('') + '</ol>';
      } else if(q.type==='classification'){
        body += `<p><em>Catégories : ${(q.categories||[]).map(escapeHtml).join(' · ')}</em></p><ul>` + (q.elements||[]).map(e=>`<li>${escapeHtml(e.texte)} : ________</li>`).join('') + '</ul>';
      } else if(q.type==='texte_trous'){
        body += `<p>${escapeHtml(q.textTemplate||'')}</p>`;
      } else if(q.type==='production_orale' && (q.criteres||[]).length){
        body += '<table border="1" cellpadding="6" style="border-collapse:collapse;"><tr><th>Critère</th><th>Points</th></tr>' + q.criteres.map(c=>`<tr><td>${escapeHtml(c.titre)}</td><td>____ / ${c.points}</td></tr>`).join('') + '</table>';
      } else {
        body += '<p>_______________________________________</p>';
      }
    });
  });
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${escapeHtml(exam.titre)}</title></head>
  <body style="font-family:Calibri, Arial, sans-serif;">${body}</body></html>`;
}
async function downloadWordDoc(filename, html){
  // Les images (logo, images des questions) sont intégrées au fichier : sans cela Word ne les affiche pas hors ligne.
  const parts = []; const map = {};
  const urls = [...new Set([...html.matchAll(/<img[^>]*\ssrc="([^"]+)"/g)].map(m=>m[1]))].filter(u=>/^https?:/.test(u));
  busyStart();
  try{
    for(const u of urls){
      try{
        const r = await fetch(u); if(!r.ok) continue;
        const blob = await r.blob();
        const b64 = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
        const ext = (blob.type.split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'');
        const name = `image${parts.length+1}.${ext}`;
        map[u] = 'file:///C:/exam/'+name; parts.push({name, type: blob.type||'image/png', b64});
      }catch(e){}
    }
  } finally { busyEnd(); }
  let out = html; Object.keys(map).forEach(u=>{ out = out.split('src="'+u+'"').join('src="'+map[u]+'"'); });
  const utf8b64 = str=>{ const bytes = new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin); };
  const chunk = t=>t.replace(/(.{76})/g,'$1\r\n');
  const B = '----=_NextPart_examen';
  let mht = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/exam/document.htm\r\n\r\n${chunk(utf8b64(out))}\r\n`;
  parts.forEach(pt=>{ mht += `--${B}\r\nContent-Type: ${pt.type}\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/exam/${pt.name}\r\n\r\n${chunk(pt.b64)}\r\n`; });
  mht += `--${B}--\r\n`;
  const blob = new Blob([mht], {type:'application/msword'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
}
async function parseWordFile(file){
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({arrayBuffer: buf});
  const lines = result.value.split('\n').map(l=>l.trim()).filter(Boolean);
  const draft = { titre: file.name.replace(/\.docx?$/i,''), niveau:'Primaire', navMode:'libre', duree:0, autoriserReprise:true, statut:'brouillon', sections:[], imported:true, verified:false };
  let currentSection = null;
  lines.forEach(line=>{
    const secMatch = line.match(/^(section|partie)\s*\d*\s*[-–—:]?\s*(.*)$/i);
    const qMatch = line.match(/^(question\s*\d+|q\d+|\d+[.)])\s*[-–—:]?\s*(.*)$/i);
    if(secMatch){
      currentSection = {id:'sec_'+Math.random().toString(36).slice(2,9), titre: secMatch[2] || line, questions:[]};
      draft.sections.push(currentSection);
    } else if(qMatch){
      if(!currentSection){ currentSection = {id:'sec_'+Math.random().toString(36).slice(2,9), titre:'Section importée', questions:[]}; draft.sections.push(currentSection); }
      const ptsMatch = line.match(/\((\d+)\s*points?\)|\/(\d+)\b/i);
      const pts = ptsMatch ? Number(ptsMatch[1]||ptsMatch[2]) : 1;
      currentSection.questions.push({id:'q_'+Math.random().toString(36).slice(2,9), type:'correction_manuelle', enonce: qMatch[2] || line, points: pts, media:''});
    } else if(currentSection && currentSection.questions.length===0 && !draft.titre){
      draft.titre = line;
    }
  });
  if(draft.sections.length===0){
    draft.sections.push({id:'sec_'+Math.random().toString(36).slice(2,9), titre:'Contenu importé (à structurer)', questions:[{id:'q_'+Math.random().toString(36).slice(2,9), type:'correction_manuelle', enonce: lines.join(' '), points:1, media:''}]});
  }
  return draft;
}

/** Liste tout ce qui empêche (erreur) ou mérite attention (remarque) avant de publier. */
function examIssues(draft){
  const issues = [];
  if(!(draft.titre||'').trim()) issues.push({lvl:'error', msg:"Donnez un titre à l'examen."});
  if(!draft.sections.length) issues.push({lvl:'error', msg:"Ajoutez au moins une partie."});
  let cibleTotal = 0, hasCible = false;
  draft.sections.forEach((sec,si)=>{
    const name = (sec.titre||'').trim() || ('Partie '+(si+1));
    const pts = sectionPoints(sec);
    if(sec.cible){ hasCible = true; cibleTotal += Number(sec.cible); }
    if(!sec.questions.length) issues.push({lvl:'error', sec:sec.id, msg:`« ${name} » ne contient encore aucune question.`});
    else if(sec.cible && Math.abs(pts-Number(sec.cible))>0.001) issues.push({lvl:'warn', sec:sec.id, msg:`« ${name} » : ${pts} points au lieu des ${sec.cible} visés.`});
    sec.questions.forEach((q,qi)=>{
      const where = `« ${name} », question ${qi+1}`;
      const at = {sec:sec.id, q:q.id};
      const err = m=>issues.push({lvl:'error', ...at, msg:`${where} : ${m}`});
      const warn = m=>issues.push({lvl:'warn', ...at, msg:`${where} : ${m}`});
      if(!(q.enonce||'').trim() && q.type!=='production_orale') err("l'énoncé est vide.");
      if(!(Number(q.points)>0)) err("aucun point attribué.");
      if(q.aSaisir) err("la bonne réponse doit être confirmée.");
      const nonEmpty = a=>(a||[]).filter(x=>String(x||'').trim()).length;
      switch(q.type){
        case 'choix_unique': case 'choix_multiple':
          if(nonEmpty(q.options)<2) err("il faut au moins 2 options.");
          if(q.type==='choix_multiple' && !(q.correct||[]).length) err("cochez au moins une bonne réponse.");
          break;
        case 'texte_court':
          if(!String(q.correct||'').trim()) err("la réponse attendue est vide (choisissez « Question ouverte » pour corriger à la main).");
          break;
        case 'texte_trous': {
          const blanks = ((q.textTemplate||'').match(/___/g)||[]).length;
          const answers = String(q.correct||'').split(',').filter(s=>s.trim()).length;
          if(!blanks) err("aucun blanc « ___ » dans le texte.");
          else if(blanks!==answers) err(`${blanks} blanc(s) mais ${answers} réponse(s) attendue(s).`);
          break; }
        case 'association':
          if((q.pairs||[]).filter(p=>(p.left||'').trim() && (p.right||'').trim()).length<2) err("il faut au moins 2 paires complètes.");
          break;
        case 'classement':
          if(nonEmpty(q.items)<2) err("il faut au moins 2 éléments à classer.");
          break;
        case 'classification': {
          const cats = (q.categories||[]).filter(c=>String(c||'').trim());
          if(cats.length<2) err("il faut au moins 2 catégories.");
          if((q.elements||[]).length<2) err("il faut au moins 2 éléments à classer.");
          else if((q.elements||[]).some(e=>!(e.texte||'').trim() || !cats.includes(e.categorie))) err("chaque élément doit avoir un nom et une catégorie.");
          break; }
        case 'image_choix':
          if((q.options||[]).filter(o=>o.image).length<2) err("il faut au moins 2 images.");
          break;
        case 'association_images':
          if((q.pairs||[]).length<2) err("il faut au moins 2 paires.");
          break;
        case 'production_orale': {
          const cr = q.criteres||[];
          if(cr.length){
            const sum = cr.reduce((a,c)=>a+Number(c.points||0),0);
            if(Math.abs(sum-Number(q.points))>0.001) warn(`la grille totalise ${sum} points pour ${q.points} points : la note sera ramenée proportionnellement.`);
            if(cr.some(c=>!(c.titre||'').trim())) err("un critère de la grille n'a pas de nom.");
          }
          break; }
      }
    });
  });
  if(hasCible && Math.abs(examTotalPoints(draft)-cibleTotal)>0.001){
    issues.push({lvl:'warn', msg:`Total de l'examen : ${examTotalPoints(draft)} points au lieu de ${cibleTotal} visés.`});
  }
  return issues;
}

    body.appendChild(row);

}

/** Grille d'oral type (contenu, prononciation, vocabulaire, fluidité, intonation), mise à l'échelle. */
function defaultRubric(total){
  const base = [['Contenu et respect des consignes',10],['Prononciation',5],['Vocabulaire et syntaxe',5],['Fluidité',3],['Intonation et rythme',2]];
  const crit = base.map(([titre,w])=>({id:rndId('crit_'), titre, points: Math.round(w*total/25)}));
  const diff = total - crit.reduce((a,c)=>a+c.points,0);
  crit[0].points = Math.max(0, crit[0].points + diff);
  return crit;
}

/** Import d'examens préparés (fichiers .json avec images embarquées). */
function openExamImport(onDone){
  const overlay = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; z-index:60; padding:3vh 1em; overflow:auto;">
    <div class="card" style="max-width:700px; width:100%; background:var(--paper-raised);">
      <div class="row" style="justify-content:space-between; align-items:flex-start;"><h3 style="margin:0;">Importer des examens préparés</h3><button class="link-btn" id="impClose">Fermer ✕</button></div>
      <p class="muted" style="font-size:.88rem;">Choisissez un ou plusieurs fichiers <strong>.json</strong> (vous pouvez tous les sélectionner d'un coup). Chaque examen arrive en <strong>brouillon « importé — non vérifié »</strong> : vous le relisez, confirmez les réponses signalées, puis vous le publiez.</p>
      <label class="btn btn-primary btn-sm" style="margin:.4em 0;">Choisir les fichiers…<input type="file" id="impFiles" accept=".json,application/json" multiple style="display:none;"></label>
      <div id="impList" style="margin-top:.6em;"></div>
    </div></div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#impClose').onclick = ()=>{ overlay.remove(); onDone?.(); };
  const list = overlay.querySelector('#impList');
  overlay.querySelector('#impFiles').onchange = async (ev)=>{
    const files = Array.from(ev.target.files); if(!files.length) return;
    list.innerHTML = '';
    let existing = [];
    try{ existing = (await api('/api/exams')).map(x=>x.titre); }catch(e){}
    for(const file of files){
      const row = el(`<div class="row" style="align-items:center; gap:.5em; padding:.35em 0; border-top:1px solid var(--line);"><span class="st spin" style="width:1.4em;">⏳</span><span style="flex:1; font-size:.9rem;">${escapeHtml(file.name)}</span><span class="muted msg" style="font-size:.8rem;"></span></div>`);
      list.appendChild(row);
      const st = row.querySelector('.st'), msg = row.querySelector('.msg');
      try{
        msg.textContent = 'Lecture du fichier…';
        const data = JSON.parse(await file.text());
        if(data.format!=='examens-fle/1') throw new Error('format non reconnu');
        const own = data.source==='examens-fle-app';
        // Même nom déjà utilisé : ce n'est pas un obstacle, l'examen est importé sous « Titre (2) ».
        let titreFinal = data.titre, nTitre = 1;
        while(existing.includes(titreFinal)){ nTitre++; titreFinal = `${data.titre} (${nTitre})`; }
        const keys = Object.keys(data.images||{}); const urls = {};
        let logoId = null;
        if(data.logo && data.logo.data){ msg.textContent = 'Envoi du logo…'; logoId = (await api('/api/uploads', {method:'POST', body:{dataBase64:data.logo.data, mimeType:data.logo.mime}})).id; }
        for(let i=0;i<keys.length;i++){
          msg.textContent = `images ${i+1}/${keys.length}…`;
          const img = data.images[keys[i]];
          const up = await api('/api/uploads', {method:'POST', body:{dataBase64:img.data, mimeType:img.mime}});
          urls[keys[i]] = getApiBase() + up.path;
        }
        const walk = o=>{
          if(Array.isArray(o)) return o.map(walk);
          if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=walk(o[k]); return r; }
          return (typeof o==='string' && o.startsWith('@img:')) ? (urls[o.slice(5)]||'') : o;
        };
        const sections = walk(data.sections).map(sec=>({
          ...sec, id: sec.id || rndId('sec_'),
          questions:(sec.questions||[]).map(q=>{
            const nq = {...q, id: q.id || rndId('q_')};
            if(Array.isArray(nq.pairs) && nq.type==='association_images') nq.pairs = nq.pairs.map(p=>p.id?p:{...p,id:rndId('pr_')});
            if(Array.isArray(nq.criteres)) nq.criteres = nq.criteres.map(c=>c.id?c:{...c,id:rndId('crit_')});
            return nq;
          }),
        }));
        msg.textContent = "Enregistrement de l'examen…";
        await api('/api/exams', {method:'POST', body:{
          titre:titreFinal, niveau:data.niveau, matiere:data.matiere, navMode:data.navMode||'libre', duree:data.duree||0,
          autoriserReprise: data.autoriserReprise!==false, logoId, sections,
          statut: own && data.statut==='publié' ? 'publié' : 'brouillon', imported: !own, verified: own ? true : false,
        }});
        existing.push(titreFinal);
        const nq = sections.reduce((a,s)=>a+s.questions.length,0), ns = sections.reduce((a,s)=>a+s.questions.filter(q=>q.aSaisir).length,0);
        st.classList.remove('spin'); st.textContent='✓'; st.style.color='var(--good)';
        msg.textContent = `${nq} questions · ${ns} réponse(s) à confirmer` + (titreFinal!==data.titre ? ` · nom déjà utilisé : importé sous « ${titreFinal} »` : '');
      }catch(e){ st.classList.remove('spin'); st.textContent='✗'; st.style.color='var(--bad)'; msg.textContent = e.message||'erreur'; }
    }
    list.appendChild(el(`<p class="muted" style="font-size:.85rem; margin-top:.6em;">Terminé. Fermez cette fenêtre pour voir les brouillons dans la bibliothèque.</p>`));
  };
}

/* =========================================================
   CONVERSION D'UN EXAMEN WORD / PDF EN EXAMEN NUMÉRIQUE (IA)
   Le navigateur lit le document, l'IA structure l'examen (parties, types de questions, points,
   réponses), puis un brouillon « importé — non vérifié » est créé pour relecture.
   ========================================================= */
const CONV_LIBS = {
  jszip: 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js',
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.min.mjs',
  pdfworker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/build/pdf.worker.min.mjs',
};
function loadScriptOnce(url, isLoaded){
  return new Promise((resolve, reject)=>{
    if(isLoaded()) return resolve();
    const s = document.createElement('script'); s.src = url; s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error("Impossible de charger l'outil de lecture des documents (vérifiez la connexion internet)."));
    document.head.appendChild(s);
  });
}

/** Lit un .docx : texte (gras repéré par **…**, tableaux par « | », puces par « - »), et position des images [IMAGE n]. */
async function extractDocx(file){
  await loadScriptOnce(CONV_LIBS.jszip, ()=>!!window.JSZip);
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const docFile = zip.file('word/document.xml');
  if(!docFile) throw new Error("Ce fichier n'est pas un document Word (.docx) valide.");
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main', A='http://schemas.openxmlformats.org/drawingml/2006/main',
        R='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const parse = s=>new DOMParser().parseFromString(s,'application/xml');
  const doc = parse(await docFile.async('string'));
  const rels = {};
  const relsFile = zip.file('word/_rels/document.xml.rels');
  if(relsFile) Array.from(parse(await relsFile.async('string')).getElementsByTagName('Relationship')).forEach(r=>{ rels[r.getAttribute('Id')] = r.getAttribute('Target'); });
  const images = []; // {path, crop}
  const kids = (n, name)=>Array.from(n.childNodes).filter(c=>c.nodeType===1 && c.localName===name);
  const first = (n, name)=>kids(n,name)[0] || null;
  const marker = (rid, crop)=>{
    const target = rels[rid]; if(!target) return '';
    const path = target.startsWith('/') ? target.slice(1) : 'word/'+target.replace(/^\.\//,'');
    images.push({path, crop}); return ` [IMAGE ${images.length}] `;
  };
  function runSegments(r, out){
    const rPr = first(r,'rPr'); const b = rPr && first(rPr,'b');
    const bold = !!b && !['0','false'].includes(b.getAttributeNS(W,'val'));
    Array.from(r.childNodes).forEach(c=>{
      if(c.nodeType!==1) return;
      if(c.localName==='t') out.push({t:c.textContent, bold});
      else if(c.localName==='tab') out.push({t:' ', bold:false});
      else if(c.localName==='br' || c.localName==='cr') out.push({t:'\n', bold:false});
      else if(c.localName==='drawing'){
        Array.from(c.getElementsByTagNameNS(A,'blip')).forEach(bl=>{
          const sr = bl.parentNode.getElementsByTagNameNS(A,'srcRect')[0]; let crop = null;
          if(sr) crop = {l:+sr.getAttribute('l')||0, t:+sr.getAttribute('t')||0, r:+sr.getAttribute('r')||0, b:+sr.getAttribute('b')||0};
          out.push({t:marker(bl.getAttributeNS(R,'embed'), crop), bold:false});
        });
      } else if(c.localName==='pict'){
        Array.from(c.getElementsByTagName('*')).filter(x=>x.localName==='imagedata').forEach(im=>out.push({t:marker(im.getAttributeNS(R,'id'), null), bold:false}));
      }
    });
  }
  function walk(n, out){
    Array.from(n.childNodes).forEach(c=>{
      if(c.nodeType!==1) return;
      if(c.localName==='r') runSegments(c, out);
      else if(['hyperlink','ins','smartTag','fldSimple','sdt','sdtContent'].includes(c.localName)) walk(c, out);
    });
  }
  function paragraph(p){
    const segs = []; walk(p, segs);
    let s = '', i = 0;
    while(i<segs.length){
      if(segs[i].bold){ let j=i, txt=''; while(j<segs.length && segs[j].bold){ txt += segs[j].t; j++; } const m = txt.match(/^(\s*)([\s\S]*?)(\s*)$/); s += m[2] ? `${m[1]}**${m[2]}**${m[3]}` : txt; i=j; }
      else { s += segs[i].t; i++; }
    }
    s = s.replace(/[ \t]+/g,' ').trim();
    const pPr = first(p,'pPr'); if(s && pPr && first(pPr,'numPr')) s = '- '+s;
    return s;
  }
  const lines = [];
  function block(n){
    Array.from(n.childNodes).forEach(c=>{
      if(c.nodeType!==1) return;
      if(c.localName==='p'){ const s = paragraph(c); if(s) lines.push(s); }
      else if(c.localName==='tbl'){
        kids(c,'tr').forEach(tr=>{
          const cells = kids(tr,'tc').map(tc=>{ const parts=[]; const sub=[]; kids(tc,'p').forEach(p=>{ const s=paragraph(p); if(s) parts.push(s); }); kids(tc,'tbl').forEach(()=>{}); return parts.join(' / '); });
          if(cells.some(x=>x)) lines.push(cells.join(' | '));
        });
      } else if(c.localName==='sdt'){ const content = first(c,'sdtContent'); if(content) block(content); }
    });
  }
  block(doc.getElementsByTagNameNS(W,'body')[0]);
  return {text: lines.join('\n').replace(/\n{3,}/g,'\n\n').trim(), images, zip};
}

/** Regroupe les morceaux de texte d'une page PDF en lignes (les grands espaces deviennent « | » : colonnes de tableau). */
function pdfItemsToText(items){
  const rows = [];
  items.filter(it=>it.str!==undefined && it.transform).forEach(it=>{
    const y = it.transform[5], x = it.transform[4];
    let row = rows.find(r=>Math.abs(r.y-y) <= Math.max(2,(it.height||8)*0.45));
    if(!row){ row = {y, items:[]}; rows.push(row); }
    row.items.push({x, w:it.width||0, s:it.str});
  });
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>{
    r.items.sort((a,b)=>a.x-b.x); let line='', end=null;
    r.items.forEach(i=>{
      if(end!==null){ const gap = i.x-end; if(gap>30) line += ' | '; else if(gap>1.5 && !line.endsWith(' ') && !i.s.startsWith(' ')) line += ' '; }
      line += i.s; end = i.x+i.w;
    });
    return line.replace(/\s+$/,'');
  }).filter(l=>l.trim()).join('\n');
}
async function extractPdf(file){
  const pdfjs = await import(CONV_LIBS.pdfjs);
  pdfjs.GlobalWorkerOptions.workerSrc = CONV_LIBS.pdfworker;
  const pdf = await pdfjs.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let text = '';
  for(let i=1;i<=pdf.numPages;i++){ const page = await pdf.getPage(i); const c = await page.getTextContent(); text += pdfItemsToText(c.items) + '\n\n'; }
  return text.trim();
}

/** Découpe un long texte en parties (l'IA traite chaque partie séparément), de préférence entre deux exercices. */
function splitText(text, max){
  if(text.length <= max) return [text];
  const lines = text.split('\n'), parts = []; let cur = '';
  lines.forEach(l=>{
    if(cur.length + l.length + 1 > max && cur){ parts.push(cur); cur = ''; }
    cur += (cur ? '\n' : '') + l;
  });
  if(cur) parts.push(cur);
  return parts;
}
function mergeConverted(results){
  const out = {titre:null, total:null, sections:[]};
  results.forEach(r=>{
    if(!out.titre && r.titre) out.titre = r.titre; if(out.total==null && r.total) out.total = r.total;
    (r.sections||[]).forEach(sec=>{
      const last = out.sections[out.sections.length-1];
      if(last && last.titre.toLowerCase()===String(sec.titre).toLowerCase()){ last.questions.push(...sec.questions); if(!last.cible && sec.cible) last.cible = sec.cible; }
      else out.sections.push(sec);
    });
  });
  return out;
}

/** Image d'un .docx (avec recadrage éventuel) réduite à 900 px et compressée. */
async function compressDocxImage(zip, im){
  const f = zip.file(im.path); if(!f) return null;
  const ext = im.path.split('.').pop().toLowerCase();
  const mime = {png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', webp:'image/webp'}[ext];
  if(!mime) return null; // formats vectoriels (emf, wmf) non pris en charge
  const b64 = await f.async('base64');
  const img = await new Promise((res,rej)=>{ const i = new Image(); i.onload = ()=>res(i); i.onerror = ()=>rej(new Error('image illisible')); i.src = `data:${mime};base64,${b64}`; });
  const c = im.crop || {l:0,t:0,r:0,b:0};
  const sx = img.width*c.l/100000, sy = img.height*c.t/100000;
  const sw = img.width*(1-(c.l+c.r)/100000), sh = img.height*(1-(c.t+c.b)/100000);
  if(sw<24 || sh<24) return null; // décorations minuscules
  const k = Math.min(1, 900/Math.max(sw,sh));
  const canvas = document.createElement('canvas'); canvas.width = Math.round(sw*k); canvas.height = Math.round(sh*k);
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  let q = 0.82, data = canvas.toDataURL('image/jpeg', q);
  while(data.length > 2.4e6 && q > 0.4){ q -= 0.15; data = canvas.toDataURL('image/jpeg', q); }
  return {mime:'image/jpeg', data:data.split(',')[1]};
}

/** Envoie les images puis crée l'examen en brouillon « importé — non vérifié ». */
async function importExamData(data){
  const urls = {};
  for(const key of Object.keys(data.images||{})){
    const img = data.images[key];
    const up = await api('/api/uploads', {method:'POST', body:{dataBase64:img.data, mimeType:img.mime}});
    urls[key] = getApiBase() + up.path;
  }
  const walk = o=>{
    if(Array.isArray(o)) return o.map(walk);
    if(o && typeof o==='object'){ const r={}; for(const k in o) r[k]=walk(o[k]); return r; }
    return (typeof o==='string' && o.startsWith('@img:')) ? (urls[o.slice(5)]||'') : o;
  };
  const sections = walk(data.sections).map(sec=>({
    ...sec, id: sec.id || rndId('sec_'),
    questions:(sec.questions||[]).map(q=>{
      const nq = {...q, id: q.id || rndId('q_')};
      if(nq.media===''){ delete nq.media; }
      if(Array.isArray(nq.criteres)) nq.criteres = nq.criteres.map(c=>c.id?c:{...c,id:rndId('crit_')});
      return nq;
    }),
  }));
  return api('/api/exams', {method:'POST', body:{
    titre:data.titre, niveau:data.niveau, matiere:data.matiere, navMode:data.navMode||'libre', duree:data.duree||0,
    autoriserReprise:true, statut:'brouillon', sections, imported:true, verified:false,
  }});
}

async function convertExamFile(file, opts, step){
  const ext = (file.name.split('.').pop()||'').toLowerCase();
  let text, docx = null;
  step('Lecture du document…');
  if(ext==='docx'){ docx = await extractDocx(file); text = docx.text; }
  else if(ext==='pdf'){ text = await extractPdf(file); }
  else throw new Error(ext==='doc' ? "Les anciens fichiers .doc ne peuvent pas être lus : enregistrez-le en .docx (Fichier, Enregistrer sous) ou en PDF." : "Format non pris en charge : choisissez un fichier Word (.docx) ou PDF.");
  if(text.replace(/\s+/g,'').length < 40) throw new Error("Aucun texte lisible dans ce document (PDF scanné ?). Utilisez un PDF ou un Word contenant du vrai texte.");
  const imageCount = docx ? docx.images.length : 0;
  const chunks = splitText(text, 9000), results = [];
  for(let i=0;i<chunks.length;i++){
    step(`Conversion par l'IA — partie ${i+1} sur ${chunks.length}…`);
    results.push(await api('/api/convert/exam', {method:'POST', body:{text:chunks[i], part:i+1, parts:chunks.length, niveau:opts.niveau, matiere:opts.matiere, imageCount}}));
  }
  const merged = mergeConverted(results);
  const used = new Set(); JSON.stringify(merged.sections).replace(/@img:(\d+)/g,(m,n)=>{ used.add(Number(n)); return m; });
  const images = {};
  if(docx && used.size){
    step('Préparation des images…');
    for(const n of used){ try{ const c = await compressDocxImage(docx.zip, docx.images[n-1]); if(c) images[String(n)] = c; }catch(e){} }
  }
  // une image impossible à récupérer ne doit pas laisser de référence cassée
  merged.sections.forEach(s=>s.questions.forEach(q=>{ const m = /^@img:(\d+)$/.exec(q.media||''); if(m && !images[m[1]]) delete q.media; }));
  const data = {titre: merged.titre || file.name.replace(/\.[^.]+$/,''), niveau:opts.niveau, matiere:opts.matiere, navMode:'libre', duree:0, sections:merged.sections, images};
  step('Création du brouillon…');
  const exam = await importExamData(data);
  const qs = merged.sections.flatMap(s=>s.questions);
  return {exam, nq:qs.length, points:Math.round(qs.reduce((a,q)=>a+Number(q.points||0),0)*100)/100, aSaisir:qs.filter(q=>q.aSaisir).length,
          estimes:qs.filter(q=>q.pointsEstimes).length, declared:merged.total, nimg:Object.keys(images).length};
}

/** Suppression définitive d'un examen : avertit de tout ce qui sera effacé. */
/** Télécharge une copie complète de l'examen (images et logo compris) : réimportable plus tard, sans rien changer. */
async function exportExamFile(exam, onStatus){
  const images = {}; const idx = new Map(); let n = 0;
  const base = getApiBase();
  const grab = async url=>{
    if(!url || typeof url!=='string' || !/\/api\/uploads\//.test(url)) return url;
    if(idx.has(url)) return idx.get(url);
    n++; onStatus && onStatus(`Préparation des images (${n})…`);
    try{
      const r = await fetch(url.startsWith('http') ? url : base+url); if(!r.ok) return url;
      const blob = await r.blob();
      const b64 = await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]); fr.readAsDataURL(blob); });
      const name = 'img'+n+'.'+((blob.type.split('/')[1]||'bin').replace('jpeg','jpg'));
      images[name] = {mime: blob.type, data: b64}; const ph = '@img:'+name; idx.set(url, ph); return ph;
    }catch(e){ return url; }
  };
  const walk = async o=>{
    if(Array.isArray(o)){ const r=[]; for(const x of o) r.push(await walk(x)); return r; }
    if(o && typeof o==='object'){ const r={}; for(const k in o) r[k] = await walk(o[k]); return r; }
    return typeof o==='string' ? await grab(o) : o;
  };
  busyStart();
  try{
    const sections = await walk(JSON.parse(JSON.stringify(exam.sections)));
    let logo = null;
    if(exam.logoId){ const ph = await grab(`${base}/api/uploads/${exam.logoId}`); if(ph && images[ph.slice(5)]){ logo = images[ph.slice(5)]; delete images[ph.slice(5)]; } }
    const data = {format:'examens-fle/1', source:'examens-fle-app', titre:exam.titre, niveau:exam.niveau, matiere:exam.matiere, navMode:exam.navMode, duree:exam.duree,
      autoriserReprise: exam.autoriserReprise, statut: exam.statut, verified:true, logo, images, sections};
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = (exam.titre||'examen').replace(/[^\w\-À-ÿ ]/g,'').trim().replace(/\s+/g,'_') + '.json'; a.click();
  } finally { busyEnd(); onStatus && onStatus(''); }
}
