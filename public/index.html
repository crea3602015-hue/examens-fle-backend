/* =========================================================
   QUIZ (professeur/admin) — génération IA gratuite, tout en mémoire
   ========================================================= */
async function quizView(user){
  const wrap = el(`<div><h2>Quiz</h2>
    <p class="muted" style="font-size:.85rem;">Un petit quiz rapide, généré par IA ou créé à la main. Rien n'est enregistré : une fois réinitialisé, tout est effacé.</p>
    <div id="activeList"></div>
    <div id="quizHost"></div>
  </div>`);
  const host = wrap.querySelector('#quizHost');
  const activeList = wrap.querySelector('#activeList');
  try{
    const active = await api('/api/quiz/sessions');
    if(active.length){
      activeList.appendChild(el(`<h3 style="margin-top:0;">Quiz en cours</h3>`));
      active.forEach(s=>{
        const row = el(`<button class="card" style="display:block; width:100%; text-align:left; margin-bottom:.6em; cursor:pointer;">
          <strong>${escapeHtml(s.title)}</strong> — <span class="muted">${s.code} · ${s.studentCount} élève(s) · ${s.status==='running'?'en cours':'en préparation'}</span>
        </button>`);
        row.onclick = ()=> drawSessionStep(host, user, s.code);
        activeList.appendChild(row);
      });
    }
  }catch(e){}
  drawGenerateStep(host, user);
  return wrap;
}

function drawGenerateStep(host, user){
  host.innerHTML = '';
  const box = el(`<div class="card">
    <div class="field"><label>Sujet du quiz</label><input id="topic" placeholder="ex : le futur simple, les animaux, la géographie de la France"></div>
    <div class="row">
      <div class="field" style="flex:1;"><label>Niveau</label><select id="niveau"><option>Préscolaire</option><option selected>Primaire</option><option>Secondaire</option></select></div>
      <div class="field" style="flex:1;"><label>Nombre de questions</label><input type="number" id="count" value="5" min="3" max="10"></div>
    </div>
    <div class="field"><label>Description (optionnel — affichée aux élèves)</label><input id="qdesc" placeholder="ex : Révision avant le contrôle de vendredi"></div>
    <div class="row">
      <button class="btn btn-primary" id="genBtn">Générer par IA</button>
      <button class="btn btn-ghost" id="manualBtn">Créer manuellement</button>
    </div>
    <p id="genStatus" class="muted" style="font-size:.85rem; margin-top:.5em;"></p>
  </div>`);
  host.appendChild(box);
  box.querySelector('#genBtn').onclick = async ()=>{
    const topic = box.querySelector('#topic').value.trim();
    if(!topic){ alert('Décrivez le sujet du quiz.'); return; }
    const status = box.querySelector('#genStatus');
    status.textContent = 'Génération en cours…';
    try{
      const data = await api('/api/quiz/generate', {method:'POST', body:{
        topic, niveau: box.querySelector('#niveau').value, count: Number(box.querySelector('#count').value)||5,
      }});
      data.description = box.querySelector('#qdesc').value.trim();
      drawReviewStep(host, user, data);
    }catch(e){ status.textContent = ''; alert(e.message); }
  };
  box.querySelector('#manualBtn').onclick = ()=>{
    drawReviewStep(host, user, {title:'Nouveau quiz', description: box.querySelector('#qdesc').value.trim(), questions:[{enonce:'', options:['',''], correct:0}]});
  };
}

function drawReviewStep(host, user, quizData){
  host.innerHTML = '';
  const quiz = JSON.parse(JSON.stringify(quizData));
  const box = el(`<div class="card">
    <div class="banner">Vérifiez et corrigez le quiz avant de le lancer — l'IA peut se tromper.</div>
    <div class="field"><label>Titre</label><input id="qtitle" value="${escapeHtml(quiz.title||'')}"></div>
    <div id="qList"></div>
    <button class="btn btn-ghost" id="addQ" style="margin-top:.5em;">+ Ajouter une question</button>
    <div class="row" style="margin-top:1.2em;">
      <button class="btn btn-ghost" id="cancelQ">Annuler</button>
      <button class="btn btn-primary" id="confirmQ" style="background:var(--good);">OK, générer le QR code</button>
    </div>
  </div>`);
  host.appendChild(box);
  box.querySelector('#qtitle').oninput = e=>quiz.title = e.target.value;

  const qList = box.querySelector('#qList');
  function drawQuestions(){
    qList.innerHTML = '';
    quiz.questions.forEach((q,qi)=>{
      const qDiv = el(`<div class="question-block">
        <div class="row" style="justify-content:space-between;">
          <strong>Question ${qi+1}</strong>
          <button class="link-btn" style="color:var(--bad);">Supprimer</button>
        </div>
        <div class="field"><label>Énoncé</label><input class="enonce" value="${escapeHtml(q.enonce)}"></div>
        <div class="opts"></div>
        <button class="link-btn addOpt">+ Ajouter une option</button>
      </div>`);
      qDiv.querySelector('.link-btn').onclick = ()=>{ quiz.questions.splice(qi,1); drawQuestions(); };
      qDiv.querySelector('.enonce').oninput = e=>q.enonce = e.target.value;
      const optsDiv = qDiv.querySelector('.opts');
      function drawOpts(){
        optsDiv.innerHTML='';
        q.options.forEach((opt,oi)=>{
          const row = el(`<div class="row" style="align-items:center; margin-bottom:.3em;">
            <input type="radio" name="correct-${qi}" style="width:auto;" ${q.correct===oi?'checked':''}>
            <input style="flex:1;" value="${escapeHtml(opt)}" placeholder="Option ${oi+1}">
            <button class="link-btn" style="color:var(--bad);">✕</button>
          </div>`);
          row.querySelectorAll('input')[0].onchange = ()=>{ q.correct = oi; };
          row.querySelectorAll('input')[1].oninput = e=>q.options[oi]=e.target.value;
          row.querySelector('.link-btn').onclick = ()=>{ q.options.splice(oi,1); if(q.correct>=q.options.length) q.correct=0; drawOpts(); };
          optsDiv.appendChild(row);
        });
      }
      drawOpts();
      qDiv.querySelector('.addOpt').onclick = ()=>{ q.options.push(''); drawOpts(); };
      qList.appendChild(qDiv);
    });
  }
  drawQuestions();
  box.querySelector('#addQ').onclick = ()=>{ quiz.questions.push({enonce:'', options:['',''], correct:0}); drawQuestions(); };
  box.querySelector('#cancelQ').onclick = ()=>{ drawGenerateStep(host, user); };
  box.querySelector('#confirmQ').onclick = async ()=>{
    if(!quiz.title.trim()){ alert('Donnez un titre au quiz.'); return; }
    if(quiz.questions.length===0){ alert('Ajoutez au moins une question.'); return; }
    for(const q of quiz.questions){
      if(!q.enonce.trim() || q.options.filter(o=>o.trim()).length<2){ alert('Chaque question doit avoir un énoncé et au moins 2 options.'); return; }
    }
    try{
      const res = await api('/api/quiz/sessions', {method:'POST', body:{title:quiz.title, description:quiz.description, questions:quiz.questions}});
      drawSessionStep(host, user, res.code);
    }catch(e){ alert(e.message); }
  };
}

function drawSessionStep(host, user, code){
  host.innerHTML = '';
  const link = `${location.origin}${location.pathname}?quiz=${code}`;
  const box = el(`<div class="card">
    <h3>Quiz prêt — code ${code}</h3>
    <div class="row">
      <div style="flex:none; text-align:center;">
        <div id="qrcode"></div>
        <button class="link-btn" id="dlQr" style="font-size:.78rem; margin-top:.4em;">Télécharger le QR (PNG)</button>
      </div>
      <div style="flex:1; min-width:240px;">
        <div class="field"><label>Lien à partager</label><input readonly value="${link}"></div>
        <div class="row">
          <button class="btn btn-ghost btn-sm" id="copyLink">Copier le lien</button>
          <button class="btn btn-primary btn-sm" id="startQuiz">Commencer la session</button>
          <button class="btn btn-ghost btn-sm" id="relaunchQuiz">↻ Relancer (nouvelle manche)</button>
        </div>
        <p class="muted" style="font-size:.8rem; margin-top:.6em;">Statut : <strong id="statLabel">en préparation</strong></p>
      </div>
    </div>
    <div id="liveList" style="margin-top:1.2em;"></div>
    <button class="btn btn-danger" id="resetQuiz" style="margin-top:1em;">Réinitialiser (tout effacer)</button>
  </div>`);
  host.appendChild(box);
  try{ new QRCode(box.querySelector('#qrcode'), {text: link, width:128, height:128}); }catch(e){ box.querySelector('#qrcode').textContent = '(QR indisponible)'; }
  box.querySelector('#dlQr').onclick = ()=>{
    const qrDiv = box.querySelector('#qrcode');
    const canvas = qrDiv.querySelector('canvas'); const img = qrDiv.querySelector('img');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
    if(!dataUrl){ alert('QR indisponible.'); return; }
    const a = document.createElement('a'); a.href = dataUrl; a.download = `quiz-${code}.png`; a.click();
  };
  box.querySelector('#copyLink').onclick = ()=>{ navigator.clipboard?.writeText(link); alert('Lien copié.'); };
  box.querySelector('#startQuiz').onclick = async ()=>{
    try{ await api(`/api/quiz/sessions/${code}/start`, {method:'POST'}); box.querySelector('#statLabel').textContent = 'en cours'; }
    catch(e){ alert(e.message); }
  };
  box.querySelector('#relaunchQuiz').onclick = async ()=>{
    if(!confirm('Relancer une nouvelle manche ? Les scores actuels seront effacés, les mêmes questions seront réutilisées, et les élèves devront rejoindre à nouveau.')) return;
    try{ await api(`/api/quiz/sessions/${code}/relaunch`, {method:'POST'}); box.querySelector('#statLabel').textContent = 'en préparation'; }
    catch(e){ alert(e.message); }
  };
  box.querySelector('#resetQuiz').onclick = async ()=>{
    if(!confirm('Tout effacer ? Les élèves connectés seront déconnectés et rien ne sera conservé.')) return;
    try{ await api(`/api/quiz/sessions/${code}`, {method:'DELETE'}); }catch(e){}
    clearInterval(liveIv);
    drawGenerateStep(host, user);
  };

  const liveList = box.querySelector('#liveList');
  const TROPHIES = ['🥇','🥈','🥉'];
  async function refreshLive(){
    try{
      const live = await api(`/api/quiz/sessions/${code}/live`);
      box.querySelector('#statLabel').textContent = live.status==='running' ? 'en cours' : (live.status==='ended' ? 'terminé' : 'en préparation');
      if(live.students.length===0){ liveList.innerHTML = '<p class="muted">Aucun élève connecté pour le moment.</p>'; return; }
      const allFinished = live.students.every(s=>s.finished);
      liveList.innerHTML = '';
      liveList.appendChild(el(`<h4>${allFinished ? '🏆 Classement final' : 'Classement en direct'} (${live.students.length} joueur${live.students.length>1?'s':''})</h4>`));
      live.students.forEach((s,i)=>{
        const trophy = TROPHIES[i];
        liveList.appendChild(el(`<div class="leader-row" style="${trophy?'background:var(--student-soft); border-radius:8px; padding:.4em .6em;':''}">
          <div class="rank" style="font-size:${trophy?'1.3rem':'1rem'};">${trophy||(i+1)}</div>
          <div style="font-size:1.3rem;">${s.avatar||'🙂'}</div>
          <div style="flex:1;">${escapeHtml(s.nom)} ${s.finished?`— <strong>${s.score}/${s.total}</strong>`:`— question ${s.index+1}/${s.total}`}</div>
          ${s.finished ? '<span class="tag" style="background:var(--good-soft); color:var(--good);">Terminé</span>' : '<span class="tag" style="background:var(--admin-soft); color:var(--admin);">En cours</span>'}
        </div>`));
      });
    }catch(e){}
  }
  refreshLive();
  const liveIv = setInterval(refreshLive, 3000);
  const observer = new MutationObserver(()=>{ if(!document.body.contains(box)){ clearInterval(liveIv); observer.disconnect(); } });
  observer.observe(document.body, {childList:true, subtree:true});
}

async function buildResultsTable(wrap){
  const allResults = await api('/api/results');
  if(allResults.length===0){ wrap.appendChild(el(`<p class="muted">Aucune copie soumise pour le moment.</p>`)); return; }

  const examOptions = [...new Map(allResults.map(r=>[r.examId, r.examTitre+' — '+(r.examMatiere||'Français')])).entries()];
  const examSel = el(`<div class="field" style="max-width:420px;"><label>Filtrer par examen</label>
    <select><option value="">Tous les examens</option>${examOptions.map(([id,titre])=>`<option value="${id}">${escapeHtml(titre)}</option>`).join('')}</select></div>`);
  const summaryDiv = el(`<div id="resultsSummary" style="margin-bottom:1em;"></div>`);
  wrap.appendChild(summaryDiv);
  wrap.appendChild(examSel);
  const tblWrap = el(`<div class="overflow-x"></div>`);
  wrap.appendChild(tblWrap);
  const exportRow = el(`<div class="row" style="margin-top:1em;">
    <button class="btn btn-ghost" id="expXlsx">Télécharger en Excel</button>
    <button class="btn btn-ghost" id="expPdf">Télécharger en PDF</button>
    <button class="btn btn-ghost" id="expBulkPdf">Télécharger toutes les copies (PDF, une feuille par élève)</button>
  </div>`);
  wrap.appendChild(exportRow);

  function drawSummary(rows){
    summaryDiv.innerHTML = '';
    const corrected = rows.filter(r=>r.pct!==null);
    const success = corrected.filter(r=>r.pct>=50).length;
    const successRate = corrected.length ? Math.round(100*success/corrected.length) : 0;
    const row = el(`<div class="row" style="align-items:stretch; gap:1em; margin-bottom:.8em;">
      <div class="card" style="flex:none; display:flex; align-items:center; justify-content:center;"></div>
      <div class="stats" style="flex:1; margin-bottom:0;"></div>
    </div>`);
    row.querySelector('.card').appendChild(svgDonut(successRate, scoreColor(successRate), 90));
    const stats = row.querySelector('.stats');
    [['👥','Élèves', rows.length, 'var(--admin)'], ['✅','Corrigées', corrected.length, 'var(--chart-teal)']].forEach(([icon,lbl,num,color])=>{
      stats.appendChild(el(`<div class="stat" style="border-top-color:${color};"><div class="row" style="align-items:center; gap:.4em;"><span style="font-size:1.2rem;">${icon}</span><div class="num" style="color:${color};">${num}</div></div><div class="lbl">${lbl}</div></div>`));
    });
    summaryDiv.appendChild(row);
    // Compétence à travailler en priorité pour ce groupe de copies
    const sectionCols = [];
    rows.forEach(r=> r.examSections.forEach(s=>{ if(!sectionCols.find(c=>c.titre===s.titre)) sectionCols.push(s); }));
    const agg = {};
    rows.forEach(r=> sectionCols.forEach(c=>{
      const sec = r.examSections.find(s=>s.titre===c.titre); const sc = sec ? r.sectionScores[sec.id] : undefined;
      if(sc===undefined || !sec.max) return;
      agg[c.titre] = agg[c.titre] || {sum:0,max:0}; agg[c.titre].sum += sc; agg[c.titre].max += sec.max;
    }));
    const entries = Object.entries(agg).map(([titre,v])=>({titre, pct:Math.round(100*v.sum/v.max)})).sort((a,b)=>a.pct-b.pct);
    if(entries.length){
      const chart = el(`<div class="card"></div>`);
      chart.appendChild(el(`<h4 style="margin:0 0 .5em;">Réussite par section</h4>`));
      entries.forEach(e=>{
        chart.appendChild(el(`<div class="bar-row"><div style="width:160px; font-size:.85rem;">${escapeHtml(e.titre)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${e.pct}%; background:${scoreColor(e.pct)};"></div></div>
          <div style="width:45px; text-align:right; font-size:.85rem;">${e.pct}%</div></div>`));
      });
      chart.appendChild(el(`<p class="muted" style="font-size:.85rem; margin-top:.5em;">À travailler en priorité : <strong>${escapeHtml(entries[0].titre)}</strong></p>`));
      summaryDiv.appendChild(chart);
    }
  }

  function draw(){
    const filterId = examSel.querySelector('select').value;
    const rows = allResults.filter(r=> !filterId || r.examId===filterId);
    drawSummary(rows);
    if(rows.length===0){ tblWrap.innerHTML = '<p class="muted">Aucune copie soumise pour ce filtre.</p>'; return; }
    const sectionCols = [];
    rows.forEach(r=> r.examSections.forEach(s=>{ if(!sectionCols.find(c=>c.titre===s.titre)) sectionCols.push(s); }));
    let html = `<table><thead><tr><th>Élève</th><th>Classe / Niveau</th><th>Matière</th>${sectionCols.map(c=>`<th>${escapeHtml(c.titre)}</th>`).join('')}<th>Total</th><th>%</th><th>Statut</th><th></th></tr></thead><tbody>`;
    rows.forEach(r=>{
      html += `<tr><td><button class="link-btn" data-open="${r.attemptId}" style="font-weight:600;">${escapeHtml(r.nom)}</button></td>
        <td>${escapeHtml(r.classe||'—')}${r.groupe?' / '+escapeHtml(r.groupe):''}</td><td>${escapeHtml(r.examMatiere||'Français')}</td>`;
      sectionCols.forEach(c=>{
        const sec = r.examSections.find(s=>s.titre===c.titre);
        const sc = sec ? r.sectionScores[sec.id] : undefined;
        html += `<td>${sc!==undefined ? sc+'/'+sec.max : '—'}</td>`;
      });
      html += `<td>${r.total!==null ? r.total+'/'+r.max : '—'}</td>
      <td><span class="tag" style="background:${scoreColor(r.pct)}22; color:${scoreColor(r.pct)}; font-weight:700;">${r.pct!==null?r.pct+'%':'—'}</span></td>
      <td>${r.manualPending ? '<span class="tag" style="background:var(--bad-soft);color:var(--bad);">Correction manuelle requise</span>' : (r.total!==null?'Corrigé':'—')}</td>
      <td><button class="link-btn" data-del="${r.attemptId}" data-nom="${escapeHtml(r.nom)}" style="color:var(--bad);" title="Supprimer la copie de cet élève">🗑 Supprimer</button></td></tr>`;
    });
    html += '</tbody></table>';
    tblWrap.innerHTML = html;
    tblWrap.querySelectorAll('[data-open]').forEach(btn=>{ btn.onclick = ()=> openStudentFiche(btn.dataset.open); });
    tblWrap.querySelectorAll('[data-del]').forEach(btn=>{ btn.onclick = async ()=>{
      if(!confirm(`Supprimer définitivement la copie de ${btn.dataset.nom} ? Cette action est irréversible.`)) return;
      try{ await api(`/api/results/${btn.dataset.del}`, {method:'DELETE'}); const i = allResults.findIndex(x=>x.attemptId===btn.dataset.del); if(i>=0) allResults.splice(i,1); draw(); }catch(e){ alert(e.message); }
    }; });
  }
  examSel.querySelector('select').onchange = draw;
  draw();

  exportRow.querySelector('#expXlsx').onclick = ()=>{
    const filterId = examSel.querySelector('select').value;
    if(!filterId){ alert("Choisissez d'abord un examen dans le filtre pour exporter."); return; }
    downloadFromApi('/api/export/results.xlsx?examId='+filterId, 'resultats.xlsx');
  };
  exportRow.querySelector('#expPdf').onclick = ()=>{
    const filterId = examSel.querySelector('select').value;
    if(!filterId){ alert("Choisissez d'abord un examen dans le filtre pour exporter."); return; }
    downloadFromApi('/api/export/results.pdf?examId='+filterId, 'resultats.pdf');
  };
  exportRow.querySelector('#expBulkPdf').onclick = ()=>{
    const filterId = examSel.querySelector('select').value;
    if(!filterId){ alert("Choisissez d'abord un examen dans le filtre pour exporter."); return; }
    const rows = allResults.filter(r=>r.examId===filterId && r.pct!==null);
    if(rows.length===0){ alert("Aucune copie corrigée pour cet examen — rien à exporter."); return; }
    const overlay = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:60;">
      <div class="card" style="max-width:480px; width:100%; background:var(--paper-raised);">
        <h3>Vérifier avant de télécharger</h3>
        <p class="muted" style="font-size:.85rem;">${rows.length} feuille(s) seront incluses dans ce PDF, une par élève :</p>
        <div style="max-height:240px; overflow-y:auto; margin:.6em 0;"></div>
        <div class="row" style="justify-content:flex-end; margin-top:.8em;">
          <button class="btn btn-ghost" id="cancelBulk">Annuler</button>
          <button class="btn btn-primary" id="confirmBulk">Télécharger le PDF</button>
        </div>
      </div>
    </div>`);
    const listDiv = overlay.querySelector('div[style*="overflow-y"]');
    rows.forEach(r=> listDiv.appendChild(el(`<p style="margin:.2em 0; font-size:.9rem;">${escapeHtml(r.nom)} — ${escapeHtml(r.classe||'—')}${r.groupe?' / '+escapeHtml(r.groupe):''}</p>`)));
    document.body.appendChild(overlay);
    overlay.querySelector('#cancelBulk').onclick = ()=> overlay.remove();
    overlay.querySelector('#confirmBulk').onclick = ()=>{
      downloadFromApi('/api/export/results-bulk.pdf?examId='+filterId, 'toutes_les_copies.pdf');
      overlay.remove();
    };
  };
}

function describeCorrect(q){
  if(q.type==='choix_unique') return (q.options||[])[q.correct] ?? '—';
  if(q.type==='choix_multiple') return (q.correct||[]).map(i=>(q.options||[])[i]).join(', ') || '—';
  if(q.type==='vrai_faux') return q.correct ? 'Vrai' : 'Faux';
  if(q.type==='texte_court') return q.correct || '—';
  if(q.type==='texte_trous') return q.correct || '—';
  if(q.type==='association') return (q.pairs||[]).map(p=>`${p.left} → ${p.right}`).join(' ; ') || '—';
  if(q.type==='classement') return (q.items||[]).join(' → ') || '—';
  if(q.type==='classification') return (q.elements||[]).map(e=>`${e.texte} → ${e.categorie}`).join(' ; ') || '—';
  if(q.type==='image_choix') return (q.options||[])[q.correct]?.label || (q.options||[])[q.correct]?.image || '—';
  if(q.type==='association_images') return (q.pairs||[]).map(p=>`${p.left.label||p.left.image} → ${p.right.label||p.right.image}`).join(' ; ') || '—';
  return '—';
}
function formatGiven(q, given){
  if(given===undefined || given===null || given==='') return '<em>(sans réponse)</em>';
  if(q.type==='choix_unique') return (q.options||[])[given] ?? String(given);
  if(q.type==='choix_multiple') return (given||[]).map(i=>(q.options||[])[i]).join(', ');
  if(q.type==='vrai_faux') return given ? 'Vrai' : 'Faux';
  if(q.type==='association') return Object.entries(given||{}).map(([l,r])=>`${l} → ${r}`).join(' ; ') || '<em>(sans réponse)</em>';
  if(q.type==='classement') return (given||[]).join(' → ');
  if(q.type==='classification') return (q.elements||[]).map((e,i)=>`${escapeHtml(e.texte)} → ${escapeHtml((given||{})[i]||'—')}`).join(' ; ');
  if(q.type==='image_choix'){
    const opt = (q.options||[])[given];
    return opt ? `<img src="${opt.image}" style="width:60px; height:60px; object-fit:cover; border-radius:8px; vertical-align:middle;"> ${escapeHtml(opt.label||'')}` : String(given);
  }
  if(q.type==='association_images'){
    const g = given||{};
    const parts = (q.pairs||[]).map(p=>{
      const rid = g[p.id]; const matched = (q.pairs||[]).find(pp=>pp.id===rid);
      return `${p.left.label||p.left.image||''} → ${matched ? (matched.right.label||matched.right.image) : '—'}`;
    });
    return parts.length ? parts.join(' ; ') : '<em>(sans réponse)</em>';
  }
  if(q.type==='dessin') return given ? `<img src="${given}" class="thumb-drawing">` : '<em>(pas de dessin)</em>';
  return escapeHtml(String(given));
}

async function openStudentFiche(attemptId, opts){
  const overlay = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:3vh 1em; overflow:auto;">
    <div class="card" style="max-width:720px; width:100%; background:var(--paper-raised);">
      <div class="loading-screen" style="min-height:20vh;">Chargement…</div>
    </div>
  </div>`);
  document.body.appendChild(overlay);

  let detail;
  try{ detail = await api(`/api/results/${attemptId}`); }
  catch(e){ overlay.querySelector('.card').innerHTML = `<p class="muted">${escapeHtml(e.message)}</p>`; return; }
  const { attempt, exam } = detail;
  let result = detail.result;
  if(!result){
    // First open: trigger server-side computation so auto-graded questions show correct/incorrect.
    try{ result = await api(`/api/results/${attemptId}`, {method:'PATCH', body:{manualScores:{}, oralNote:null}}); }
    catch(e){}
  }

  const cardInner = overlay.querySelector('.card');
  cardInner.innerHTML = '';
  const isSecondaire = !['Préscolaire','Primaire'].includes(exam.niveau);
  if(opts && opts.scroll) setTimeout(()=>{ overlay.scrollTop = opts.scroll; }, 0);
  cardInner.appendChild(el(`<div class="row" style="justify-content:space-between; align-items:flex-start;">
    <div><h3>${escapeHtml(attempt.nom)}</h3><p class="muted">${escapeHtml(exam.titre)} (${escapeHtml(exam.matiere||'Français')}) · ${isSecondaire ? 'Niveau : '+escapeHtml(attempt.classe||'—') : 'Classe : '+escapeHtml(attempt.classe||'—')+' · Groupe : '+escapeHtml(attempt.groupe||'—')} · soumis le ${fmtDate(attempt.submittedAt)}</p></div>
    <button class="link-btn" id="close">Fermer ✕</button>
  </div>`));
  cardInner.querySelector('#close').onclick = ()=>overlay.remove();
  const expRow = el(`<div class="row" style="margin:.6em 0;">
    <button class="btn btn-ghost btn-sm" id="attXlsx">Télécharger en Excel</button>
    <button class="btn btn-ghost btn-sm" id="attPdf">Télécharger en PDF</button>
    <button class="btn btn-ghost btn-sm" id="attDel" style="color:var(--bad);">🗑 Supprimer cette copie</button>
  </div>`);
  cardInner.appendChild(expRow);
  expRow.querySelector('#attDel').onclick = async ()=>{
    if(!confirm(`Supprimer définitivement la copie de ${attempt.nom} ? Cette action est irréversible.`)) return;
    try{ await api(`/api/results/${attemptId}`, {method:'DELETE'}); overlay.remove(); render(); }catch(e){ alert(e.message); }
  };
  expRow.querySelector('#attXlsx').onclick = ()=> downloadFromApi(`/api/export/attempt/${attemptId}/xlsx`, `${attempt.nom}.xlsx`);
  expRow.querySelector('#attPdf').onclick = ()=> downloadFromApi(`/api/export/attempt/${attemptId}/pdf`, `${attempt.nom}.pdf`);

  const chartDiv = el(`<div id="ficheChart" style="margin-bottom:1em;"></div>`);
  cardInner.appendChild(chartDiv);

  const qsDiv = el(`<div></div>`);
  cardInner.appendChild(qsDiv);
  const totalLine = el(`<div class="row" style="margin-top:1em; justify-content:space-between; align-items:center;">
    <div><strong id="totalLabel"></strong></div>
    <div class="row">
      <button class="btn btn-ghost" id="save">Enregistrer les notes</button>
      <button class="btn btn-primary" id="release">Générer le résultat</button>
    </div>
  </div>`);
  cardInner.appendChild(totalLine);

  const manualInputs = {}; const critInputs = {}; const autoOverrides = {}; let oralInput = null;

  exam.sections.forEach(sec=>{
    qsDiv.appendChild(el(`<h4 style="margin-top:1.2em;">${escapeHtml(sec.titre)} <span class="muted" style="font-weight:400; font-size:.85rem;">(${sectionPoints(sec)} pts)</span></h4>`));
    sec.questions.forEach(q=>{
      const given = attempt.reponses[q.id];
      let block;
      if(q.type==='production_orale' && (q.criteres||[]).length){
        const saved = (result && result.manualScores && result.manualScores['crit:'+q.id]) || {};
        block = el(`<div class="question-block"><p><strong>${escapeHtml(q.enonce||'Production orale')}</strong></p>
          <div class="overflow-x"><table><thead><tr><th>Critère</th><th>Note</th></tr></thead><tbody></tbody></table></div>
          <p style="margin:.5em 0 0;">Note de la production orale : <strong class="oral-total">—</strong> / ${q.points}</p></div>`);
        const tb = block.querySelector('tbody'); const inputs = {};
        const recompute = ()=>{
          const maxSum = q.criteres.reduce((a,c)=>a+Number(c.points||0),0);
          let got = 0, any = false;
          q.criteres.forEach(c=>{ const v = inputs[c.id].value; if(v!==''){ any = true; got += Math.max(0, Math.min(Number(c.points), Number(v))); } });
          block.querySelector('.oral-total').textContent = (any && maxSum) ? (Math.round(got*Number(q.points)/maxSum*100)/100) : '—';
        };
        q.criteres.forEach(c=>{
          const tr = el(`<tr><td>${escapeHtml(c.titre)}</td><td><input type="number" min="0" max="${c.points}" step="0.5" style="width:80px;" value="${saved[c.id]!==undefined && saved[c.id]!==null ? saved[c.id] : ''}"> <span class="muted">/ ${c.points}</span></td></tr>`);
          inputs[c.id] = tr.querySelector('input'); inputs[c.id].oninput = recompute; tb.appendChild(tr);
        });
        critInputs[q.id] = inputs; recompute();
      } else if(q.type==='production_orale'){
        const savedNote = result ? result.oralNote : '';
        block = el(`<div class="question-block"><p><strong>${escapeHtml(q.enonce||'Production orale')}</strong></p>
          <label>Note (/${q.points})</label><input type="number" min="0" max="${q.points}" value="${savedNote!==undefined && savedNote!==null ? savedNote : ''}"></div>`);
        oralInput = block.querySelector('input');
      } else if(q.type==='texte_long' || q.type==='correction_manuelle'){
        const savedManual = result && result.manualScores ? result.manualScores[q.id] : undefined;
        block = el(`<div class="question-block"><p><strong>${escapeHtml(q.enonce)}</strong></p>
          <p class="muted" style="font-size:.85rem;">Réponse de l'élève : ${given ? escapeHtml(String(given)) : '<em>(vide)</em>'}</p>
          ${q.corrige ? `<p style="font-size:.85rem; color:var(--good);">Corrigé : ${escapeHtml(q.corrige)}</p>` : ''}
          <label>Points attribués (/${q.points})</label><input type="number" min="0" max="${q.points}" value="${savedManual!==undefined && savedManual!==null?savedManual:''}"></div>`);
        manualInputs[q.id] = block.querySelector('input');
      } else if(q.type==='dessin'){
        const savedManual = result && result.manualScores ? result.manualScores[q.id] : undefined;
        block = el(`<div class="question-block"><p><strong>${escapeHtml(q.enonce||'Dessin / coloriage')}</strong></p>
          ${q.corrige ? `<p style="font-size:.85rem; color:var(--good);">Attendu : ${escapeHtml(q.corrige)}</p>` : ''}
          <p class="muted" style="font-size:.85rem;">Dessin de l'élève :</p>
          ${given ? `<img src="${given}" class="thumb-drawing">` : '<p class="muted"><em>(pas de dessin)</em></p>'}
          <label>Points attribués (/${q.points})</label><input type="number" min="0" max="${q.points}" value="${savedManual!==undefined && savedManual!==null?savedManual:''}"></div>`);
        manualInputs[q.id] = block.querySelector('input');
      } else {
        const auto = result ? result.autoDetail && result.autoDetail[q.id] : null;
        const ovSaved = result && result.manualScores ? result.manualScores[q.id] : undefined;
        const correctText = describeCorrect(q);
        block = el(`<div class="question-block"><p><strong>${escapeHtml(q.enonce)}</strong></p>
          <p class="muted" style="font-size:.85rem;">Réponse de l'élève : ${formatGiven(q, given)}</p>
          <p style="font-size:.85rem; color:${auto && auto.correct ? 'var(--good)' : 'var(--bad)'};">${auto ? (auto.correct?'Correct':'Incorrect') + ` (${auto.points}/${q.points})` : 'Correction automatique'} — bonne réponse : ${escapeHtml(correctText)}${auto && auto.overridden ? ' <em>(note modifiée par le professeur)</em>' : ''}</p>
          <div class="row" style="gap:.4em; align-items:center; margin-top:.3em;"><span class="muted" style="font-size:.8rem;">Corriger :</span>
            <button class="btn btn-ghost btn-sm" type="button" data-ov="ok">✔ Réponse bonne</button>
            <button class="btn btn-ghost btn-sm" type="button" data-ov="ko">✘ Réponse fausse</button>
            <input type="number" min="0" max="${q.points}" step="0.25" data-ov="pts" placeholder="points" style="width:80px;" value="${ovSaved!==undefined && ovSaved!==null ? ovSaved : ''}">
            <button class="link-btn" type="button" data-ov="auto" style="font-size:.8rem;">Rétablir la correction automatique</button></div></div>`);
        const ovIn = block.querySelector('[data-ov="pts"]'); autoOverrides[q.id] = ovIn;
        const applyOv = async v=>{ ovIn.value = v===null ? '' : v; try{ const top = overlay.scrollTop; await persist(); overlay.remove(); await openStudentFiche(attemptId, {scroll:top}); }catch(e){ alert(e.message); } };
        block.querySelector('[data-ov="ok"]').onclick = ()=>applyOv(Number(q.points));
        block.querySelector('[data-ov="ko"]').onclick = ()=>applyOv(0);
        block.querySelector('[data-ov="auto"]').onclick = ()=>applyOv(null);
        ovIn.onchange = ()=>applyOv(ovIn.value===''?null:Number(ovIn.value));
      }
      if(q.passage){ qsDiv.appendChild(el(`<div class="passage-box" style="margin-bottom:0;">${escapeHtml(q.passage)}</div>`)); }
      qsDiv.appendChild(block);
    });
  });

  function showTotal(r){
    totalLine.querySelector('#totalLabel').innerHTML = `Total : ${r.total}/${r.max} — <span style="color:${scoreColor(r.pct)}; font-weight:700;">${r.pct}%</span> ${r.manualPending?'<span class="muted">— correction manuelle en attente</span>':''}`;
    chartDiv.innerHTML = '';
    if(r.sectionScores){
      chartDiv.appendChild(el(`<h4 style="margin-bottom:.4em;">Points à travailler</h4>`));
      exam.sections.forEach(sec=>{
        const sc = r.sectionScores[sec.id]; const max = sectionPoints(sec);
        if(sc===undefined || !max) return;
        const pct = Math.round(100*sc/max);
        chartDiv.appendChild(el(`<div class="bar-row"><div style="width:160px; font-size:.85rem;">${escapeHtml(sec.titre)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${scoreColor(pct)};"></div></div>
          <div style="width:45px; text-align:right; font-size:.85rem;">${pct}%</div></div>`));
      });
    }
  }
  if(result) showTotal(result);

  async function persist(){
    const manualScores = {};
    Object.entries(manualInputs).forEach(([qid, inputEl])=>{ manualScores[qid] = inputEl.value!=='' ? Number(inputEl.value) : null; });
    Object.entries(autoOverrides).forEach(([qid, inputEl])=>{ if(inputEl.value!=='') manualScores[qid] = Number(inputEl.value); });
    Object.entries(critInputs).forEach(([qid, inputs])=>{
      const bd = {}; Object.entries(inputs).forEach(([cid, inp])=>{ if(inp.value!=='') bd[cid] = Number(inp.value); });
      manualScores['crit:'+qid] = bd;
    });
    const oralNote = oralInput ? (oralInput.value!=='' ? Number(oralInput.value) : null) : null;
    const r = await api(`/api/results/${attemptId}`, {method:'PATCH', body:{manualScores, oralNote}});
    showTotal(r);
    return r;
  }
  cardInner.querySelector('#save').onclick = async ()=>{ try{ await persist(); alert('Notes enregistrées.'); }catch(e){ alert(e.message); } };
  cardInner.querySelector('#release').onclick = async ()=>{
    try{
      const r = await persist();
      await api(`/api/results/${attemptId}/release`, {method:'POST'});
      alert('Résultat généré' + (r.manualPending ? ' — attention, une correction manuelle reste en attente.' : '.'));
      overlay.remove(); render();
    }catch(e){ alert(e.message); }
  };
}

async function analyticsView(){
  const wrap = el(`<div><h2>Analyse & rapports</h2>
    <button class="btn btn-primary" id="globalReport" style="margin-bottom:1em;">📄 Générer le rapport global (PDF, coloré)</button>
  </div>`);
  wrap.querySelector('#globalReport').onclick = ()=> downloadFromApi('/api/export/global-report.pdf', 'rapport_pedagogique_global.pdf');
  const [dash, allResults] = await Promise.all([api('/api/analytics/dashboard'), api('/api/results')]);
  if(allResults.length===0){ wrap.appendChild(el(`<p class="muted">Pas encore assez de données pour générer une analyse.</p>`)); return wrap; }

  Object.keys(dash.byLevel||{}).forEach(niv=>{
    const pct = dash.byLevel[niv];
    if(pct===null || pct===undefined) return;
    wrap.appendChild(el(`<div class="card" style="margin-bottom:1em;"><h3>${niv}</h3><p class="muted">moyenne ${pct}%</p></div>`));
  });

  const classes = [...new Set(allResults.map(r=>r.classe).filter(Boolean))];
  for(const cls of classes){
    const detail = await api(`/api/analytics/class/${encodeURIComponent(cls)}`);
    if(detail.sections.length===0) continue;
    const card = el(`<div class="card" style="margin-bottom:1em;"><h3>Classe ${escapeHtml(cls)}</h3><div id="bars"></div></div>`);
    const barsDiv = card.querySelector('#bars');
    detail.sections.forEach(e=>{
      barsDiv.appendChild(el(`<div class="bar-row"><div style="width:160px; font-size:.85rem;">${escapeHtml(e.titre)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${e.pct}%; background:${scoreColor(e.pct)}"></div></div>
        <div style="width:50px; text-align:right; font-size:.85rem;">${e.pct}%</div></div>`));
    });
    card.appendChild(el(`<p class="muted" style="font-size:.85rem; margin-top:.6em;">Compétence prioritaire, d'après les données disponibles : <strong>${escapeHtml(detail.priority||'—')}</strong>.</p>`));
    wrap.appendChild(card);
  }

  const exportBtn = el(`<button class="btn btn-ghost">Exporter les résultats (CSV)</button>`);
  exportBtn.onclick = ()=> downloadFromApi('/api/export/results.csv', 'rapport_pedagogique.csv');
  wrap.appendChild(exportBtn);
  wrap.appendChild(el(`<p class="kbd-note" style="margin-top:1em;">Les suggestions ci-dessus sont générées à partir des données disponibles ; il ne s'agit pas d'une évaluation pédagogique professionnelle définitive.</p>`));
  return wrap;
}

/* =========================================================
   SUIVI DES ÉVALUATIONS — réservé à l'administrateur
   Structure saisie une seule fois (Section > Classe > Groupe + matières + niveaux),
   puis réutilisée automatiquement pour le suivi des Guides, Examens et Projets.
   Aucune icône ni emoji dans ce module (libellés textuels et couleurs).
   ========================================================= */
const SUIVI_STATUTS = [
  {n:0, label:'Non reçu',                 color:'#5F6878', soft:'#ECEEF2'},
  {n:1, label:'Reçu',                     color:'#B3261E', soft:'#FBE3E0'},
  {n:2, label:'En révision',              color:'#B45F06', soft:'#FCEBD0'},
  {n:3, label:'Révisé',                   color:'#8A6D00', soft:'#F8F0BC'},
  {n:4, label:'Envoyé au professeur',     color:'#1F5AA6', soft:'#DCE8FA'},
  {n:5, label:'Validé par le professeur', color:'#6B2F96', soft:'#EBDDF6'},
  {n:6, label:'Prêt à appliquer',         color:'#25703D', soft:'#DCEDE2'},
  {n:7, label:'Pas appliqué à ce moment', color:'#0F6E7A', soft:'#D6EEF0'},
];
const SUIVI_TYPES = [{id:'guide', label:'Guide'}, {id:'examen', label:'Examen'}, {id:'projet', label:'Projet'}];
const SUIVI_CTX_KEY = 'fle_suivi_ctx';
const suiviState = (()=>{ try{ return Object.assign({annee:'', trimestre:1, tab:'tableau', vue:'synthese', typeSel:'guide'}, JSON.parse(localStorage.getItem(SUIVI_CTX_KEY)||'{}')); }catch(e){ return {annee:'', trimestre:1, tab:'tableau', vue:'synthese', typeSel:'guide'}; } })();
function suiviSave(){ localStorage.setItem(SUIVI_CTX_KEY, JSON.stringify(suiviState)); }

/** Liste à plat des unités suivies : chaque groupe, ou la classe elle-même si elle n'a pas de groupe. */
function suiviLeaves(struct){
  const kids = (id, kind)=> struct.nodes.filter(n=>n.parentId===id && n.kind===kind);
  const leaves = [];
  struct.nodes.filter(n=>n.kind==='section').forEach(sec=>{
    kids(sec.id,'classe').forEach(cl=>{
      const gs = kids(cl.id,'groupe');
      if(gs.length) gs.forEach(g=>leaves.push({id:g.id, section:sec, classe:cl, groupe:g, niveau:g.niveau||''}));
      else leaves.push({id:cl.id, section:sec, classe:cl, groupe:null, niveau:''});
    });
  });
  return leaves;
}

function suiviPill(statut, extra){
  const s = SUIVI_STATUTS[statut] || SUIVI_STATUTS[0];
  return `<span class="suivi-pill" style="background:${s.soft}; color:${s.color}; border-color:${s.color};">${escapeHtml(s.label)}${extra||''}</span>`;
}

async function suiviView(){
  const S = suiviState;
  const wrap = el(`<div><h2>Suivi des évaluations</h2>
    <p class="muted" style="font-size:.88rem; margin-top:-.4em;">Réservé à l'administrateur. Vous construisez la structure de l'établissement une seule fois ; elle sert ensuite au suivi des Guides, des Examens et des Projets.</p>
    <div id="suiviHead"></div><div id="suiviBody"></div></div>`);
  let struct = await api('/api/suivi/structure');
  let statuts = {}; // `${type}|${leafId}|${matiereId}` -> statut
  const filters = {section:'', classe:'', leaf:'', matiere:'', niveau:'', statut:'', type:''};

  async function loadStatuts(){
    statuts = {};
    if(!S.annee) return;
    const rows = await api(`/api/suivi/statuts?annee=${encodeURIComponent(S.annee)}&trimestre=${S.trimestre}`);
    rows.forEach(r=>{ statuts[`${r.type}|${r.leafId}|${r.matiereId}`] = r.statut; });
  }
  async function reload(){ struct = await api('/api/suivi/structure'); await loadStatuts(); draw(); }
  if(!struct.years.find(y=>y.label===S.annee)) S.annee = struct.years.length ? struct.years[struct.years.length-1].label : '';
  await loadStatuts();

  const head = wrap.querySelector('#suiviHead'), body = wrap.querySelector('#suiviBody');

  function drawHead(){
    head.innerHTML = '';
    const bar = el(`<div class="card" style="margin-bottom:1em;">
      <div class="row" style="align-items:flex-end;">
        <div class="field" style="margin:0; min-width:180px;"><label>Année scolaire</label>
          <select id="sYear">${struct.years.length ? struct.years.map(y=>`<option ${y.label===S.annee?'selected':''}>${escapeHtml(y.label)}</option>`).join('') : '<option value="">Aucune année</option>'}</select></div>
        <div class="field" style="margin:0;"><label>Nouvelle année</label>
          <div class="row" style="gap:.4em; flex-wrap:nowrap;"><input id="sNewYear" placeholder="ex : 2027-2028" style="width:140px;"><button class="btn btn-ghost btn-sm" id="sAddYear" type="button">Ajouter l'année</button></div></div>
        ${S.annee ? `<button class="btn btn-ghost btn-sm" id="sDelYear" type="button" style="color:var(--bad);">Supprimer cette année</button>` : ''}
      </div>
      <div class="row" style="margin-top:.8em; align-items:center;">
        <div class="seg" id="sTri">${[1,2,3].map(t=>`<button type="button" data-t="${t}" class="${S.trimestre===t?'on':''}">Trimestre ${t}</button>`).join('')}</div>
        <div class="seg" id="sTabs"><button type="button" data-tab="tableau" class="${S.tab==='tableau'?'on':''}">Tableau de suivi</button><button type="button" data-tab="structure" class="${S.tab==='structure'?'on':''}">Structure de l'établissement</button></div>
      </div></div>`);
    bar.querySelector('#sYear').onchange = async e=>{ S.annee = e.target.value; suiviSave(); await loadStatuts(); draw(); };
    bar.querySelector('#sAddYear').onclick = async ()=>{
      const label = bar.querySelector('#sNewYear').value.trim(); if(!label){ alert("Écrivez l'année scolaire (ex. 2026-2027)."); return; }
      try{ await api('/api/suivi/years', {method:'POST', body:{label}}); S.annee = label; suiviSave(); await reload(); }catch(e){ alert(e.message); }
    };
    bar.querySelector('#sDelYear')?.addEventListener('click', async ()=>{
      const y = struct.years.find(x=>x.label===S.annee); if(!y) return;
      if(!confirm(`Supprimer l'année ${y.label} ? Tous les statuts et historiques de cette année seront effacés définitivement.`)) return;
      try{ await api(`/api/suivi/years/${y.id}`, {method:'DELETE'}); S.annee=''; suiviSave(); await reload(); }catch(e){ alert(e.message); }
    });
    bar.querySelectorAll('#sTri [data-t]').forEach(b=>b.onclick = async ()=>{ S.trimestre = Number(b.dataset.t); suiviSave(); await loadStatuts(); draw(); });
    bar.querySelectorAll('#sTabs [data-tab]').forEach(b=>b.onclick = ()=>{ S.tab = b.dataset.tab; suiviSave(); draw(); });
    head.appendChild(bar);
  }

  /* ---------------- Tableau de suivi ---------------- */
  function drawTableau(){
    body.innerHTML = '';
    const leaves = suiviLeaves(struct);
    if(!S.annee){ body.appendChild(el(`<div class="banner">Commencez par ajouter une année scolaire ci-dessus.</div>`)); return; }
    if(!leaves.length || !struct.matieres.length){
      body.appendChild(el(`<div class="banner">Le tableau se construit automatiquement à partir de la structure. Il faut au moins une section avec une classe, et une matière : ouvrez l'onglet « Structure de l'établissement ».</div>`));
      return;
    }
    const f = filters;
    const visLeaves = leaves.filter(l=> (!f.section || l.section.id===f.section) && (!f.classe || l.classe.id===f.classe) && (!f.leaf || l.id===f.leaf) && (!f.niveau || l.niveau===f.niveau));
    // Les matières suivies dépendent de la section (ex. Primaire : français et sciences ; Secondaire : français seulement).
    const matsOf = leaf => { const ids = leaf.section.matieres || []; return (ids.length ? struct.matieres.filter(m=>ids.includes(m.id)) : struct.matieres).filter(m=>!f.matiere || m.id===f.matiere); };
    const visMat = struct.matieres.filter(m=>(!f.matiere || m.id===f.matiere) && visLeaves.some(l=>matsOf(l).some(x=>x.id===m.id)));
    const types = S.vue==='type' ? SUIVI_TYPES.filter(t=>t.id===S.typeSel) : SUIVI_TYPES.filter(t=>!f.type || t.id===f.type);
    const get = (type,leaf,mat)=> statuts[`${type}|${leaf}|${mat}`] || 0;

    // Filtres
    const sections = struct.nodes.filter(n=>n.kind==='section'); const classes = struct.nodes.filter(n=>n.kind==='classe' && (!f.section || n.parentId===f.section));
    const leafOpts = leaves.filter(l=>(!f.section||l.section.id===f.section) && (!f.classe||l.classe.id===f.classe));
    const sel = (id,label,opts,cur)=>`<div class="field" style="margin:0; min-width:130px;"><label>${label}</label><select data-f="${id}"><option value="">Tous</option>${opts.map(o=>`<option value="${escapeHtml(o[0])}" ${String(cur)===String(o[0])?'selected':''}>${escapeHtml(o[1])}</option>`).join('')}</select></div>`;
    const fbox = el(`<div class="card" style="margin-bottom:1em;"><div class="row" style="align-items:flex-end;">
      ${sel('section','Section',sections.map(s=>[s.id,s.nom]),f.section)}
      ${sel('classe','Classe',classes.map(c=>[c.id,c.nom]),f.classe)}
      ${sel('leaf','Groupe',leafOpts.map(l=>[l.id, l.groupe?l.groupe.nom:'(sans groupe) '+l.classe.nom]),f.leaf)}
      ${sel('matiere','Matière',struct.matieres.map(m=>[m.id,m.nom]),f.matiere)}
      ${struct.niveaux.length?sel('niveau','Niveau',struct.niveaux.map(n=>[n.nom,n.nom]),f.niveau):''}
      ${S.vue==='synthese'?sel('type','Type',SUIVI_TYPES.map(t=>[t.id,t.label]),f.type):''}
      ${sel('statut','Statut',SUIVI_STATUTS.map(s=>[s.n,s.label]),f.statut)}
    </div>
    <div class="row" style="margin-top:.7em; align-items:center; gap:.4em;">
      <span class="muted" style="font-size:.82rem;">Affichage rapide :</span>
      <button class="btn btn-ghost btn-sm" type="button" data-q="0">Seulement les non reçus</button>
      <button class="btn btn-ghost btn-sm" type="button" data-q="2">Seulement en révision</button>
      <button class="btn btn-ghost btn-sm" type="button" data-q="4">Seulement en attente de validation du professeur</button>
      <button class="btn btn-ghost btn-sm" type="button" data-q="6">Seulement prêts à appliquer</button>
      <button class="btn btn-ghost btn-sm" type="button" data-q="">Tout afficher</button>
    </div></div>`);
    fbox.querySelectorAll('select[data-f]').forEach(s=>s.onchange = e=>{
      const k = s.dataset.f; f[k] = e.target.value;
      if(k==='section'){ f.classe=''; f.leaf=''; } if(k==='classe'){ f.leaf=''; }
      drawTableau();
    });
    fbox.querySelectorAll('[data-q]').forEach(b=>b.onclick = ()=>{ f.statut = b.dataset.q; drawTableau(); });
    body.appendChild(fbox);

    // Lignes + compteurs
    const rows = [];
    visLeaves.forEach(l=> matsOf(l).forEach(m=> rows.push({leaf:l, mat:m})));
    const counts = Array(8).fill(0); let total = 0, sum = 0;
    // « Pas appliqué à ce moment » n'entre ni dans le total ni dans la progression.
    rows.forEach(r=> types.forEach(t=>{ const st = get(t.id,r.leaf.id,r.mat.id); counts[st]++; if(st!==7){ total++; sum += st; } }));
    const shown = f.statut==='' ? rows : rows.filter(r=> types.some(t=>get(t.id,r.leaf.id,r.mat.id)===Number(f.statut)));
    const pct = total ? Math.round(100*sum/(total*6)) : 0;
    const cbox = el(`<div class="card" style="margin-bottom:1em;">
      <div class="row" style="justify-content:space-between; align-items:center;"><strong>Total : ${total} document${total>1?'s':''}</strong><strong>Progression : ${pct} %</strong></div>
      <div class="bar-track" style="margin:.5em 0;"><div class="bar-fill" style="width:${pct}%; background:var(--admin);"></div></div>
      <p class="muted" style="font-size:.78rem; margin:0 0 .6em;">La progression est la moyenne de l'avancement des documents affichés, de « Non reçu » (0 %) à « Prêt à appliquer » (100 %). Les éléments « Pas appliqué à ce moment » ne sont pas comptés.</p>
      <div class="row" style="gap:.5em;">${SUIVI_STATUTS.map(s=>`<span class="suivi-pill" style="background:${s.soft}; color:${s.color}; border-color:${s.color};">${escapeHtml(s.label)} : ${counts[s.n]}</span>`).join('')}</div></div>`);
    body.appendChild(cbox);

    // Choix de la vue
    const vbox = el(`<div class="row" style="margin-bottom:.6em; align-items:center;">
      <div class="seg" id="sVue"><button type="button" data-v="synthese" class="${S.vue==='synthese'?'on':''}">Vue synthèse (Guide, Examen, Projet)</button><button type="button" data-v="type" class="${S.vue==='type'?'on':''}">Vue par type (une colonne par matière)</button></div>
      ${S.vue==='type'?`<div class="seg" id="sTypeSel">${SUIVI_TYPES.map(t=>`<button type="button" data-ty="${t.id}" class="${S.typeSel===t.id?'on':''}">${t.label}</button>`).join('')}</div>`:''}</div>`);
    vbox.querySelectorAll('[data-v]').forEach(b=>b.onclick = ()=>{ S.vue = b.dataset.v; suiviSave(); drawTableau(); });
    vbox.querySelectorAll('[data-ty]').forEach(b=>b.onclick = ()=>{ S.typeSel = b.dataset.ty; suiviSave(); drawTableau(); });
    body.appendChild(vbox);

    if(!shown.length){ body.appendChild(el(`<p class="muted">Aucun document ne correspond à ces filtres.</p>`)); return; }
    const cellBtn = (type, leaf, mat)=>{
      const st = get(type, leaf.id, mat.id); const s = SUIVI_STATUTS[st];
      return `<button type="button" class="suivi-cell" data-type="${type}" data-leaf="${leaf.id}" data-mat="${mat.id}" style="background:${s.soft}; color:${s.color}; border-color:${s.color};">${escapeHtml(s.label)}</button>`;
    };
    let html = '<div class="overflow-x"><table class="suivi-table"><thead><tr><th>Section</th><th>Classe</th><th>Groupe</th>';
    if(S.vue==='synthese'){
      html += '<th>Matière</th>' + types.map(t=>`<th>${t.label}</th>`).join('') + '</tr></thead><tbody>';
      shown.forEach(r=>{
        html += `<tr><td>${escapeHtml(r.leaf.section.nom)}</td><td>${escapeHtml(r.leaf.classe.nom)}</td><td>${r.leaf.groupe?escapeHtml(r.leaf.groupe.nom):'<span class="muted">—</span>'}${r.leaf.niveau?` <span class="muted" style="font-size:.78rem;">(${escapeHtml(r.leaf.niveau)})</span>`:''}</td><td>${escapeHtml(r.mat.nom)}</td>`
          + types.map(t=>`<td>${cellBtn(t.id, r.leaf, r.mat)}</td>`).join('') + '</tr>';
      });
    } else {
      const mats = visMat;
      const applies = (l,m)=> matsOf(l).some(x=>x.id===m.id);
      html += mats.map(m=>`<th>${escapeHtml(m.nom)}</th>`).join('') + '</tr></thead><tbody>';
      const leafShown = visLeaves.filter(l=> f.statut==='' ? mats.some(m=>applies(l,m)) : mats.some(m=>applies(l,m) && get(S.typeSel,l.id,m.id)===Number(f.statut)));
      leafShown.forEach(l=>{
        html += `<tr><td>${escapeHtml(l.section.nom)}</td><td>${escapeHtml(l.classe.nom)}</td><td>${l.groupe?escapeHtml(l.groupe.nom):'<span class="muted">—</span>'}${l.niveau?` <span class="muted" style="font-size:.78rem;">(${escapeHtml(l.niveau)})</span>`:''}</td>`
          + mats.map(m=>applies(l,m) ? `<td>${cellBtn(S.typeSel, l, m)}</td>` : `<td><span class="muted">-</span></td>`).join('') + '</tr>';
      });
    }
    html += '</tbody></table></div>';
    const tw = el(`<div></div>`); tw.innerHTML = html; body.appendChild(tw);
    tw.querySelectorAll('.suivi-cell').forEach(b=>b.onclick = ()=>openPicker(b.dataset.type, b.dataset.leaf, b.dataset.mat));
  }

  function leafLabel(leafId){
    const l = suiviLeaves(struct).find(x=>x.id===leafId); if(!l) return '';
    return [l.section.nom, l.classe.nom, l.groupe?l.groupe.nom:null].filter(Boolean).join(' / ');
  }
  function openPicker(type, leafId, matId){
    const mat = struct.matieres.find(m=>m.id===matId); const tl = SUIVI_TYPES.find(t=>t.id===type).label;
    const cur = statuts[`${type}|${leafId}|${matId}`] || 0;
    const ov = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:1em;">
      <div class="card" style="max-width:420px; width:100%; background:var(--paper-raised);">
        <h3 style="margin:0 0 .2em;">${tl} — ${escapeHtml(mat?mat.nom:'')}</h3>
        <p class="muted" style="font-size:.85rem; margin:0 0 .8em;">${escapeHtml(leafLabel(leafId))} · ${escapeHtml(S.annee)} · Trimestre ${S.trimestre}</p>
        <div id="pk"></div>
        <div class="row" style="justify-content:space-between; margin-top:.8em;"><button class="btn btn-ghost btn-sm" id="pkHist" type="button">Voir l'historique</button><button class="btn btn-ghost btn-sm" id="pkClose" type="button">Fermer</button></div>
      </div></div>`);
    SUIVI_STATUTS.forEach(s=>{
      const b = el(`<button type="button" class="suivi-opt" style="background:${s.soft}; color:${s.color}; border-color:${s.color}; ${s.n===cur?'outline:3px solid '+s.color+'; outline-offset:1px;':''}">${s.n<7 ? (s.n+1)+'. ' : ''}${escapeHtml(s.label)}${s.n===cur?' (statut actuel)':''}</button>`);
      if(s.n===7) b.style.marginTop = '.6em';
      b.onclick = async ()=>{
        try{
          await api('/api/suivi/statut', {method:'PUT', body:{annee:S.annee, trimestre:S.trimestre, type, leafId, matiereId:matId, statut:s.n}});
          statuts[`${type}|${leafId}|${matId}`] = s.n; ov.remove(); drawTableau();
        }catch(e){ alert(e.message); }
      };
      ov.querySelector('#pk').appendChild(b);
    });
    ov.querySelector('#pkClose').onclick = ()=>ov.remove();
    ov.querySelector('#pkHist').onclick = ()=>{ ov.remove(); openHistory(type, leafId, matId); };
    document.body.appendChild(ov);
  }
  async function openHistory(type, leafId, matId){
    const mat = struct.matieres.find(m=>m.id===matId); const tl = SUIVI_TYPES.find(t=>t.id===type).label;
    let list = [];
    try{ list = await api(`/api/suivi/historique?annee=${encodeURIComponent(S.annee)}&trimestre=${S.trimestre}&type=${type}&leafId=${leafId}&matiereId=${matId}`); }catch(e){ alert(e.message); return; }
    const ov = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:60; padding:1em;">
      <div class="card" style="max-width:460px; width:100%; background:var(--paper-raised); max-height:85vh; overflow:auto;">
        <h3 style="margin:0 0 .2em;">Historique — ${tl}, ${escapeHtml(mat?mat.nom:'')}</h3>
        <p class="muted" style="font-size:.85rem; margin:0 0 .8em;">${escapeHtml(leafLabel(leafId))} · ${escapeHtml(S.annee)} · Trimestre ${S.trimestre}</p>
        <div id="hl"></div><div class="row" style="justify-content:flex-end; margin-top:.8em;"><button class="btn btn-ghost btn-sm" id="hClose" type="button">Fermer</button></div></div></div>`);
    const hl = ov.querySelector('#hl');
    if(!list.length) hl.appendChild(el(`<p class="muted">Aucun changement enregistré pour le moment (statut : Non reçu).</p>`));
    list.forEach((h,i)=>{
      const d = new Date(h.at).toLocaleString('fr-FR', {day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
      hl.appendChild(el(`<div style="padding:.4em 0; ${i?'border-top:1px solid var(--line);':''}">${suiviPill(h.statut)} <span style="font-size:.85rem;"> — ${escapeHtml(d)}</span>${h.par?` <span class="muted" style="font-size:.78rem;">(${escapeHtml(h.par)})</span>`:''}</div>`));
    });
    ov.querySelector('#hClose').onclick = ()=>ov.remove(); document.body.appendChild(ov);
  }

  /* ---------------- Structure de l'établissement ---------------- */
  function nameInput(value, onSave, placeholder, width){
    const inp = el(`<input value="${escapeHtml(value||'')}" placeholder="${escapeHtml(placeholder||'')}" style="${width?'width:'+width+';':''} font-weight:600;">`);
    inp.onchange = async ()=>{ try{ await onSave(inp.value); }catch(e){ alert(e.message); await reload(); } };
    return inp;
  }
  function addRow(label, placeholder, onAdd){
    const r = el(`<div class="row" style="gap:.4em; align-items:center; margin-top:.4em; flex-wrap:nowrap;"><input placeholder="${escapeHtml(placeholder)}" style="flex:1; min-width:120px;"><button class="btn btn-ghost btn-sm" type="button">${escapeHtml(label)}</button></div>`);
    const inp = r.querySelector('input');
    const go = async ()=>{ const v = inp.value.trim(); if(!v) return; try{ await onAdd(v); }catch(e){ alert(e.message); } };
    r.querySelector('button').onclick = go; inp.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
    return r;
  }
  function ctrl(model, id, base){ // Monter / Descendre / Supprimer

      try{
        if(b.dataset.a==='del'){
          const msg = base.confirm; if(!confirm(msg)) return;
          await api(`${base.path}/${id}`, {method:'DELETE'});
        } else await api(`${base.path}/${id}/move`, {method:'POST', body:{dir:b.dataset.a}});
        await reload();
      }catch(e){ alert(e.message); }
    });
    return c;
  }

    body.innerHTML = '';

      const mrow = el(`<div class="row" style="gap:.9em; margin:.5em 0 .1em; align-items:center;"><span class="muted" style="font-size:.8rem;">Matières suivies dans cette section :</span></div>`);

        lb.querySelector('input').onchange = async ()=>{
          const chosen = new Set(sec.matieres||[]); if(lb.querySelector('input').checked) chosen.add(m.id); else chosen.delete(m.id);
          try{ await api(`/api/suivi/nodes/${sec.id}`, {method:'PUT', body:{matieres:[...chosen]}}); await reload(); }catch(e){ alert(e.message); }
        };

      });
      if(!(sec.matieres||[]).length) mrow.appendChild(el(`<span class="muted" style="font-size:.78rem;">(aucune case cochée : toutes les matières sont suivies)</span>`));
      card.appendChild(mrow);
      kids(sec.id,'classe').forEach(cl=>{

      });
      const ac = addRow('Ajouter une classe','Nom de la classe (ex. Première année, 1A, 3e)', v=>api('/api/suivi/nodes',{method:'POST',body:{kind:'classe',parentId:sec.id,nom:v}}).then(reload));
      ac.style.marginLeft = '1.2em'; card.appendChild(ac);

    });
    tree.appendChild(addRow('Ajouter une section','Nom de la section (ex. Primaire)', v=>api('/api/suivi/nodes',{method:'POST',body:{kind:'section',nom:v}}).then(reload)));

    const listCard = (title, items, path, addLabel, ph, confirmTxt, note)=>{
      const c = el(`<div class="card" style="margin-bottom:.8em;"><h3 style="margin:0 0 .3em;">${title}</h3>${note?`<p class="muted" style="font-size:.8rem; margin:0 0 .5em;">${note}</p>`:''}</div>`);
      items.forEach(it=>{

        c.appendChild(r);
      });
      c.appendChild(addRow(addLabel, ph, v=>api(path,{method:'POST',body:{nom:v}}).then(reload)));
      return c;
    };
    side.appendChild(listCard('Matières', struct.matieres, '/api/suivi/matieres', 'Ajouter une matière', 'ex. Français, Sciences', m=>`Supprimer la matière « ${m.nom} » et son suivi ? Cette action est définitive.`, 'Chaque matière devient une colonne ou une ligne du suivi.'));
    side.appendChild(listCard('Niveaux', struct.niveaux, '/api/suivi/niveaux', 'Ajouter un niveau', 'ex. A1, B1+', n=>`Supprimer le niveau « ${n.nom} » ? Les groupes concernés n'auront plus de niveau.`, 'Un niveau peut être associé à un groupe ; il sert aussi de filtre.'));
    body.appendChild(grid);
  }

  function draw(){ drawHead(); if(S.tab==='structure') drawStructure(); else drawTableau(); }
  draw();
  return wrap;
}

const PEDA_CATS = {
  appr_fr: ['Sujet / Thème','Grammaire','Verbes','Lexique / Vocabulaire','Lecture','Chanson','Compréhension orale','Compréhension écrite','Production orale','Production écrite','Culture / Civilisation','Autre'],
  guide_fr: ['Sujet / Thème','Grammaire','Verbes / Conjugaison','Lexique / Vocabulaire','Lecture','Chanson','Compréhension orale','Compréhension écrite','Production orale','Production écrite','Culture / Civilisation','Exercices','Autre'],
  sciences: ['Sujet / Thème','Notion scientifique','Vocabulaire scientifique','Lecture / Document','Expérience','Schéma / Graphique','Définition / Concept','Exercices','Vidéo','Document','Autre'],
  autre: ['Sujet / Thème','Notion','Vocabulaire','Lecture','Exercices','Autre'],
};
/** Les catégories s'adaptent à la matière choisie ; une nouvelle matière reçoit une liste générique. */
function pedaCategories(type, matiere){
  const m = String(matiere||'').toLowerCase();
  if(m.startsWith('scien')) return PEDA_CATS.sciences;
  if(m.startsWith('fran')) return type==='guide' ? PEDA_CATS.guide_fr : PEDA_CATS.appr_fr;
  return PEDA_CATS.autre;
}

/* ---------- Relecture par le professeur : statuts, observations, boîtes de dialogue ---------- */
const REVIEW_LABELS = {
  'assigné':     {label:'En attente de relecture du professeur', color:'#1F5AA6', soft:'#DCE8FA'},
  'validé':      {label:'Validé par le professeur',               color:'#25703D', soft:'#DCEDE2'},

function reviewBadge(status){
  const r = REVIEW_LABELS[status]; if(!r) return '';
  return `<span class="suivi-pill" style="background:${r.soft}; color:${r.color}; border-color:${r.color};">${escapeHtml(r.label)}</span>`;

function reviewNotesBlock(notes){
  if(!notes || !notes.length) return '';
  return `<div style="margin:.5em 0; padding:.5em .7em; background:var(--paper); border-left:3px solid var(--line); border-radius:6px; font-size:.85rem;">${notes.map(n=>`<div style="margin:.2em 0;"><strong>${n.de==='prof'?'Professeur':'Administrateur'}</strong> <span class="muted">(${escapeHtml(new Date(n.at).toLocaleDateString('fr-FR'))})</span> : ${escapeHtml(n.texte)}</div>`).join('')}</div>`;
}
/** Petite fenêtre avec un champ texte. Retourne le texte (éventuellement vide) ou null si annulé. */
function askNote({title, text, label, placeholder, required, okLabel}){
  return new Promise(resolve=>{
    const m = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:80; padding:1em;"><div class="card" style="max-width:480px; width:100%; background:var(--paper-raised);">
      <h3 style="margin-top:0;">${escapeHtml(title)}</h3>${text?`<p class="muted" style="font-size:.88rem;">${escapeHtml(text)}</p>`:''}
      <div class="field"><label>${escapeHtml(label||'Observations')}</label><textarea rows="4" placeholder="${escapeHtml(placeholder||'')}"></textarea></div>
      <p class="bad" id="nErr" style="color:var(--bad); font-size:.85rem; min-height:1.1em; margin:0;"></p>
      <div class="row" style="justify-content:flex-end; margin-top:.4em;"><button class="btn btn-ghost" id="nNo" type="button">Annuler</button><button class="btn btn-primary" id="nOk" type="button">${escapeHtml(okLabel||'Envoyer')}</button></div></div></div>`);
    const ta = m.querySelector('textarea');
    m.querySelector('#nNo').onclick = ()=>{ m.remove(); resolve(null); };
    m.querySelector('#nOk').onclick = ()=>{ const v = ta.value.trim(); if(required && !v){ m.querySelector('#nErr').textContent = 'Écrivez vos observations.'; return; } m.remove(); resolve(v); };
    document.body.appendChild(m); ta.focus();
  });
}
/** Boutons du professeur : « C'est OK » ou « Il y a des corrections ». endpoint = URL POST de la revue. */
function reviewControls(status, notes, endpoint, onDone){
  const box = el(`<div style="margin-top:.6em;"></div>`);
  box.appendChild(el(`<div>${reviewBadge(status)}</div>`));
  if(notes && notes.length) box.insertAdjacentHTML('beforeend', reviewNotesBlock(notes));
  if(status==='corrections') { box.appendChild(el(`<p class="muted" style="font-size:.82rem; margin:.3em 0 0;">L'administrateur a été prévenu : il corrigera puis vous renverra le document.</p>`)); return box; }
  const row = el(`<div class="row" style="gap:.5em; margin-top:.5em;"></div>`);
  const send = async (action, note)=>{ try{ await api(endpoint, {method:'POST', body:{action, note}}); onDone(); }catch(e){ alert(e.message); } };
  if(status!=='validé'){
    const ok = el(`<button class="btn btn-primary btn-sm" type="button">C'est OK, valider</button>`);
    ok.onclick = async ()=>{ const n = await askNote({title:'Valider ce document', text:"Vous confirmez que tout est correct. Vous pouvez ajouter un petit mot (facultatif).", label:'Commentaire (facultatif)', okLabel:'Valider'}); if(n!==null) send('valider', n); };
    row.appendChild(ok);
  }
  const ko = el(`<button class="btn btn-ghost btn-sm" type="button">${status==='validé'?'Finalement, il y a des corrections':'Il y a des corrections à faire'}</button>`);
  ko.onclick = async ()=>{ const n = await askNote({title:'Demander des corrections', text:"Décrivez précisément ce qu'il faut changer. L'administrateur fera les modifications puis vous renverra le document.", label:'Vos observations', placeholder:'ex : la page 12 du manuel est incorrecte pour le sujet 3', required:true, okLabel:'Envoyer mes observations'}); if(n!==null) send('corrections', n); };
  row.appendChild(ko);
  box.appendChild(row);
  return box;
}
const PEDA_LABELS = {apprentissages:'Apprentissages attendus', guide:'Guide de révision'};
const LANG_LABELS = {fr:'Français', es:'Español', en:'English'};
/** Langues pour lesquelles le document contient une traduction. */
function pedaLangs(data){
  const set = new Set(['fr']);
  ((data && data.items)||[]).forEach(it=>['es','en'].forEach(l=>{ const tr = it.tr && it.tr[l]; if(tr && Object.values(tr).some(v=>String(v||'').trim())) set.add(l); }));
  return ['fr','es','en'].filter(l=>set.has(l));
}
function pedaSetPath(item, path, value){
  const parts = path.split('.');
  if(parts[0]==='tr'){ item.tr = item.tr || {}; item.tr[parts[1]] = item.tr[parts[1]] || {}; item.tr[parts[1]][parts[2]] = value; }
  else item[path] = value;
}
function pedaDocTitle(d){ const i = (d.data && d.data.info) || {}; return [i.matiere, i.classe, i.periode, i.annee].filter(Boolean).join(', ') || d.titre; }

async function pedaDownloadAssigned(d, lang){
  const res = await api(`/api/peda/assignes/${d.id}/pdf?lang=${lang||'fr'}`, {raw:true});
  if(!res.ok){ let m = 'Le téléchargement a échoué.'; try{ m = (await res.json()).error || m; }catch(e){} throw new Error(m); }
  const blob = await res.blob();
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  const cd = res.headers.get('Content-Disposition') || ''; const mm = cd.match(/filename="([^"]+)"/);
  a.download = mm ? mm[1] : 'document.pdf'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
/** Fenêtre « Assigner » d'un document pédagogique : on coche un ou plusieurs professeurs (décocher = retirer). */
async function assignDocModal(doc, onDone){
  let teachers = [];
  try{ teachers = (await api('/api/teachers')).filter(t=>t.status==='active'); }catch(e){ alert(e.message); return; }

  const cur = new Map((doc.assignees||[]).map(a=>[a.teacherId, a]));

  const m = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:center; justify-content:center; z-index:80; padding:1em;"><div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow:auto; background:var(--paper-raised);">

    <div class="field"><label>${anyCorr?'Ce que j\'ai corrigé (facultatif)':'Message pour les professeurs (facultatif)'}</label><textarea id="aN" rows="3"></textarea></div>
    <div class="row" style="justify-content:flex-end;"><button class="btn btn-ghost" id="aNo" type="button">Annuler</button><button class="btn btn-primary" id="aOk" type="button">Enregistrer</button></div></div></div>`);
  const list = m.querySelector('#aList');
  teachers.forEach(t=>{
    const a = cur.get(t.id);
    list.appendChild(el(`<label style="display:flex; gap:.6em; align-items:center; margin:.3em 0; padding:.35em .5em; border:1px solid var(--line); border-radius:8px;"><input type="checkbox" value="${t.id}" style="width:auto;" ${a?'checked':''}><span style="flex:1;">${escapeHtml(t.name)}</span>${a?reviewBadge(a.reviewStatus):''}</label>`));
  });
  m.querySelector('#aNo').onclick = ()=>m.remove();

    const ids = [...list.querySelectorAll('input:checked')].map(i=>i.value);

  };
  document.body.appendChild(m);
}

async function pedaDownload(type, data, version, format, lang){
  lang = lang || 'fr';
  const res = await api('/api/peda/exporter', {method:'POST', body:{type, data, version, format, lang}, raw:true});
  if(!res.ok){ let m = 'Le téléchargement a échoué.'; try{ m = (await res.json()).error || m; }catch(e){} throw new Error(m); }
  const blob = await res.blob();
  const sl = x=>String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'_').replace(/^_|_$/g,'');
  const name = ['Camus', type==='guide'?'guide_revision':'apprentissages', sl(data.info.matiere), sl(data.info.classe), sl(data.info.periode), version==='eleves'?'eleves':'parents', lang==='fr'?'':lang].filter(Boolean).join('_') + '.' + format;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
