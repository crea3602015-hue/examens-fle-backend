const ACTIVE_ATTEMPT_KEY = 'fle_active_attempt';
function persistAttemptLocal(){
  if(!EXAM_RUNNER) return;
  localStorage.setItem(ACTIVE_ATTEMPT_KEY, JSON.stringify({
    attemptId: EXAM_RUNNER.attemptId, secret: EXAM_RUNNER.secret, exam: EXAM_RUNNER.exam, sessionToken: EXAM_RUNNER.sessionToken,
    qIndex: EXAM_RUNNER.qIndex, reponses: EXAM_RUNNER.reponses, deadline: EXAM_RUNNER.deadline,
  }));
}
function clearAttemptLocal(){ localStorage.removeItem(ACTIVE_ATTEMPT_KEY); }
/** Called at boot: if this device has an exam in progress, jump straight back
    into it instead of the home screen — no re-entry of name/classe needed. */
function tryResumeLocalAttempt(){
  let saved;
  try{ saved = JSON.parse(localStorage.getItem(ACTIVE_ATTEMPT_KEY) || 'null'); }catch(e){ return false; }
  if(!saved || !saved.attemptId || !saved.exam) return false;
  EXAM_RUNNER = {
    exam: saved.exam, attemptId: saved.attemptId, secret: saved.secret, sessionToken: saved.sessionToken,
    reponses: saved.reponses || {}, qIndex: saved.qIndex || 0, deadline: saved.deadline || null,
    flatQuestions: saved.exam.sections.flatMap(s=>s.questions.map(q=>({...q, sectionId:s.id}))),
  };
  document.documentElement.requestFullscreen?.().catch(()=>{});
  attachExamModeGuards();
  ROUTE = {view:'student-exam'};
  return true;
}

function onVisChange(){
  if(!EXAM_RUNNER) return;
  if(document.hidden){ reportIncident('visibilitychange'); setPresence(true); }
  else { setPresence(false); }
}
function onBlurEvent(){ if(EXAM_RUNNER){ reportIncident('blur'); setPresence(true); } }
function onFocusEvent(){ if(EXAM_RUNNER){ setPresence(false); } }
function onBeforeUnload(e){ if(EXAM_RUNNER){ e.preventDefault(); e.returnValue=''; return ''; } }
function onContextMenu(e){ if(EXAM_RUNNER) e.preventDefault(); }
function reportIncident(type){
  if(!EXAM_RUNNER) return;
  api(`/api/attempts/${EXAM_RUNNER.attemptId}/incident`, {auth:false, method:'POST', body:{secret:EXAM_RUNNER.secret, type}}).catch(()=>{});
}
function setPresence(away){
  if(!EXAM_RUNNER) return;
  api(`/api/attempts/${EXAM_RUNNER.attemptId}/presence`, {auth:false, method:'PATCH', body:{secret:EXAM_RUNNER.secret, away}}).catch(()=>{});
}
function attachExamModeGuards(){
  document.addEventListener('visibilitychange', onVisChange);
  window.addEventListener('blur', onBlurEvent);
  window.addEventListener('focus', onFocusEvent);
  window.addEventListener('beforeunload', onBeforeUnload);
  document.addEventListener('contextmenu', onContextMenu);
}
function detachExamModeGuards(){
  document.removeEventListener('visibilitychange', onVisChange);
  window.removeEventListener('blur', onBlurEvent);
  window.removeEventListener('focus', onFocusEvent);
  window.removeEventListener('beforeunload', onBeforeUnload);
  document.removeEventListener('contextmenu', onContextMenu);
}
let autosaveTimer = null;
let lastSavedJson = null;
function autosave(){
  if(!EXAM_RUNNER) return;
  persistAttemptLocal();
  const json = JSON.stringify(EXAM_RUNNER.reponses);
  if(json === lastSavedJson) return;
  lastSavedJson = json;
  if(EXAM_RUNNER.paused) return;
  api(`/api/attempts/${EXAM_RUNNER.attemptId}`, {auth:false, method:'PATCH', body:{secret:EXAM_RUNNER.secret, reponses:EXAM_RUNNER.reponses}}).catch(()=>{});
}


/* =========================================================
   CLAVIER DE L'APPLICATION (remplace le clavier du téléphone/tablette pendant l'examen :
   pas de mots proposés, pas de correction automatique)
   ========================================================= */
let KB_TARGET = null, KB_SHIFT = false, KB_EL = null;
const KB_ROWS = [
  ['1','2','3','4','5','6','7','8','9','0'],
  ['a','z','e','r','t','y','u','i','o','p'],
  ['q','s','d','f','g','h','j','k','l','m'],
  ['⇧','w','x','c','v','b','n',"'",'⌫'],
  ['é','è','ê','à','â','ç','ù','û','î','ô','œ','ë'],
  [',','.','?','!','-',':',';','(',')','espace','↵'],
];
function appKbEl(){
  if(KB_EL) return KB_EL;
  KB_EL = el(`<div id="appKb" translate="no"><div class="kbhead"><span>⌨ Clavier de l'application</span><button type="button" data-k="close" style="max-width:none; flex:none; width:auto; height:30px; padding:0 .8em; font-size:.85rem;">Fermer ✕</button></div></div>`);
  KB_ROWS.forEach(row=>{
    const r = el(`<div class="kbrow"></div>`);
    row.forEach(k=>{
      const b = el(`<button type="button" data-k="${escapeHtml(k)}" class="${k==='⇧'||k==='⌫'||k==='↵'?'wide':''} ${k==='espace'?'space':''}">${k==='espace'?'espace':escapeHtml(k)}</button>`);
      r.appendChild(b);
    });
    KB_EL.appendChild(r);
  });
  const press = ev=>{
    const b = ev.target.closest('button'); if(!b) return; ev.preventDefault();
    const k = b.dataset.k;
    if(k==='close'){ hideAppKeyboard(); return; }
    if(k==='⇧'){ KB_SHIFT = !KB_SHIFT; refreshKbCase(); return; }
    if(!KB_TARGET) return;
    const t = KB_TARGET; const a = t.selectionStart ?? t.value.length, z = t.selectionEnd ?? t.value.length;
    let ins = '', del = false;
    if(k==='⌫') del = true;
    else if(k==='↵') ins = t.tagName==='TEXTAREA' ? '\n' : '';
    else if(k==='espace') ins = ' ';
    else ins = KB_SHIFT ? k.toUpperCase() : k;
    if(k==='↵' && t.tagName!=='TEXTAREA'){ hideAppKeyboard(); return; }
    let v = t.value, pos;
    if(del){ if(a!==z){ v = v.slice(0,a)+v.slice(z); pos = a; } else if(a>0){ v = v.slice(0,a-1)+v.slice(z); pos = a-1; } else pos = 0; }
    else { v = v.slice(0,a)+ins+v.slice(z); pos = a+ins.length; }
    t.value = v; try{ t.setSelectionRange(pos,pos); }catch(e){}
    t.dispatchEvent(new Event('input',{bubbles:true}));
    if(KB_SHIFT && !del && ins){ KB_SHIFT = false; refreshKbCase(); }
  };
  KB_EL.addEventListener('mousedown', ev=>ev.preventDefault());
  KB_EL.addEventListener('touchstart', ev=>{ ev.preventDefault(); press(ev); }, {passive:false});
  KB_EL.addEventListener('click', press);
  document.body.appendChild(KB_EL);
  return KB_EL;
}
function refreshKbCase(){
  if(!KB_EL) return;
  KB_EL.querySelectorAll('button[data-k]').forEach(b=>{
    const k = b.dataset.k;
    if(k==='⇧'){ b.classList.toggle('on', KB_SHIFT); return; }
    if(k.length===1 && /[a-zàâçéèêëîôùûœ]/i.test(k)) b.textContent = KB_SHIFT ? k.toUpperCase() : k.toLowerCase();
  });
}
function showAppKeyboard(target){
  KB_TARGET = target; const kb = appKbEl(); kb.style.display = 'block';
  document.body.style.paddingBottom = (kb.offsetHeight+10)+'px';
  setTimeout(()=>{ try{ target.scrollIntoView({block:'center', behavior:'smooth'}); }catch(e){} }, 60);
}
function hideAppKeyboard(){
  KB_TARGET = null; if(KB_EL) KB_EL.style.display = 'none'; document.body.style.paddingBottom = '';
}
/** Une zone de saisie d'examen : pas de clavier système, pas de suggestions, clavier de l'application à la place. */
function examTextInput(inp){
  inp.setAttribute('inputmode','none'); inp.setAttribute('autocomplete','off'); inp.setAttribute('autocorrect','off');
  inp.setAttribute('autocapitalize','off'); inp.setAttribute('spellcheck','false'); inp.setAttribute('enterkeyhint','done');
  inp.setAttribute('data-form-type','other'); inp.setAttribute('data-lpignore','true');
  const open = ()=>showAppKeyboard(inp);
  inp.addEventListener('focus', open); inp.addEventListener('click', open);
  return inp;
}

let timerInterval = null;
let hbTimer = null;

function examToast(msg, red){
  let t = document.getElementById('timeToast'); if(!t){ t = document.createElement('div'); t.id='timeToast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = red ? 'red' : ''; t.style.display = 'block'; try{ playBeep(); }catch(e){}
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.display='none'; }, 7000);
}
function lastSecsShow(n){
  let d = document.getElementById('lastSecs'); if(!d){ d = document.createElement('div'); d.id='lastSecs'; document.body.appendChild(d); }
  if(!n){ d.style.display='none'; return; } d.textContent = n; d.style.display='flex';
}
function examBlock(title, text, hide){
  let b = document.getElementById('examBlock'); if(!b){ b = document.createElement('div'); b.id='examBlock'; document.body.appendChild(b); }
  if(hide){ b.style.display='none'; return; }
  b.innerHTML = `<div class="inner"><h2>${escapeHtml(title)}</h2><p>${escapeHtml(text)}</p></div>`; b.style.display='flex';
}
/** Toutes les 4 s : indique au professeur si l'élève est présent, et lit l'état de la session (pause / fermeture). */
async function examHeartbeat(){
  const R = EXAM_RUNNER; if(!R) return;
  const away = document.hidden || !document.hasFocus();
  try{
    const r = await api(`/api/attempts/${R.attemptId}/presence`, {auth:false, method:'PATCH', body:{secret:R.secret, away}});
    if(!EXAM_RUNNER) return;
    if(r.finished || r.sessionStatut==='terminé'){
      clearInterval(hbTimer); clearInterval(timerInterval); clearInterval(autosaveTimer); lastSecsShow(0);
      document.exitFullscreen?.().catch(()=>{}); detachExamModeGuards(); clearAttemptLocal(); hideAppKeyboard(); examBlock('',' ',true);
      EXAM_RUNNER = null; ROUTE = {view:'student-done', closed:true}; render(); return;
    }
    if(r.sessionStatut==='en_pause'){
      if(!R.paused){ R.paused = true; R.pausedAt = Date.now(); hideAppKeyboard(); examBlock('⏸ Session en pause', "Le professeur a mis la session en pause. Attendez : l'examen reprendra automatiquement quand il la relancera."); }
    } else if(R.paused){
      R.paused = false; if(R.deadline && R.pausedAt) R.deadline += (Date.now()-R.pausedAt); R.pausedAt = null; persistAttemptLocal(); examBlock('','',true);
      if(R.timeUp){ submitExam({timeUp:true}); }
    }
  }catch(e){}
}

function viewStudentExam(){
  const R = EXAM_RUNNER;
  if(!R){ ROUTE={view:'student-entry'}; render(); return el('<div></div>'); }
  const total = R.flatQuestions.length;
  const q = R.flatQuestions[R.qIndex];

  const wrap = el(`<div class="exam-shell ${R.exam.niveau==='Préscolaire' ? 'niveau-prescolaire' : ''}" translate="no">
    <div class="exam-header">
      <div>${R.exam.logo ? `<img class="exam-logo" src="${getApiBase()}${R.exam.logo}" alt="">` : ''}<strong>${escapeHtml(R.exam.titre)}</strong>${R.sessionToken ? ` <span class="muted" style="font-size:.8rem;">— code ${R.sessionToken}</span>` : ''}</div>
      <div class="timer" id="timer"></div>
    </div>
    <div class="exam-body">
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(100*(R.qIndex)/total)}%"></div></div>
      <p class="muted" style="font-size:.82rem;">Question ${R.qIndex+1} / ${total}</p>
      <div id="qHost"></div>
      <p id="reqErr" style="color:var(--exam-accent); font-size:.85rem; min-height:1.2em; margin:.3em 0 0;"></p>
      <div class="row" style="justify-content:space-between; margin-top:1.4em;">
        <button class="btn btn-ghost" id="prev" ${(R.exam.navMode==='sequentiel' || R.qIndex===0) ? 'disabled' : ''}>&larr; Précédent</button>
        ${R.qIndex < total-1 ? `<button class="btn btn-primary big-btn" id="next" style="background:var(--student);">Suivant &rarr;</button>`
          : `<button class="btn btn-primary big-btn" id="submit" style="background:var(--good);">Envoyer l'examen</button>`}
      </div>
    </div>
  </div>`);

  const qHost = wrap.querySelector('#qHost');
  renderQuestionRunner(q, qHost, R);

  function isAnswered(q){
    const given = R.reponses[q.id];
    switch(q.type){
      case 'choix_unique': case 'image_choix': return given!==undefined && given!==null;
      case 'choix_multiple': return Array.isArray(given) && given.length>0;
      case 'vrai_faux': return given===true || given===false;
      case 'texte_court': case 'texte_long': case 'correction_manuelle': return !!(given && String(given).trim());
      case 'texte_trous': {
        const blanks = (q.textTemplate||'').split('___').length - 1;
        return Array.isArray(given) && given.length>=blanks && given.slice(0,blanks).every(v=>v && String(v).trim());
      }
      case 'association': {
        const n = (q.pairs||[]).length; return given && Object.keys(given).length>=n && n>0;
      }
      case 'association_images': {
        const n = (q.pairs||[]).length; return given && Object.keys(given).length>=n && n>0;
      }
      case 'dessin': return !!given;
      case 'classification': { const n=(q.elements||[]).length; const g=given||{}; return n>0 && Object.keys(g).filter(k=>g[k]).length>=n; }
      case 'classement': case 'production_orale': return true; // rien à forcer ici
      default: return given!==undefined && given!==null && given!=='';
    }
  }
  function blockIfUnanswered(){
    if(!isAnswered(q)){ wrap.querySelector('#reqErr').textContent = 'Merci de répondre avant de continuer.'; return true; }
    wrap.querySelector('#reqErr').textContent = '';
    return false;
  }

  wrap.querySelector('#prev')?.addEventListener('click', ()=>{ R.qIndex--; persistAttemptLocal(); ROUTE.view='student-exam'; render(); });
  wrap.querySelector('#next')?.addEventListener('click', ()=>{
    if(blockIfUnanswered()) return;
    R.qIndex++; autosave(); ROUTE.view='student-exam'; render();
  });
  wrap.querySelector('#submit')?.addEventListener('click', ()=>{
    if(blockIfUnanswered()) return;
    submitExam();
  });

  clearInterval(timerInterval);
  const timerEl = wrap.querySelector('#timer');
  if(R.exam.duree > 0){
    R.deadline = R.deadline || (Date.now() + R.exam.duree*60000);
    let prev = null;
    function tick(){
      if(R.paused) return;
      const remaining = Math.max(0, R.deadline - Date.now());
      const m = Math.floor(remaining/60000), s2 = Math.floor((remaining%60000)/1000);
      timerEl.textContent = `${String(m).padStart(2,'0')}:${String(s2).padStart(2,'0')}`;
      timerEl.className = 'timer' + (remaining<=60000 ? ' alert' : remaining<=300000 ? ' alert' : remaining<=600000 ? ' warn' : '');
      const crossed = lim => prev!==null && prev>lim && remaining<=lim;
      if(crossed(600000)) examToast('⏳ Il reste 10 minutes.', false);
      if(crossed(300000)) examToast('⚠ Il reste 5 minutes. Pensez à finir !', true);
      if(crossed(60000)) examToast('⚠ Dernière minute !', true);
      if(remaining>0 && remaining<=10000){ lastSecsShow(Math.ceil(remaining/1000)); if(prev===null || Math.ceil(prev/1000)!==Math.ceil(remaining/1000)) playBeep(); } else lastSecsShow(0);
      prev = remaining;
      if(remaining<=0){
        clearInterval(timerInterval); lastSecsShow(0);
        R.timeUp = true; examBlock('⏰ Temps écoulé', "Votre examen est envoyé automatiquement avec les réponses que vous avez déjà données.");
        setTimeout(()=>submitExam({timeUp:true}), 900);
      }
    }
    tick(); timerInterval = setInterval(tick, 1000);
  } else { timerEl.textContent = 'Sans limite'; }

  clearInterval(hbTimer);
  hbTimer = setInterval(examHeartbeat, 4000); examHeartbeat();

  clearInterval(autosaveTimer);
  autosaveTimer = setInterval(autosave, 7000);

  return wrap;
}

function renderQuestionRunner(q, host, R){
  host.innerHTML = '';
  hideAppKeyboard();
  const sec = R.exam.sections.find(s=>s.id===q.sectionId);
  const isFirstOfSection = R.flatQuestions.findIndex(x=>x.sectionId===q.sectionId) === R.qIndex;
  if((sec?.audio || sec?.consigne) && isFirstOfSection){
    const secBox = el(`<div class="passage-box" style="margin-bottom:.8em;"><p style="margin:0 0 .3em; font-weight:700;">${escapeHtml(sec.titre)}</p>
      ${sec.consigne ? `<p style="margin:0 0 .4em;">${escapeHtml(sec.consigne).replace(/\n/g,'<br>')}</p>` : ''}
      ${sec.audio ? `<audio src="${sec.audio}" style="display:none;"></audio><button type="button" class="big-audio-btn">🔊 Écouter l'audio</button>` : ''}</div>`);
    const audioBtn = secBox.querySelector('button');
    if(audioBtn) audioBtn.onclick = ()=>{ const a=secBox.querySelector('audio'); a.currentTime=0; a.play(); };
    host.appendChild(secBox);
  }
  if(q.passage){ host.appendChild(el(`<div class="passage-box">${escapeHtml(q.passage)}</div>`)); }
  host.appendChild(el(`<h3>${escapeHtml(q.enonce || '(question)')}</h3>`));
  if(q.media && q.type!=='dessin'){
    if(/\.(mp3|wav|m4a|ogg)(\?.*)?$/i.test(q.media)){
      const box = el(`<div><audio src="${q.media}" style="display:none;"></audio><button type="button" class="big-audio-btn">🔊 Écouter</button></div>`);
      const audioEl = box.querySelector('audio'); const btn = box.querySelector('button');
      btn.onclick = ()=>{ audioEl.currentTime = 0; audioEl.play(); };
      host.appendChild(box);
    } else {
      host.appendChild(el(`<img src="${q.media}" style="max-width:100%; border-radius:8px; margin:.6em 0;">`));
    }
  }
  const current = R.reponses[q.id];
  if(q.type==='choix_unique'){
    (q.options||[]).forEach((opt,i)=>{
      const b = el(`<button class="option-btn ${current===i?'selected':''}">${escapeHtml(opt||'(option)')}</button>`);
      b.onclick = ()=>{ R.reponses[q.id]=i; autosave(); renderQuestionRunner(q,host,R); };
      host.appendChild(b);
    });
  } else if(q.type==='choix_multiple'){
    const sel = current || [];
    (q.options||[]).forEach((opt,i)=>{
      const b = el(`<button class="option-btn ${sel.includes(i)?'selected':''}">${escapeHtml(opt||'(option)')}</button>`);
      b.onclick = ()=>{
        let arr = R.reponses[q.id] || [];
        arr = arr.includes(i) ? arr.filter(x=>x!==i) : [...arr, i];
        R.reponses[q.id] = arr; autosave(); renderQuestionRunner(q,host,R);
      };
      host.appendChild(b);
    });
  } else if(q.type==='vrai_faux'){
    [['Vrai',true],['Faux',false]].forEach(([label,val])=>{
      const b = el(`<button class="option-btn ${current===val?'selected':''}">${label}</button>`);
      b.onclick = ()=>{ R.reponses[q.id]=val; autosave(); renderQuestionRunner(q,host,R); };
      host.appendChild(b);
    });
  } else if(q.type==='texte_court'){
    const inp = examTextInput(el(`<input value="${escapeHtml(current||'')}" placeholder="Votre réponse">`));
    inp.oninput = e=>{ R.reponses[q.id]=e.target.value; };
    inp.onblur = autosave;
    host.appendChild(inp);
  } else if(q.type==='texte_long' || q.type==='correction_manuelle'){
    const ta = examTextInput(el(`<textarea rows="6">${escapeHtml(current||'')}</textarea>`));
    ta.oninput = e=>{ R.reponses[q.id]=e.target.value; };
    ta.onblur = autosave;
    host.appendChild(ta);
  } else if(q.type==='texte_trous'){
    const parts = (q.textTemplate||'').split('___');
    const arr = current || [];
    const p = el(`<p style="line-height:2.2;"></p>`);
    parts.forEach((part,i)=>{
      p.appendChild(document.createTextNode(part));
      if(i < parts.length-1){
        const inp = examTextInput(el(`<input style="display:inline-block; width:120px; margin:0 .3em;" value="${escapeHtml(arr[i]||'')}">`));
        inp.oninput = e=>{ const a2 = R.reponses[q.id] || []; a2[i]=e.target.value; R.reponses[q.id]=a2; };
        inp.onblur = autosave;
        p.appendChild(inp);
      }
    });
    host.appendChild(p);
  } else if(q.type==='production_orale'){
    host.appendChild(el(`<p class="muted">Cette partie sera évaluée à l'oral par votre professeur. Aucune saisie n'est nécessaire ici.</p>`));
  } else if(q.type==='association'){
    host.appendChild(el(`<p class="muted" style="font-size:.85rem;">Touchez un élément à gauche, puis celui qui lui correspond à droite : chaque paire prend sa couleur. Pour changer une réponse, touchez de nouveau la paire colorée, puis choisissez une autre réponse.</p>`));
    const given = R.reponses[q.id] || {};
    const pairs = q.pairs || [];
    const rightOrder = R._shuffledRight || (R._shuffledRight = {});
    if(!rightOrder[q.id]) rightOrder[q.id] = (q.rightPool||(q.pairs||[]).map(p=>p.right)).slice().sort(()=>Math.random()-0.5);
    const rights = rightOrder[q.id];
    const cols = el(`<div class="pair-cols"><div class="pair-col" id="lc"></div><div class="pair-col" id="rc"></div></div>`);
    host.appendChild(cols);
    const lc = cols.querySelector('#lc'), rc = cols.querySelector('#rc');
    const PAL = ['#D9480F','#1971C2','#2F9E44','#9C36B5','#E8A600','#0C8599','#C2255C','#5C940D','#495057','#F76707'];
    const colorOf = left=>{ const i = pairs.findIndex(p=>p.left===left); return PAL[(i<0?0:i)%PAL.length]; };
    let selectedLeft = null;
    const tint = c=>`border-color:${c}; background:${c}22;`;
    function draw(){
      lc.innerHTML=''; rc.innerHTML='';
      pairs.forEach(p=>{
        const matched = given[p.left] !== undefined;
        const c = colorOf(p.left);
        const b = el(`<div class="pair-item pc" style="${matched ? tint(c) : (selectedLeft===p.left ? 'border-color:'+c+'; box-shadow:0 0 0 3px '+c+'44;' : '')}"><span class="dot" style="background:${c};"></span>${escapeHtml(p.left)}</div>`);
        b.onclick = ()=>{
          if(matched){ delete given[p.left]; R.reponses[q.id] = given; selectedLeft = p.left; autosave(); draw(); return; }
          selectedLeft = (selectedLeft===p.left) ? null : p.left; draw();
        };
        lc.appendChild(b);
      });
      rights.forEach(r=>{
        const owner = Object.keys(given).find(k=>given[k]===r);
        const c = owner ? colorOf(owner) : null;
        const b = el(`<div class="pair-item ${owner?'pc':''}" style="${owner ? tint(c) : ''}">${owner?`<span class="dot" style="background:${c};"></span>`:''}${escapeHtml(r)}</div>`);
        b.onclick = ()=>{
          if(owner){ delete given[owner]; R.reponses[q.id] = given; selectedLeft = owner; autosave(); draw(); return; }
          if(!selectedLeft) return;
          given[selectedLeft] = r; R.reponses[q.id] = given; selectedLeft = null; autosave(); draw();
        };
        rc.appendChild(b);
      });
    }
    draw();
  } else if(q.type==='classification'){
    host.appendChild(el(`<p class="muted" style="font-size:.85rem;">Pour chaque élément, choisis la bonne catégorie.</p>`));
    const given = R.reponses[q.id] || {};
    (q.elements||[]).forEach((e,i)=>{
      const row = el(`<div class="row" style="align-items:center; margin:.4em 0;"><div style="flex:1; min-width:140px; font-weight:600;">${escapeHtml(e.texte)}</div>
        <select style="flex:1; max-width:260px;"><option value="">Choisir…</option>${(q.categories||[]).map(c=>`<option value="${escapeHtml(c)}" ${given[i]===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select></div>`);
      row.querySelector('select').onchange = ev=>{ const g2 = R.reponses[q.id] || {}; g2[i] = ev.target.value; R.reponses[q.id] = g2; autosave(); };
      host.appendChild(row);
    });
  } else if(q.type==='classement'){
    host.appendChild(el(`<p class="muted" style="font-size:.85rem;">Utilisez les flèches pour remettre les éléments dans le bon ordre.</p>`));
    const shuffled = R.reponses[q.id] || (q.items||[]).slice().sort(()=>Math.random()-0.5);
    R.reponses[q.id] = shuffled;
    const listDiv = el(`<div></div>`);
    host.appendChild(listDiv);
    function draw(){
      listDiv.innerHTML='';
      shuffled.forEach((it,i)=>{
        const row = el(`<div class="rank-item"><span class="handle">☰</span><span style="flex:1;">${escapeHtml(it)}</span>
          <button class="btn btn-ghost btn-sm" ${i===0?'disabled':''}>↑</button>
          <button class="btn btn-ghost btn-sm" ${i===shuffled.length-1?'disabled':''}>↓</button></div>`);
        const btns = row.querySelectorAll('button');
        btns[0].onclick = ()=>{ [shuffled[i-1],shuffled[i]]=[shuffled[i],shuffled[i-1]]; autosave(); draw(); };
        btns[1].onclick = ()=>{ [shuffled[i+1],shuffled[i]]=[shuffled[i],shuffled[i+1]]; autosave(); draw(); };
        listDiv.appendChild(row);
      });
    }
    draw();
  } else if(q.type==='image_choix'){
    const grid = el(`<div class="image-grid"></div>`);
    (q.options||[]).forEach((opt,i)=>{
      const tile = el(`<div class="image-tile ${current===i?'selected':''}">
        ${opt.image ? `<img src="${opt.image}">` : ''}
        ${opt.label ? `<div class="cap">${escapeHtml(opt.label)}</div>` : ''}
      </div>`);
      tile.onclick = ()=>{ R.reponses[q.id]=i; autosave(); renderQuestionRunner(q,host,R); };
      grid.appendChild(tile);
    });
    host.appendChild(grid);
  } else if(q.type==='association_images'){
    host.appendChild(el(`<p class="muted" style="font-size:.85rem;">Touchez une image à gauche, puis celle qui correspond à droite : chaque paire prend sa couleur. Pour changer, touchez la paire colorée puis choisissez une autre image.</p>`));
    const given = R.reponses[q.id] || {};
    const pairs = q.pairs || [];
    const rightPool = q.rightPool || [];
    const rightOrder = R._shuffledRightImg || (R._shuffledRightImg = {});
    if(!rightOrder[q.id]) rightOrder[q.id] = rightPool.slice().sort(()=>Math.random()-0.5);
    const rights = rightOrder[q.id];
    const cols = el(`<div class="pair-cols"><div class="pair-col" id="lc"></div><div class="pair-col" id="rc"></div></div>`);
    host.appendChild(cols);
    const lc = cols.querySelector('#lc'), rc = cols.querySelector('#rc');
    const PAL = ['#D9480F','#1971C2','#2F9E44','#9C36B5','#E8A600','#0C8599','#C2255C','#5C940D','#495057','#F76707'];
    const colorOf = id=>{ const i = pairs.findIndex(p=>p.id===id); return PAL[(i<0?0:i)%PAL.length]; };
    let selectedLeftId = null;
    function draw2(){
      lc.innerHTML=''; rc.innerHTML='';
      pairs.forEach(p=>{
        const matched = given[p.id] !== undefined; const c = colorOf(p.id);
        const tile = el(`<div class="image-tile" style="${matched ? 'border-color:'+c+'; background:'+c+'22;' : (selectedLeftId===p.id ? 'border-color:'+c+'; box-shadow:0 0 0 3px '+c+'44;' : '')}">
          ${p.left.image?`<img src="${p.left.image}">`:''}${p.left.label?`<div class="cap">${escapeHtml(p.left.label)}</div>`:''}<div style="height:6px; border-radius:3px; background:${c}; margin-top:.4em;"></div></div>`);
        tile.onclick = ()=>{
          if(matched){ delete given[p.id]; R.reponses[q.id] = given; selectedLeftId = p.id; autosave(); draw2(); return; }
          selectedLeftId = (selectedLeftId===p.id) ? null : p.id; draw2();
        };
        lc.appendChild(tile);
      });
      rights.forEach(rItem=>{
        const owner = Object.keys(given).find(k=>given[k]===rItem.id); const c = owner ? colorOf(owner) : null;
        const tile = el(`<div class="image-tile" style="${owner ? 'border-color:'+c+'; background:'+c+'22;' : ''}">
          ${rItem.right.image?`<img src="${rItem.right.image}">`:''}${rItem.right.label?`<div class="cap">${escapeHtml(rItem.right.label)}</div>`:''}${owner?`<div style="height:6px; border-radius:3px; background:${c}; margin-top:.4em;"></div>`:''}</div>`);
        tile.onclick = ()=>{
          if(owner){ delete given[owner]; R.reponses[q.id] = given; selectedLeftId = owner; autosave(); draw2(); return; }
          if(!selectedLeftId) return;
          given[selectedLeftId] = rItem.id; R.reponses[q.id] = given; selectedLeftId = null; autosave(); draw2();
        };
        rc.appendChild(tile);
      });
    }
    draw2();
  } else if(q.type==='dessin'){
    host.appendChild(el(`<p class="muted" style="font-size:.85rem;">Dessinez avec le doigt ou la souris. Choisissez une couleur, puis dessinez dans le cadre.</p>`));
    const toolbar = el(`<div class="draw-toolbar"></div>`);
    const colors = ['#1C2420','#B23A2E','#14514A','#B9791F','#4A3F73','#FFFFFF'];
    let currentColor = colors[0];
    colors.forEach((c,i)=>{
      const dot = el(`<button type="button" class="color-dot ${i===0?'active':''}" style="background:${c}; ${c==='#FFFFFF'?'border-color:#999;':''}"></button>`);
      dot.onclick = ()=>{ currentColor=c; toolbar.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('active')); dot.classList.add('active'); };
      toolbar.appendChild(dot);
    });
    const clearBtn = el(`<button type="button" class="btn btn-ghost btn-sm">Effacer</button>`);
    toolbar.appendChild(clearBtn);
    host.appendChild(toolbar);

    const wrapCanvas = el(`<div class="draw-canvas-wrap"></div>`);
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 420; canvas.style.width = '100%'; canvas.style.display = 'block';
    wrapCanvas.appendChild(canvas);
    host.appendChild(wrapCanvas);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 7;

    if(current){
      const img = new Image(); img.onload = ()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = current;
    } else if(q.media){
      const img = new Image(); img.crossOrigin = 'anonymous';
      img.onload = ()=>ctx.drawImage(img,0,0,canvas.width,canvas.height); img.src = q.media;
    }

    let drawingNow = false;
    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      return {x:(cx-rect.left)*(canvas.width/rect.width), y:(cy-rect.top)*(canvas.height/rect.height)};
    }
    function start(e){ drawingNow=true; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
    function move(e){ if(!drawingNow) return; const p=pos(e); ctx.strokeStyle=currentColor; ctx.lineTo(p.x,p.y); ctx.stroke(); e.preventDefault(); }
    function endDraw(){ if(!drawingNow) return; drawingNow=false; R.reponses[q.id] = canvas.toDataURL('image/png', 0.7); autosave(); }
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    if(window._drawMouseUpHandler) window.removeEventListener('mouseup', window._drawMouseUpHandler);
    window._drawMouseUpHandler = endDraw;
    window.addEventListener('mouseup', endDraw);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', endDraw);
    clearBtn.onclick = ()=>{ ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height); R.reponses[q.id] = canvas.toDataURL('image/png',0.7); autosave(); };
  }
}

async function submitExam(opts){
  const R = EXAM_RUNNER; if(!R) return;
  clearInterval(timerInterval); clearInterval(autosaveTimer); clearInterval(hbTimer);
  try{
    await api(`/api/attempts/${R.attemptId}/submit`, {auth:false, method:'POST', body:{secret:R.secret, reponses:R.reponses}});
  }catch(e){
    if(e.status===409 && e.data && e.data.sessionStatut==='en_pause'){
      // Session en pause : on ne peut pas envoyer maintenant ; la reprise relancera le suivi.
      timerInterval = null; hbTimer = setInterval(examHeartbeat, 4000); autosaveTimer = setInterval(autosave, 7000);
      R.paused = true; R.pausedAt = Date.now(); examBlock('⏸ Session en pause', "Le professeur a mis la session en pause. Attendez la reprise.");
      return;
    }
    examBlock('','',true);
    alert("L'envoi a rencontré un problème (" + e.message + "). Vos réponses restent sauvegardées, réessayez."); return;
  }
  lastSecsShow(0); examBlock('','',true); hideAppKeyboard();
  document.exitFullscreen?.().catch(()=>{});
  detachExamModeGuards();
  clearAttemptLocal();
  EXAM_RUNNER = null;
  ROUTE = {view:'student-done', timeUp: !!(opts && opts.timeUp)};
  render();
}

  return wrap;
}

let QUIZ_RUNNER = null;

async function viewQuizEntry(){
  const params = new URLSearchParams(location.search);
  const pre = params.get('quiz') || '';
  const wrap = el(`<div class="auth-card">
    <button class="link-btn" id="back">&larr; Retour</button>
    <h2 style="margin-top:.6em;">Rejoindre un quiz</h2>
    <p class="muted">Entrez le code donné par votre professeur.</p>
    <div class="card" style="margin-top:1em;">
      <div class="field"><label>Code du quiz</label><input id="code" value="${escapeHtml(pre)}" placeholder="ex : AB12CD" style="text-transform:uppercase;"></div>
      <div id="err" style="color:var(--bad); font-size:.85rem; min-height:1.2em;"></div>
      <button class="btn btn-primary big-btn" id="go" style="width:100%; background:#4C7A3B;">Continuer</button>
    </div>
  </div>`);
  wrap.querySelector('#back').onclick = ()=>{ROUTE={view:'home'};render();};
  async function attempt(){
    const code = wrap.querySelector('#code').value.trim().toUpperCase();
    const errBox = wrap.querySelector('#err');
    if(!code){ errBox.textContent = 'Merci de saisir un code.'; return; }
    try{
      const data = await api(`/api/quiz/sessions/by-code/${code}`, {auth:false});
      if(data.status==='ended'){ errBox.textContent = 'Ce quiz est terminé.'; return; }
      ROUTE = {view:'quiz-id', quizCode: code, quizTitle: data.title, quizStatus: data.status};
      render();
    }catch(e){ errBox.textContent = e.message; }
  }
  wrap.querySelector('#go').onclick = attempt;
  if(pre) setTimeout(attempt, 0);
  return wrap;
}

function viewQuizIdentify(){
  const avatars = ['🦁','🐸','🦊','🐼','🐵','🦄','🐳','🦋','🐢','🦉','🐧','🌟'];
  let selectedAvatar = avatars[Math.floor(Math.random()*avatars.length)];
  const wrap = el(`<div class="auth-card">
    <h2>${escapeHtml(ROUTE.quizTitle)}</h2>
    <div class="card">
      <div class="field"><label>Choisis ton avatar</label><div id="avatarPicker" class="row" style="gap:.4em; justify-content:center;"></div></div>
      <div class="field"><label>Votre nom</label><input id="nom"></div>
      <div id="err" style="color:var(--bad); font-size:.85rem; min-height:1.2em;"></div>
      <button class="btn btn-primary big-btn" id="join" style="width:100%; background:#4C7A3B;">Rejoindre</button>
    </div>
  </div>`);
  const picker = wrap.querySelector('#avatarPicker');
  function drawAvatars(){
    picker.innerHTML = '';
    avatars.forEach(a=>{
      const b = el(`<button type="button" style="font-size:1.6rem; padding:.3em .5em; border-radius:10px; border:2px solid ${a===selectedAvatar?'var(--student)':'var(--line)'}; background:${a===selectedAvatar?'var(--student-soft)':'var(--paper-raised)'};">${a}</button>`);
      b.onclick = ()=>{ selectedAvatar = a; drawAvatars(); };
      picker.appendChild(b);
    });
  }
  drawAvatars();
  wrap.querySelector('#join').onclick = async ()=>{
    const nom = wrap.querySelector('#nom').value.trim();
    const errBox = wrap.querySelector('#err');
    if(!nom){ errBox.textContent = 'Merci de renseigner votre nom.'; return; }
    try{
      const data = await api(`/api/quiz/sessions/${ROUTE.quizCode}/join`, {auth:false, method:'POST', body:{nom, avatar:selectedAvatar}});
      QUIZ_RUNNER = { code: ROUTE.quizCode, secret: data.secret, title: data.title, questions: data.questions, qIndex:0, answers:[], score:0 };
      ROUTE.view = 'quiz-play';
      render();
    }catch(e){ errBox.textContent = e.message; }
  };
  return wrap;
}

function viewQuizPlay(){
  const R = QUIZ_RUNNER;
  if(!R){ ROUTE={view:'quiz-entry'}; render(); return el('<div></div>'); }
  const q = R.questions[R.qIndex];
  const total = R.questions.length;
  const wrap = el(`<div class="exam-shell" style="background:#EFF3EC;">
    <div class="exam-header"><strong>${escapeHtml(R.title)}</strong><div class="muted">Question ${R.qIndex+1}/${total}</div></div>
    <div class="exam-body">
      <div class="progress-track"><div class="progress-fill" style="width:${Math.round(100*R.qIndex/total)}%; background:#4C7A3B;"></div></div>
      <h3>${escapeHtml(q.enonce)}</h3>
      <div id="opts"></div>
    </div>
  </div>`);
  const optsDiv = wrap.querySelector('#opts');
  q.options.forEach((opt,i)=>{
    const b = el(`<button class="option-btn">${escapeHtml(opt)}</button>`);
    b.onclick = async ()=>{
      optsDiv.querySelectorAll('button').forEach(x=>x.disabled=true);
      b.classList.add('selected');
      R.answers[R.qIndex] = i;
      api(`/api/quiz/sessions/${R.code}/progress`, {auth:false, method:'PATCH', body:{secret:R.secret, index:R.qIndex+1}}).catch(()=>{});
      setTimeout(async ()=>{
        if(R.qIndex < total-1){ R.qIndex++; ROUTE.view='quiz-play'; render(); }
        else{
          try{
            const res = await api(`/api/quiz/sessions/${R.code}/submit`, {auth:false, method:'POST', body:{secret:R.secret, answers:R.answers}});
            R.finalScore = res.score; R.finalTotal = res.total;
          }catch(e){ R.finalScore = null; }
          ROUTE.view='quiz-done'; render();
        }
      }, 500);
    };
    optsDiv.appendChild(b);
  });
  return wrap;
}

function viewQuizDone(){
  const R = QUIZ_RUNNER;
  const score = R ? R.finalScore : null;
  const total = R ? R.finalTotal : null;
  QUIZ_RUNNER = null;
  const pct = (score!==null && total) ? Math.round(100*score/total) : null;
  const emoji = pct===null ? '👋' : pct>=80 ? '🎉' : pct>=50 ? '👍' : '💪';
  const msg = pct===null ? '' : pct>=80 ? 'Excellent travail !' : pct>=50 ? 'Bien joué !' : 'Continue comme ça !';
  const wrap = el(`<div class="auth-card" style="text-align:center;">
    <div style="font-size:3rem; line-height:1;">${emoji}</div>
    <h2>Terminé !</h2>
    <div class="card">
      ${score!==null ? `<div style="display:flex; justify-content:center;"></div><p style="font-weight:700; margin-top:.4em;">${msg}</p><p class="muted">${score}/${total} bonnes réponses</p>` : `<p>Merci d'avoir joué.</p>`}
      <button class="btn btn-primary" id="home" style="margin-top:1em; background:#4C7A3B;">Retour à l'accueil</button>
    </div>
  </div>`);
  if(pct!==null) wrap.querySelector('.card div[style*="display:flex"]').appendChild(svgDonut(pct, pct>=80?'#2F7D46':pct>=50?'#D97706':'#B3261E', 110));
  wrap.querySelector('#home').onclick = ()=>{ ROUTE={view:'home'}; render(); };
  return wrap;
}

if('serviceWorker' in navigator){
  if(!location.pathname.startsWith('/test')) window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
let deferredInstallPrompt = null;
let ON_INSTALL_AVAILABLE = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  ON_INSTALL_AVAILABLE?.();
});
window.addEventListener('appinstalled', ()=>{ deferredInstallPrompt = null; ON_INSTALL_AVAILABLE?.(); });

(function init(){
  const params = new URLSearchParams(location.search);
  if(tryResumeLocalAttempt()){ render(); return; }
  if(params.get('session')) ROUTE = {view:'student-entry'};
  else if(params.get('quiz')) ROUTE = {view:'quiz-entry'};
  else if(params.get('access')) ROUTE = {view:'access-request'};
  else if(SESSION){ ROUTE = {view: SESSION.user.role==='ADMIN' ? 'admin-shell' : 'teacher-shell', tab:'dashboard'}; }
  else ROUTE = {view:'home'};
  render();
})();

/* =========================================================
   GLISSER-DÉPOSER : on peut déposer un fichier sur n'importe quel bouton « choisir un fichier »
   ou dans la fenêtre ouverte, sans fouiller dans ses dossiers.
   ========================================================= */
(function(){
  const hasFiles = e=>e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types||[], 'Files') >= 0;
  const fileInputs = ()=>Array.from(document.querySelectorAll('input[type=file]')).filter(i=>!i.disabled);
  function accepts(inp, f){
    const acc = (inp.accept||'').split(',').map(x=>x.trim().toLowerCase()).filter(Boolean); if(!acc.length) return true;
    const n = f.name.toLowerCase(), t = (f.type||'').toLowerCase();
    return acc.some(a=> a.startsWith('.') ? n.endsWith(a) : a.endsWith('/*') ? t.startsWith(a.slice(0,-1)) : t===a);
  }
  function pickInput(target){
    const all = fileInputs(); if(!all.length) return null;
    let n = target;
    for(let i=0; n && n!==document.body && i<8; i++, n=n.parentElement){
      const inside = n.querySelectorAll ? Array.from(n.querySelectorAll('input[type=file]')).filter(x=>!x.disabled) : [];
      if(inside.length===1) return inside[0];
      if(inside.length>1) break;
    }
    // fenêtre ouverte (fond sombre) : son seul champ de fichier
    const overlays = Array.from(document.querySelectorAll('body > div')).filter(d=>getComputedStyle(d).position==='fixed' && d.querySelector('input[type=file]'));
    if(overlays.length){ const o = overlays[overlays.length-1]; const f = o.querySelectorAll('input[type=file]'); if(f.length===1) return f[0]; }
    return all.length===1 ? all[0] : null;
  }
  let hintEl = null;
  function hint(show, txt){
    if(!hintEl){ hintEl = document.createElement('div'); hintEl.id='dropHint'; document.body.appendChild(hintEl); }
    hintEl.textContent = txt || ''; hintEl.style.display = show ? 'block' : 'none';
    document.body.classList.toggle('dragging-files', !!show);
  }
  let depth = 0;
  document.addEventListener('dragenter', e=>{ if(!hasFiles(e)) return; depth++; hint(true, 'Déposez le fichier sur le bouton « Choisir un fichier » ou dans la fenêtre ouverte'); });
  document.addEventListener('dragleave', e=>{ if(!hasFiles(e)) return; depth = Math.max(0, depth-1); if(!depth) hint(false); });
  document.addEventListener('dragover', e=>{ if(!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
  document.addEventListener('drop', e=>{
    if(!hasFiles(e)) return; e.preventDefault(); depth = 0; hint(false);
    const inp = pickInput(e.target);
    if(!inp){ alert("Ouvrez d'abord l'écran où vous voulez importer ce fichier (par exemple « Importer »), puis déposez-le dessus."); return; }
    let files = Array.from(e.dataTransfer.files||[]);
    const ok = files.filter(f=>accepts(inp,f));
    if(!ok.length){ alert(`Ce type de fichier n'est pas accepté ici (attendu : ${inp.accept||'tout fichier'}).`); return; }
    files = inp.multiple ? ok : ok.slice(0,1);
    const dt = new DataTransfer(); files.forEach(f=>dt.items.add(f));
    inp.files = dt.files; inp.dispatchEvent(new Event('change', {bubbles:true}));
  });
  // petit rappel sous chaque bouton de choix de fichier
  const decorate = ()=>{
    document.querySelectorAll('input[type=file]').forEach(inp=>{
      const lab = inp.closest('label'); if(!lab || lab.dataset.dh) return; lab.dataset.dh = '1';
      const sp = document.createElement('span'); sp.className = 'drop-hint'; sp.textContent = 'ou glissez le fichier ici'; lab.insertAdjacentElement('afterend', sp);
    });
  };
  new MutationObserver(()=>{ clearTimeout(decorate._t); decorate._t = setTimeout(decorate, 80); }).observe(document.documentElement, {childList:true, subtree:true});
})();
</script>
