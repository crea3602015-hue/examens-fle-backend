    };
    card.querySelector('[data-a="del"]').onclick = ()=>confirmDeleteExam(exam);
    list.appendChild(card);
  });
  return wrap;
}

/* =========================================================
   ADMIN: EXAM BUILDER
   ========================================================= */
function examBuilder(){
  const editingId = ROUTE.builderEditingId || null;
  const draft = ROUTE.builderDraft
    ? JSON.parse(JSON.stringify(ROUTE.builderDraft))
    : { titre:'', niveau:'Primaire', matiere:'Français', navMode:'libre', duree:0, autoriserReprise:true, statut:'brouillon', sections:[] };
  ROUTE.builderDraft = null; ROUTE.builderEditingId = null;

  const wrap = el(`<div>
    <h2>${editingId ? 'Modifier l\'examen' : 'Créer un examen'}</h2>
    <p class="muted" style="font-size:.85rem;">La structure est totalement libre : ajoutez autant de sections et de types de questions que nécessaire.</p>
    ${!editingId && !draft.sections.length ? `<div class="banner" style="display:flex; align-items:center; gap:.8em; flex-wrap:wrap;"><span>Première fois ? Laissez-vous guider, étape par étape.</span><button class="btn btn-primary btn-sm" type="button" id="wizBtn">🧭 Lancer l'assistant pas à pas</button></div>` : ''}
    ${draft.imported && !draft.verified ? `<div class="banner banner-error">
      Cet examen provient d'une importation Word automatique. Vérifiez et complétez chaque question avant de publier.
      <label style="display:flex; align-items:center; gap:.5em; margin-top:.5em; color:var(--ink);">
        <input type="checkbox" id="verifiedBox" style="width:auto;"> J'ai vérifié cet examen importé et il est prêt à être publié.
      </label>
    </div>` : ''}
    <div class="card">
      <div class="row">
        <div class="field" style="flex:2;"><label>Titre de l'examen</label><input id="titre" value="${escapeHtml(draft.titre)}"></div>
        <div class="field" style="flex:1;"><label>Niveau</label>
          ${levelPickerHTML('niveau')}</div>
        <div class="field" style="flex:1;"><label>Matière</label>
          <select id="matiere"><option>Français</option><option>Sciences</option></select></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1;"><label>Mode de navigation</label>
          <select id="navMode"><option value="libre">Libre (retour possible)</option><option value="sequentiel">Séquentiel</option></select></div>
        <div class="field" style="flex:1;"><label>Durée (minutes, 0 = illimité)</label><input type="number" id="duree" value="${draft.duree||0}" min="0"></div>
        <div class="field" style="flex:1;"><label>Reprise après interruption</label>
          <select id="reprise"><option value="true">Autorisée</option><option value="false">Non autorisée</option></select></div>
      </div>
      <div class="field" style="margin-top:.6em;"><label>Logo de cet examen <span class="muted" style="font-weight:400;">(propre à cet examen : il n'apparaît que sur lui, à l'écran de l'élève, dans l'aperçu, le Word et le PDF)</span></label>
        <div class="row" style="align-items:center; gap:.8em;"><div id="logoPrev"></div>
          <label class="btn btn-ghost btn-sm" style="margin:0; cursor:pointer;">Choisir un logo<input type="file" id="logoFile" accept="image/*" style="display:none;"></label>
          <button class="link-btn" id="logoDel" type="button">Retirer le logo</button><span class="muted" id="logoSt" style="font-size:.85rem;"></span></div></div>
      <p class="kbd-note" id="matiereHint"></p>
    </div>
    <div id="guidePanel"></div>
    <div id="sections" style="margin-top:1em;"></div>
    <button class="btn btn-ghost" id="addSection" style="margin-top:.5em;">+ Ajouter une section</button>
    <div class="row" style="margin-top:1.4em;">
      <button class="btn btn-ghost" id="checkExam" type="button">🧭 Vérifier l'examen</button>
      <button class="btn btn-primary" id="saveDraft">Enregistrer comme brouillon</button>
      <button class="btn btn-primary" id="publish" style="background:var(--good);">Publier l'examen</button>
      <div class="muted" style="align-self:center;">Total : <strong id="totalPts">0</strong> points</div>
    </div>
  </div>`);
  wrap.querySelector('#wizBtn')?.addEventListener('click', ()=>openExamWizard());
  bindLevelPicker(wrap, 'niveau', draft.niveau, v=>{ draft.niveau = v; });
  function drawLogoPrev(){
    wrap.querySelector('#logoPrev').innerHTML = draft.logoId ? `<img src="${getApiBase()}/api/uploads/${draft.logoId}" alt="Logo de l'examen" style="height:70px; max-width:220px; object-fit:contain; border:1px solid var(--line); border-radius:8px; padding:5px; background:#fff;">` : '<span class="muted">Aucun logo sur cet examen</span>';
    wrap.querySelector('#logoDel').style.display = draft.logoId ? '' : 'none';
  }
  drawLogoPrev();
  wrap.querySelector('#logoDel').onclick = ()=>{ draft.logoId = null; drawLogoPrev(); };
  wrap.querySelector('#logoFile').onchange = async e=>{
    const f = e.target.files[0]; if(!f) return; const st = wrap.querySelector('#logoSt');
    try{
      if(f.size > 2*1024*1024) throw new Error('Image trop lourde (2 Mo maximum).');
      st.innerHTML = '<span class="spin">⏳</span> Envoi du logo…';
      const up = await api('/api/uploads', {method:'POST', body:{dataBase64: await fileToBase64(f), mimeType: f.type}});
      draft.logoId = up.id; st.textContent = 'Logo ajouté. Pensez à enregistrer l\'examen.'; drawLogoPrev();
    }catch(err){ st.textContent = err.message; }
  };
  wrap.querySelector('#matiere').value = draft.matiere || 'Français';
  wrap.querySelector('#navMode').value = draft.navMode;
  wrap.querySelector('#reprise').value = String(draft.autoriserReprise);
  function updateMatiereHint(){
    const hint = wrap.querySelector('#matiereHint');
    hint.textContent = wrap.querySelector('#matiere').value==='Français'
      ? "Ajoutez une question « Production orale » si nécessaire — la note se saisit après coup, à la main."
      : "Examen de sciences : pas de production orale — notez simplement les questions pour un total sur 100.";
  }
  wrap.querySelector('#matiere').onchange = e=>{ draft.matiere = e.target.value; updateMatiereHint(); };
  updateMatiereHint();
  drawSchoolLogoControl(wrap.querySelector('.card'));

  const sectionsDiv = wrap.querySelector('#sections');
  const guidePanel = wrap.querySelector('#guidePanel');
  function jumpTo(issue){
    const target = issue.q ? wrap.querySelector(`[data-q="${issue.q}"]`) : (issue.sec ? sectionsDiv.querySelector(`[data-sec="${issue.sec}"]`) : null);
    scrollToEl(target);
  }
  /** Panneau « Guide pas à pas » : prochaine étape + avancement de chaque partie. */
  function drawGuide(){
    const issues = examIssues(draft);
    const errors = issues.filter(i=>i.lvl==='error'), warns = issues.filter(i=>i.lvl==='warn');
    guidePanel.innerHTML = '';
    const box = el(`<div class="card" style="margin-top:1em; border-left:4px solid ${errors.length?'var(--bad)':(warns.length?'#D97706':'var(--good)')};"></div>`);
    const next = errors[0] || warns[0];
    box.appendChild(el(`<div class="row" style="justify-content:space-between; align-items:center;">
      <div style="flex:1; min-width:220px;"><strong>🧭 Guide pas à pas</strong>
        <p class="muted" style="margin:.2em 0 0; font-size:.88rem;">${next ? 'Prochaine étape : '+escapeHtml(next.msg) : '✓ Tout est en ordre — vous pouvez publier l\'examen.'}</p></div>
      <button class="btn btn-ghost btn-sm" type="button" data-check>Voir la liste (${errors.length} à corriger · ${warns.length} remarque${warns.length>1?'s':''})</button>
    </div>`));
    const rows = el(`<div style="margin-top:.6em;"></div>`);
    draft.sections.forEach((sec,si)=>{
      const secIssues = issues.filter(i=>i.sec===sec.id && i.lvl==='error');
      const ok = sec.questions.length>0 && !secIssues.length;
      const pts = sectionPoints(sec);
      const r = el(`<div class="row" style="align-items:center; gap:.5em; padding:.25em 0; cursor:pointer;">
        <span style="width:1.4em; text-align:center; color:${ok?'var(--good)':'var(--bad)'}; font-weight:700;">${ok?'✓':'➜'}</span>
        <span style="flex:1;">${escapeHtml(sec.titre||('Partie '+(si+1)))}</span>
        <span class="muted" style="font-size:.82rem;">${sec.questions.length} question${sec.questions.length>1?'s':''} · ${pts}${sec.cible?' / '+sec.cible:''} pts</span></div>`);
      r.onclick = ()=> scrollToEl(sectionsDiv.querySelector(`[data-sec="${sec.id}"]`));
      rows.appendChild(r);
    });
    box.appendChild(rows);
    box.querySelector('[data-check]').onclick = ()=> openExamCheck(draft, jumpTo);
    guidePanel.appendChild(box);
  }
  let guideTimer = null;
  function refreshGuideSoon(){ clearTimeout(guideTimer); guideTimer = setTimeout(drawGuide, 350); }
  sectionsDiv.addEventListener('input', refreshGuideSoon);
  sectionsDiv.addEventListener('change', refreshGuideSoon);

  function refreshTotal(){
    wrap.querySelector('#totalPts').textContent = examTotalPoints(draft);
    draft.sections.forEach(sec=>{
      const label = sectionsDiv.querySelector(`[data-sec="${sec.id}"] [data-sec-pts]`);
      if(label){
        const pts = sectionPoints(sec);
        label.textContent = pts + (sec.cible ? ' / '+sec.cible : '') + ' pts';
        label.style.color = sec.cible ? (Math.abs(pts-Number(sec.cible))<0.001 ? 'var(--good)' : '#D97706') : '';
      }
    });
    drawGuide();
  }

  function renderQuestion(sec, q, qDiv){
    qDiv.innerHTML = '';
    qDiv.dataset.q = q.id;
    const head = el(`<div class="row" style="justify-content:space-between; align-items:center;">
      <span class="qtype-badge">${qLabel(q.type)}</span>
      <button class="link-btn" style="color:var(--bad);">Supprimer la question</button>
    </div>`);
    head.querySelector('button').onclick = ()=>{ sec.questions = sec.questions.filter(x=>x!==q); rerenderSection(sec); };
    qDiv.appendChild(head);
    if(q.aSaisir){
      const warn = el(`<div class="banner banner-error" style="margin:.5em 0;"><strong>⚠ Réponse à confirmer.</strong> Le document d'origine ne contenait pas le corrigé de cette question : la réponse affichée plus bas n'est qu'une valeur par défaut. Choisissez la bonne réponse, puis cliquez sur le bouton.
        <div style="margin-top:.4em;"><button class="btn btn-primary btn-sm" type="button">C'est la bonne réponse ✓</button></div></div>`);
      warn.querySelector('button').onclick = ()=>{ q.aSaisir = false; warn.remove(); refreshTotal(); };
      qDiv.appendChild(warn);
    }
    const passage = el(`<div class="field" style="margin-top:.5em;"><label>Texte de lecture (optionnel — affiché au-dessus de la question, ex. un texte à comprendre)</label><textarea rows="4" placeholder="Collez ici un texte, un dialogue, une consigne longue...">${escapeHtml(q.passage||'')}</textarea></div>`);
    passage.querySelector('textarea').oninput = e=>q.passage = e.target.value;
    qDiv.appendChild(passage);
    const enonce = el(`<div class="field" style="margin-top:.5em;"><label>Question</label><textarea rows="2">${escapeHtml(q.enonce||'')}</textarea></div>`);
    enonce.querySelector('textarea').oninput = e=>q.enonce = e.target.value;
    qDiv.appendChild(enonce);
    const meta = el(`<div class="row">
      <div class="field" style="flex:1;"><label>Points</label><input type="number" min="0" value="${q.points||1}"></div>
      <div class="field" style="flex:2;"><label>Média (URL audio/image, optionnel)</label><input value="${escapeHtml(q.media||'')}" placeholder="https://..."></div>
    </div>`);
    meta.querySelectorAll('input')[0].oninput = e=>{ q.points = Number(e.target.value); refreshTotal(); qDiv._refreshSum?.(); };
    const mediaInput = meta.querySelectorAll('input')[1];
    mediaInput.oninput = e=>q.media = e.target.value;
    qDiv.appendChild(meta);
    attachUploadButton(mediaInput, 'image/*,audio/*', ()=>{ q.media = mediaInput.value; });

    if(q.type==='choix_unique' || q.type==='choix_multiple'){
      q.options = q.options || ['',''];
      q.correct = q.correct !== undefined ? q.correct : (q.type==='choix_multiple' ? [] : 0);
      const optWrap = el(`<div class="field"><label>Options (cochez la ou les bonnes réponses)</label><div class="opts"></div></div>`);
      const optsDiv = optWrap.querySelector('.opts');
      function renderOpts(){
        optsDiv.innerHTML='';
        q.options.forEach((opt,i)=>{
          const row = el(`<div class="row" style="align-items:center; margin-bottom:.3em;">
            <input type="${q.type==='choix_unique'?'radio':'checkbox'}" style="width:auto;" ${
              q.type==='choix_unique' ? (q.correct===i?'checked':'') : (q.correct.includes(i)?'checked':'')
            }>
            <input style="flex:1;" value="${escapeHtml(opt)}" placeholder="Option ${i+1}">
            <button class="link-btn" style="color:var(--bad);">✕</button>
          </div>`);
          const textInput = row.querySelectorAll('input')[1]; textInput.oninput = e=>q.options[i]=e.target.value;
          const radio = row.querySelectorAll('input')[0];
          radio.onchange = ()=>{
            if(q.type==='choix_unique'){ q.correct = i; }
            else{ if(radio.checked){ q.correct.push(i);} else { q.correct = q.correct.filter(x=>x!==i);} }
          };
          row.querySelector('.link-btn').onclick = ()=>{ q.options.splice(i,1); renderOpts(); };
          optsDiv.appendChild(row);
        });
      }
      renderOpts();
      const addOpt = el(`<button class="link-btn">+ Ajouter une option</button>`);
      addOpt.onclick = ()=>{ q.options.push(''); renderOpts(); };
      optWrap.appendChild(addOpt);
      qDiv.appendChild(optWrap);
    } else if(q.type==='vrai_faux'){
      q.correct = q.correct===undefined ? true : q.correct;
      const row = el(`<div class="field"><label>Réponse correcte</label>
        <select><option value="true">Vrai</option><option value="false">Faux</option></select></div>`);
      row.querySelector('select').value = String(q.correct);
      row.querySelector('select').onchange = e=>q.correct = e.target.value==='true';
      qDiv.appendChild(row);
    } else if(q.type==='texte_court'){
      q.correct = q.correct || '';
      const row = el(`<div class="field"><label>Réponse attendue (correction automatique, exacte)</label><input value="${escapeHtml(q.correct)}"></div>`);
      row.querySelector('input').oninput = e=>q.correct = e.target.value;
      qDiv.appendChild(row);
    } else if(q.type==='texte_trous'){
      q.correct = q.correct || '';
      const row = el(`<div class="field"><label>Texte avec blancs — utilisez ___ pour chaque blanc</label><textarea rows="2">${escapeHtml(q.textTemplate||'')}</textarea></div>`);
      row.querySelector('textarea').oninput = e=>q.textTemplate = e.target.value;
      qDiv.appendChild(row);
      const ans = el(`<div class="field"><label>Réponses attendues, séparées par des virgules</label><input value="${escapeHtml(q.correct)}"></div>`);
      ans.querySelector('input').oninput = e=>q.correct = e.target.value;
      qDiv.appendChild(ans);
    } else if(q.type==='association'){
      q.pairs = q.pairs && q.pairs.length ? q.pairs : [{left:'',right:''},{left:'',right:''}];
      const wrap2 = el(`<div class="field"><label>Paires à associer</label><div class="pairs"></div></div>`);
      const pairsDiv = wrap2.querySelector('.pairs');
      function renderPairs(){
        pairsDiv.innerHTML='';
        q.pairs.forEach((p,i)=>{
          const row = el(`<div class="row" style="margin-bottom:.3em;">
            <input style="flex:1;" placeholder="Élément gauche" value="${escapeHtml(p.left)}">
            <span class="muted" style="align-self:center;">→</span>
            <input style="flex:1;" placeholder="Élément droit" value="${escapeHtml(p.right)}">
            <button class="link-btn" style="color:var(--bad);">✕</button>
          </div>`);
          const inputs = row.querySelectorAll('input');
          inputs[0].oninput = e=>p.left = e.target.value;
          inputs[1].oninput = e=>p.right = e.target.value;
          row.querySelector('.link-btn').onclick = ()=>{ q.pairs.splice(i,1); renderPairs(); };
          pairsDiv.appendChild(row);
        });
      }
      renderPairs();
      const addPair = el(`<button class="link-btn">+ Ajouter une paire</button>`);
      addPair.onclick = ()=>{ q.pairs.push({left:'',right:''}); renderPairs(); };
      wrap2.appendChild(addPair);
      qDiv.appendChild(wrap2);
    } else if(q.type==='classement'){
      q.items = q.items && q.items.length ? q.items : ['',''];
      const wrap2 = el(`<div class="field"><label>Éléments, dans l'ordre correct attendu</label><div class="items"></div></div>`);
      const itemsDiv = wrap2.querySelector('.items');
      function renderItems(){
        itemsDiv.innerHTML='';
        q.items.forEach((it,i)=>{
          const row = el(`<div class="row" style="margin-bottom:.3em;">
            <span class="muted" style="align-self:center;">${i+1}.</span>
            <input style="flex:1;" value="${escapeHtml(it)}">
            <button class="link-btn" style="color:var(--bad);">✕</button>
          </div>`);
          row.querySelector('input').oninput = e=>q.items[i] = e.target.value;
          row.querySelector('.link-btn').onclick = ()=>{ q.items.splice(i,1); renderItems(); };
          itemsDiv.appendChild(row);
        });
      }
      renderItems();
      const addItem = el(`<button class="link-btn">+ Ajouter un élément</button>`);
      addItem.onclick = ()=>{ q.items.push(''); renderItems(); };
      wrap2.appendChild(addItem);
      qDiv.appendChild(wrap2);
    } else if(q.type==='image_choix'){
      q.options = q.options && q.options.length ? q.options : [{image:'',label:''},{image:'',label:''}];
      q.correct = q.correct || 0;
      const wrap2 = el(`<div class="field"><label>Images proposées (cochez la bonne réponse)</label><div class="imgOpts"></div></div>`);
      const optsDiv = wrap2.querySelector('.imgOpts');
      function renderImgOpts(){
        optsDiv.innerHTML='';
        q.options.forEach((opt,i)=>{
          const row = el(`<div class="row" style="align-items:center; margin-bottom:.3em;">
            <input type="radio" style="width:auto;" ${q.correct===i?'checked':''}>
            <input style="flex:1;" placeholder="URL de l'image" value="${escapeHtml(opt.image||'')}">
            <input style="flex:1;" placeholder="Légende (optionnel)" value="${escapeHtml(opt.label||'')}">
            <button class="link-btn" style="color:var(--bad);">✕</button>
          </div>`);
          const inputs = row.querySelectorAll('input');
          inputs[0].onchange = ()=>{ q.correct = i; };
          inputs[1].oninput = e=>opt.image = e.target.value;
          inputs[2].oninput = e=>opt.label = e.target.value;
          row.querySelector('.link-btn').onclick = ()=>{ q.options.splice(i,1); renderImgOpts(); };
          optsDiv.appendChild(row);
        });
      }
      renderImgOpts();
      const addOpt = el(`<button class="link-btn">+ Ajouter une image</button>`);
      addOpt.onclick = ()=>{ q.options.push({image:'',label:''}); renderImgOpts(); };
      wrap2.appendChild(addOpt);
      qDiv.appendChild(wrap2);
    } else if(q.type==='association_images'){
      q.pairs = q.pairs && q.pairs.length ? q.pairs : [{id:'pr_'+Math.random().toString(36).slice(2,9), left:{image:'',label:''}, right:{image:'',label:''}}, {id:'pr_'+Math.random().toString(36).slice(2,9), left:{image:'',label:''}, right:{image:'',label:''}}];
      const wrap2 = el(`<div class="field"><label>Paires image ↔ image ou mot</label><div class="imgPairs"></div></div>`);
      const pairsDiv = wrap2.querySelector('.imgPairs');
      function renderImgPairs(){
        pairsDiv.innerHTML='';
        q.pairs.forEach((p,i)=>{
          const row = el(`<div class="card" style="margin-bottom:.5em; padding:.7em;">
            <div class="row">
              <div style="flex:1;">
                <label class="muted" style="font-size:.75rem;">Gauche — image</label><input class="li" value="${escapeHtml(p.left.image||'')}" placeholder="URL image">
                <label class="muted" style="font-size:.75rem;">Légende</label><input class="ll" value="${escapeHtml(p.left.label||'')}" placeholder="Légende">
              </div>
              <span class="muted" style="align-self:center;">→</span>
              <div style="flex:1;">
                <label class="muted" style="font-size:.75rem;">Droite — image</label><input class="ri" value="${escapeHtml(p.right.image||'')}" placeholder="URL image">
                <label class="muted" style="font-size:.75rem;">Légende</label><input class="rl" value="${escapeHtml(p.right.label||'')}" placeholder="Légende">
              </div>
              <button class="link-btn" style="color:var(--bad); align-self:flex-start;">✕</button>
            </div>
          </div>`);
          row.querySelector('.li').oninput = e=>p.left.image = e.target.value;
          row.querySelector('.ll').oninput = e=>p.left.label = e.target.value;
          row.querySelector('.ri').oninput = e=>p.right.image = e.target.value;
          row.querySelector('.rl').oninput = e=>p.right.label = e.target.value;
          row.querySelector('.link-btn').onclick = ()=>{ q.pairs.splice(i,1); renderImgPairs(); };
          pairsDiv.appendChild(row);
        });
      }
      renderImgPairs();
      const addPair = el(`<button class="link-btn">+ Ajouter une paire</button>`);
      addPair.onclick = ()=>{ q.pairs.push({id:'pr_'+Math.random().toString(36).slice(2,9), left:{image:'',label:''}, right:{image:'',label:''}}); renderImgPairs(); };
      wrap2.appendChild(addPair);
      qDiv.appendChild(wrap2);
    } else if(q.type==='classification'){
      q.categories = q.categories && q.categories.length ? q.categories : ['',''];
      q.elements = q.elements && q.elements.length ? q.elements : [{texte:'',categorie:''},{texte:'',categorie:''}];
      const cbox = el(`<div class="field"><label>Catégories (séparées par une virgule)</label><input value="${escapeHtml(q.categories.join(', '))}" placeholder="ex : Un, Une, Des"></div>`);
      const ebox = el(`<div class="field"><label>Éléments à classer (choisissez la bonne catégorie de chacun)</label><div class="elems"></div></div>`);
      const elems = ebox.querySelector('.elems');
      function renderElems(){
        elems.innerHTML='';
        q.elements.forEach((e,i)=>{
          const row = el(`<div class="row" style="align-items:center; margin-bottom:.3em;"><input style="flex:2;" placeholder="Élément" value="${escapeHtml(e.texte||'')}">
            <select style="flex:1;"><option value="">Catégorie…</option>${q.categories.filter(c=>String(c||'').trim()).map(c=>`<option value="${escapeHtml(c)}" ${e.categorie===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
            <button class="link-btn" type="button" style="color:var(--bad);">✕</button></div>`);
          row.querySelector('input').oninput = ev=>e.texte = ev.target.value;
          row.querySelector('select').onchange = ev=>e.categorie = ev.target.value;
          row.querySelector('button').onclick = ()=>{ q.elements.splice(i,1); renderElems(); };
          elems.appendChild(row);
        });
      }
      cbox.querySelector('input').oninput = ev=>{ q.categories = ev.target.value.split(',').map(x=>x.trim()).filter(Boolean); };
      cbox.querySelector('input').onchange = ()=>renderElems();
      const addE = el(`<button class="link-btn" type="button">+ Ajouter un élément</button>`);
      addE.onclick = ()=>{ q.elements.push({texte:'',categorie:''}); renderElems(); };
      ebox.appendChild(addE);
      renderElems();
      qDiv.appendChild(cbox); qDiv.appendChild(ebox);
    } else if(q.type==='dessin'){
      const cf = el(`<div class="field"><label>Corrigé / éléments attendus (visible seulement par le professeur)</label><textarea rows="2">${escapeHtml(q.corrige||'')}</textarea></div>`);
      cf.querySelector('textarea').oninput = e=>q.corrige = e.target.value;
      qDiv.appendChild(cf);
      qDiv.appendChild(el(`<p class="muted" style="font-size:.82rem;">L'élève dessine ou colorie librement (correction manuelle). Le champ « Média » ci-dessus peut proposer une image de fond à colorier.</p>`));
    } else if(q.type==='texte_long' || q.type==='correction_manuelle'){
      const cf2 = el(`<div class="field"><label>Corrigé / éléments attendus (visible seulement par le professeur)</label><textarea rows="2">${escapeHtml(q.corrige||'')}</textarea></div>`);
      cf2.querySelector('textarea').oninput = e=>q.corrige = e.target.value;
      qDiv.appendChild(cf2);
      qDiv.appendChild(el(`<p class="muted" style="font-size:.82rem;">Cette question sera marquée « correction manuelle requise ».</p>`));
    } else if(q.type==='production_orale'){
      q.criteres = q.criteres || [];
      const box = el(`<div class="field"><label>Grille d'évaluation (facultatif) — le professeur donne une note par critère et la note de l'oral se calcule toute seule</label><div class="crit-list"></div><div class="crit-sum muted" style="font-size:.82rem; margin:.3em 0;"></div><button class="link-btn" type="button" data-add>+ Ajouter un critère</button></div>`);
      const list = box.querySelector('.crit-list'), sumBox = box.querySelector('.crit-sum');
      function refreshSum(){
        const sum = q.criteres.reduce((a,c)=>a+Number(c.points||0),0);
        if(!q.criteres.length){ sumBox.textContent = 'Sans grille, le professeur saisit une seule note sur ' + q.points + '.'; return; }
        const same = Math.abs(sum-Number(q.points))<0.001;
        sumBox.innerHTML = `Total de la grille : <strong>${sum}</strong> pts · points de la question : <strong>${q.points}</strong> ` +
          (same ? '<span style="color:var(--good);">✓</span>' : `<span style="color:#D97706;">— différent : la note sera ramenée proportionnellement sur ${q.points}.</span> <button type="button" class="link-btn" data-fix>Mettre ${sum} points sur la question</button>`);
        sumBox.querySelector('[data-fix]')?.addEventListener('click', ()=>{ q.points = sum; rerenderSection(sec); });
      }
      qDiv._refreshSum = refreshSum;
      function renderCrit(){
        list.innerHTML = '';
        q.criteres.forEach((c,i)=>{
          const row = el(`<div class="row" style="align-items:center; margin-bottom:.3em;"><input style="flex:2;" placeholder="Critère (ex : Prononciation)" value="${escapeHtml(c.titre||'')}"><input type="number" min="0" style="width:90px;" value="${c.points||0}"><button class="link-btn" type="button" style="color:var(--bad);">✕</button></div>`);
          const ins = row.querySelectorAll('input');
          ins[0].oninput = e=>c.titre = e.target.value;
          ins[1].oninput = e=>{ c.points = Number(e.target.value); refreshSum(); };
          row.querySelector('button').onclick = ()=>{ q.criteres.splice(i,1); renderCrit(); };
          list.appendChild(row);
        });
        refreshSum();
      }
      box.querySelector('[data-add]').onclick = ()=>{ q.criteres.push({id:rndId('crit_'), titre:'', points:5}); renderCrit(); };
      if(!q.criteres.length){
        const tpl = el(`<button class="link-btn" type="button" style="margin-left:1em;">Utiliser une grille type (contenu, prononciation, vocabulaire, fluidité, intonation)</button>`);
        tpl.onclick = ()=>{ q.criteres = defaultRubric(Number(q.points)||25); rerenderSection(sec); };
        box.appendChild(tpl);
      }
      renderCrit();
      qDiv.appendChild(box);
    }
  }

  function rerenderSection(sec){
    const secDiv = sectionsDiv.querySelector(`[data-sec="${sec.id}"]`);
    if(secDiv) buildSectionDOM(sec, secDiv);
    refreshTotal();
  }

  function buildSectionDOM(sec, secDiv){
    secDiv.innerHTML = '';
    const head = el(`<div class="row" style="justify-content:space-between; align-items:center;">
      <input style="max-width:320px; font-weight:600;" value="${escapeHtml(sec.titre)}" placeholder="Nom de la section">
      <div class="row" style="align-items:center;">
        <span class="muted" style="font-size:.85rem;" data-sec-pts>${sectionPoints(sec)} pts</span>
        <button class="link-btn" style="color:var(--bad);">Supprimer la section</button>
      </div>
    </div>`);
    head.querySelector('input').oninput = e=>sec.titre = e.target.value;
    head.querySelector('.link-btn').onclick = ()=>{
      draft.sections = draft.sections.filter(s=>s!==sec); sectionsDiv.removeChild(secDiv); refreshTotal();
    };
    secDiv.appendChild(head);

    const consRow = el(`<div class="row" style="align-items:flex-start; gap:.6em; margin:.4em 0;">
      <div style="flex:1; min-width:240px;"><label class="muted" style="font-size:.82rem;">Consigne de la partie (facultatif — affichée aux élèves au début de la partie)</label>
        <textarea rows="2" placeholder="ex : Le professeur joue l'enregistrement. Écoute, puis réponds.">${escapeHtml(sec.consigne||'')}</textarea></div>
      <div style="width:130px;"><label class="muted" style="font-size:.82rem;">Points visés</label>
        <input type="number" min="0" value="${sec.cible||''}" placeholder="ex : 25"></div>
    </div>`);
    consRow.querySelector('textarea').oninput = e=>sec.consigne = e.target.value;
    consRow.querySelector('input').oninput = e=>{ sec.cible = e.target.value==='' ? undefined : Number(e.target.value); refreshTotal(); };
    secDiv.appendChild(consRow);

    const audioRow = el(`<div class="row" style="align-items:center; margin:.4em 0; gap:.6em;">
      <span class="muted" style="font-size:.82rem;">🔊 Audio de la section (optionnel, joué à la présentation) :</span>
      <input class="secAudioUrl" style="flex:1; min-width:160px;" value="${escapeHtml(sec.audio||'')}" placeholder="https://...">
    </div>`);
    const secAudioInput = audioRow.querySelector('.secAudioUrl');
    secAudioInput.oninput = e=>sec.audio = e.target.value;
    secDiv.appendChild(audioRow);
    attachUploadButton(secAudioInput, 'audio/*', ()=>{ sec.audio = secAudioInput.value; });

    const qList = el(`<div></div>`);
    sec.questions.forEach(q=>{
      const qDiv = el(`<div class="question-block"></div>`);
      renderQuestion(sec, q, qDiv);
      qList.appendChild(qDiv);
    });
    secDiv.appendChild(qList);

    const addRow = el(`<div class="row" style="margin-top:.6em; flex-wrap:wrap;">
      <select style="max-width:260px;">
        <option value="choix_unique">Choix unique</option>
        <option value="choix_multiple">Cases à cocher</option>
        <option value="vrai_faux">Vrai / Faux</option>
        <option value="texte_court">Texte court (auto)</option>
        <option value="texte_trous">Texte à trous (auto)</option>
        <option value="image_choix">Sélection d'image (auto)</option>
        <option value="association_images">Association d'images (auto)</option>
        <option value="dessin">Dessin / coloriage libre (manuel)</option>
        <option value="association">Association (glisser-déposer)</option>
        <option value="classement">Classement (glisser-déposer)</option>
        <option value="classification">Classement par catégories (auto)</option>
        <option value="texte_long">Texte long (manuel)</option>
        <option value="correction_manuelle">Question ouverte (manuel)</option>
        <option value="production_orale">Production orale (note manuelle)</option>
      </select>
      <button class="btn btn-ghost btn-sm">+ Ajouter une question</button>
    </div>`);
    addRow.querySelector('button').onclick = ()=>{
      const type = addRow.querySelector('select').value;
      const q = { id:'q_'+Math.random().toString(36).slice(2,9), type, enonce:'', points:1, media:'' };
      sec.questions.push(q);
      const qDiv = el(`<div class="question-block"></div>`);
      renderQuestion(sec, q, qDiv);
      qList.appendChild(qDiv);
      refreshTotal();
    };
    secDiv.appendChild(addRow);
  }

  wrap.querySelector('#addSection').onclick = ()=>{
    const sec = { id:'sec_'+Math.random().toString(36).slice(2,9), titre:`Section ${draft.sections.length+1}`, questions:[] };
    draft.sections.push(sec);
    const secDiv = el(`<div class="section-block" data-sec="${sec.id}"></div>`);
    buildSectionDOM(sec, secDiv);
    sectionsDiv.appendChild(secDiv);
    refreshTotal();
  };

  draft.sections.forEach(sec=>{
    const secDiv = el(`<div class="section-block" data-sec="${sec.id}"></div>`);
    buildSectionDOM(sec, secDiv);
    sectionsDiv.appendChild(secDiv);
  });
  refreshTotal();

  wrap.querySelector('#titre').oninput = e=>draft.titre = e.target.value;
  wrap.querySelector('#navMode').onchange = e=>draft.navMode = e.target.value;
  wrap.querySelector('#duree').oninput = e=>draft.duree = Number(e.target.value);
  wrap.querySelector('#reprise').onchange = e=>draft.autoriserReprise = e.target.value==='true';
  wrap.querySelector('#verifiedBox')?.addEventListener('change', e=>{ draft.verified = e.target.checked; });

  async function commit(statut){
    if(!draft.titre.trim()){ alert('Merci de donner un titre à l\'examen.'); return; }
    if(draft.sections.length===0){ alert('Ajoutez au moins une section.'); return; }
    if(statut==='publié' && draft.imported && !draft.verified){
      alert("Cet examen importé doit d'abord être vérifié avant publication.");
      return;
    }
    if(statut==='publié'){
      const errs = examIssues(draft).filter(i=>i.lvl==='error');
      if(errs.length){ openExamCheck(draft, jumpTo); alert(`Impossible de publier : ${errs.length} point(s) à corriger. La liste vient de s'ouvrir.`); return; }
    }
    draft.statut = statut;
    try{
      if(editingId){
        await api(`/api/exams/${editingId}`, {method:'PUT', body:draft});
      } else {
        await api('/api/exams', {method:'POST', body:draft});
      }
      alert(statut==='publié' ? 'Examen publié avec succès.' : 'Brouillon enregistré.');
      ROUTE.tab = 'exams'; render();
    }catch(e){ alert(e.message); }
  }
  wrap.querySelector('#saveDraft').onclick = ()=>commit('brouillon');
  wrap.querySelector('#publish').onclick = ()=>commit('publié');
  wrap.querySelector('#checkExam').onclick = ()=>openExamCheck(draft, jumpTo);

  return wrap;
}

/** Read-only preview of an exam's full content (with correct answers marked) for
    teachers/admin to review before running it. Never editable from here. */
function openExamPreview(exam){
  const overlay = el(`<div style="position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:3vh 1em; overflow:auto;">
    <div class="card" style="max-width:720px; width:100%; background:var(--paper-raised);">
      <div class="row" style="justify-content:space-between; align-items:flex-start;">
        <div>
          <h3 style="margin:0;">${escapeHtml(exam.titre)}</h3>
          <p class="muted" style="font-size:.85rem;">${exam.niveau} · ${escapeHtml(exam.matiere||'Français')} · ${examTotalPoints(exam)} points · aperçu — lecture seule</p>
        </div>
        <button class="link-btn" id="closePrev">Fermer ✕</button>
      </div>
      ${examLogoUrl(exam) ? `<img src="${examLogoUrl(exam)}" alt="Logo de l'examen" style="height:56px; max-width:200px; object-fit:contain; margin:.3em 0;">` : ''}
      <div class="row" style="margin:.6em 0; align-items:center; gap:.4em;">
        <button class="btn btn-sm btn-primary" id="tabStudent" type="button">👦 Vue élève (page par page)</button>
        <button class="btn btn-sm btn-ghost" id="tabTeacher" type="button">👩‍🏫 Vue professeur (avec les réponses)</button>
        <button class="btn btn-ghost btn-sm" id="prevWord" type="button" style="margin-left:auto;">Word (feuille élève)</button>
        <button class="btn btn-ghost btn-sm" id="prevWordProf" type="button">Word (avec réponses)</button>
      </div>
      <div id="prevBody"></div>
    </div>
  </div>`);
  document.body.appendChild(overlay);
  overlay.querySelector('#closePrev').onclick = ()=> overlay.remove();
  overlay.querySelector('#prevWord').onclick = async ()=>{
    downloadExamWord(exam, false);
  };
  overlay.querySelector('#prevWordProf').onclick = ()=> downloadExamWord(exam, true);
  const body = overlay.querySelector('#prevBody');
  const tS = overlay.querySelector('#tabStudent'), tT = overlay.querySelector('#tabTeacher');
  function setTab(mode){
    tS.className = 'btn btn-sm ' + (mode==='student' ? 'btn-primary' : 'btn-ghost');
    tT.className = 'btn btn-sm ' + (mode==='teacher' ? 'btn-primary' : 'btn-ghost');
    body.innerHTML = '';
    if(mode==='student') drawStudentPreview(body, exam); else drawTeacherPreview();
  }
  tS.onclick = ()=>setTab('student'); tT.onclick = ()=>setTab('teacher');
  function drawTeacherPreview(){
  exam.sections.forEach(sec=>{
    body.appendChild(el(`<h4 style="margin-top:1.2em;">${escapeHtml(sec.titre)} <span class="muted" style="font-weight:400; font-size:.85rem;">(${sectionPoints(sec)}${sec.cible?' / '+sec.cible:''} pts)</span></h4>`));
    if(sec.consigne) body.appendChild(el(`<p class="muted" style="font-size:.88rem; margin:.2em 0 .5em;"><em>${escapeHtml(sec.consigne)}</em></p>`));
    sec.questions.forEach(q=>{
      const block = el(`<div class="question-block"></div>`);
      if(q.passage) block.appendChild(el(`<div class="passage-box">${escapeHtml(q.passage)}</div>`));
      block.appendChild(el(`<p><span class="qtype-badge">${qLabel(q.type)}</span></p>`));
      block.appendChild(el(`<p><strong>${escapeHtml(q.enonce||'')}</strong></p>`));
      if(q.media){
        if(/\.(mp3|wav|m4a|ogg)(\?.*)?$/i.test(q.media)) block.appendChild(el(`<audio controls src="${q.media}" style="width:100%; margin:.4em 0;"></audio>`));
        else block.appendChild(el(`<img src="${q.media}" style="max-width:100%; border-radius:8px; margin:.4em 0;">`));
      }
      if(['choix_unique','choix_multiple'].includes(q.type)){
        const ul = el(`<ul></ul>`);
        (q.options||[]).forEach((o,i)=>{
          const isCorrect = q.type==='choix_unique' ? q.correct===i : (q.correct||[]).includes(i);
          ul.appendChild(el(`<li style="${isCorrect?'color:var(--good); font-weight:600;':''}">${escapeHtml(o)}${isCorrect?' ✓':''}</li>`));
        });
        block.appendChild(ul);
      } else if(q.type==='vrai_faux'){
        block.appendChild(el(`<p class="muted">Bonne réponse : <strong style="color:var(--good);">${q.correct?'Vrai':'Faux'}</strong></p>`));
      } else if(q.type==='texte_court' || q.type==='texte_trous'){
        block.appendChild(el(`<p class="muted">Réponse attendue : <strong style="color:var(--good);">${escapeHtml(q.correct||'—')}</strong></p>`));
      } else if(q.type==='image_choix'){
        const grid = el(`<div class="image-grid"></div>`);
        (q.options||[]).forEach((o,i)=> grid.appendChild(el(`<div class="image-tile ${q.correct===i?'matched':''}">${o.image?`<img src="${o.image}">`:''}${o.label?`<div class="cap">${escapeHtml(o.label)}</div>`:''}</div>`)));
        block.appendChild(grid);
      } else if(q.type==='association'){
        block.appendChild(el(`<p class="muted">${(q.pairs||[]).map(p=>`${escapeHtml(p.left)} → ${escapeHtml(p.right)}`).join(' ; ')}</p>`));
      } else if(q.type==='classement'){
        block.appendChild(el(`<p class="muted">${(q.items||[]).map(escapeHtml).join(' → ')}</p>`));
      } else if(q.type==='classification'){
        block.appendChild(el(`<p class="muted">Catégories : ${(q.categories||[]).map(escapeHtml).join(' · ')}</p>`));
        block.appendChild(el(`<ul>${(q.elements||[]).map(e=>`<li>${escapeHtml(e.texte)} → <strong style="color:var(--good);">${escapeHtml(e.categorie||'?')}</strong></li>`).join('')}</ul>`));
      } else if(q.type==='production_orale'){
        block.appendChild(el(`<p class="muted">Note saisie par le professeur après l'oral (/${q.points}).</p>`));
        if((q.criteres||[]).length) block.appendChild(el(`<div class="overflow-x"><table><thead><tr><th>Critère</th><th>Points</th></tr></thead><tbody>${q.criteres.map(c=>`<tr><td>${escapeHtml(c.titre)}</td><td>/ ${c.points}</td></tr>`).join('')}</tbody></table></div>`));
      } else {
        block.appendChild(el(`<p class="muted">Correction manuelle.${q.corrige ? ' Corrigé : <strong>'+escapeHtml(q.corrige)+'</strong>' : ''}</p>`));
      }
      body.appendChild(block);
    });
  });
  }
  setTab('student');
}

/** Aperçu « comme l'élève » : on feuillette les questions une à une, sans réponses, exactement comme à l'examen. */
function drawStudentPreview(host, exam){
  const flat = exam.sections.flatMap(sc=>sc.questions.map(q=>({...q, sectionId:sc.id})));
  if(!flat.length){ host.appendChild(el('<p class="muted">Cet examen ne contient encore aucune question.</p>')); return; }
  const PR = {exam, flatQuestions: flat, qIndex: 0, reponses: {}};
  const shell = el(`<div class="exam-shell" style="min-height:0; border:1px solid var(--line); border-radius:12px; overflow:hidden;" translate="no">
    <div class="exam-header"><div>${examLogoUrl(exam) ? `<img class="exam-logo" src="${examLogoUrl(exam)}" alt="">` : ''}<strong>${escapeHtml(exam.titre)}</strong></div><div class="timer">${exam.duree ? exam.duree+' min' : 'Sans limite'}</div></div>
    <div class="exam-body" style="padding:1em 1.2em;">
      <p class="muted" style="font-size:.82rem; margin:0 0 .5em;">Essayez chaque partie comme un élève (relier, classer, écrire, choisir…). Rien n'est enregistré ni corrigé.</p>
      <div class="row" style="align-items:center; gap:.6em;"><select id="secJump" style="max-width:260px;"></select><span class="muted" id="pos" style="font-size:.82rem;"></span></div>
      <div class="progress-track" style="margin-top:.5em;"><div class="progress-fill" id="pf"></div></div>
      <div id="qHost"></div>
      <div class="row" style="justify-content:space-between; margin-top:1.2em;"><button class="btn btn-ghost" id="pPrev" type="button">&larr; Précédent</button><button class="btn btn-primary" id="pNext" type="button" style="background:var(--student);">Suivant &rarr;</button></div>
    </div></div>`);
  host.appendChild(shell);
  const sel = shell.querySelector('#secJump');
  exam.sections.forEach(sc=>{ const i = flat.findIndex(q=>q.sectionId===sc.id); if(i>=0) sel.appendChild(el(`<option value="${i}">${escapeHtml(sc.titre)}</option>`)); });
  function show(){
    renderQuestionRunner(flat[PR.qIndex], shell.querySelector('#qHost'), PR);
    shell.querySelector('#pos').textContent = `Question ${PR.qIndex+1} / ${flat.length}`;
    shell.querySelector('#pf').style.width = Math.round(100*(PR.qIndex+1)/flat.length)+'%';
    shell.querySelector('#pPrev').disabled = PR.qIndex===0; shell.querySelector('#pNext').disabled = PR.qIndex===flat.length-1;
    const sid = flat[PR.qIndex].sectionId; const opt = [...sel.options].find(o=>flat[Number(o.value)].sectionId===sid); if(opt) sel.value = opt.value;
  }
  shell.querySelector('#pPrev').onclick = ()=>{ PR.qIndex--; show(); };
  shell.querySelector('#pNext').onclick = ()=>{ PR.qIndex++; show(); };
  sel.onchange = ()=>{ PR.qIndex = Number(sel.value); show(); };
  show();
}

/** Liste de cases à cocher : un ou plusieurs professeurs (et éventuellement « moi-même »). */
function teacherChecks(teachers, withMe){
  const box = el(`<div class="field"><label>Assigner à (un ou plusieurs professeurs)</label><div class="tchecks" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:.35em;"></div></div>`);
  const g = box.querySelector('.tchecks');
  const add = (id, name, sub)=>g.appendChild(el(`<label style="display:flex; gap:.5em; align-items:center; margin:0; padding:.35em .5em; border:1px solid var(--line); border-radius:8px;"><input type="checkbox" value="${id}" style="width:auto;"><span>${escapeHtml(name)}${sub?`<br><span class="muted" style="font-size:.74rem;">${escapeHtml(sub)}</span>`:''}</span></label>`));
  if(withMe) add(SESSION.user.id, 'Moi-même', "j'applique l'examen et je reçois les résultats");
  teachers.forEach(t=>add(t.id, t.name));
  box.checked = ()=>[...g.querySelectorAll('input:checked')].map(i=>i.value);
  return box;
}
async function assignToMany(path, base, ids){
  // Un professeur qui a deux groupes : assignez à nouveau avec l'autre groupe.
  for(const teacherId of ids) await api(path, {method:'POST', body:{...base, teacherId}});
}

async function assignExamForm(){
  const wrap = el(`<div></div>`);
  const [exams, teachersRaw, assignments] = await Promise.all([
    api('/api/exams'), api('/api/teachers'), api('/api/assignments'),
  ]);
  const teachers = teachersRaw.filter(t=>t.status==='active');
  if(exams.length===0){
    wrap.appendChild(el(`<p class="muted">Créez d'abord un examen.</p>`));
    return wrap;
  }
  const form = el(`<div class="card">
    <div class="field"><label>Examen</label><select id="exam">${exams.map(e=>`<option value="${e.id}" data-niveau="${escapeHtml(e.niveau)}">${escapeHtml(e.titre)} (${e.niveau} · ${e.matiere||'Français'})</option>`).join('')}</select></div>
    <div id="tchk"></div>
    <div id="dynFields"></div>
    <button class="btn btn-primary" id="assign">Assigner</button>
  </div>`);
  wrap.appendChild(form);
  const tchk = teacherChecks(teachers, true); form.querySelector('#tchk').appendChild(tchk);
  form.querySelector('#tchk').parentNode.insertBefore(el(`<p class="muted" style="font-size:.8rem; margin:-.2em 0 .8em;">Un professeur qui a deux groupes : assignez une première fois avec le premier groupe, puis une seconde fois avec l'autre.</p>`), form.querySelector('#dynFields'));
  const dyn = form.querySelector('#dynFields');
  function drawDynFields(){
    const opt = form.querySelector('#exam').selectedOptions[0];
    const niveau = opt ? opt.dataset.niveau : '';
    dyn.innerHTML = '';
    if(!['Préscolaire','Primaire'].includes(niveau) && niveau){
      dyn.appendChild(el(`<div class="field"><label>Niveau</label><input id="classe" placeholder="ex : 3e secondaire"></div>`));
    } else {
      dyn.appendChild(el(`<div class="row">
        <div class="field" style="flex:1;"><label>Classe</label><input id="classe" placeholder="ex : 6e"></div>
        <div class="field" style="flex:1;"><label>Groupe</label><input id="groupe" placeholder="ex : Groupe B"></div>
      </div>`));
    }
  }
  form.querySelector('#exam').onchange = drawDynFields;
  drawDynFields();
  form.querySelector('#assign').onclick = async ()=>{
    try{
      const ids = tchk.checked(); if(!ids.length){ alert('Cochez au moins un professeur.'); return; }
      await assignToMany('/api/assignments', {
        examId: form.querySelector('#exam').value,
        classe: form.querySelector('#classe').value.trim(),
        groupe: form.querySelector('#groupe') ? form.querySelector('#groupe').value.trim() : '',
      }, ids);
      render();
    }catch(e){ alert(e.message); }
  };

async function assignView(){

  seg.querySelectorAll('button').forEach(b=>b.onclick = ()=>{ assignKind = b.dataset.k; render(); });
  wrap.appendChild(seg);
  const host = el(`<div></div>`); wrap.appendChild(host);
  const teachersRaw = await api('/api/teachers').catch(()=>[]);
  const teachers = teachersRaw.filter(t=>t.status==='active');

  if(assignKind==='examen'){
    host.appendChild(await assignExamForm());

      const ptc = teacherChecks(teachers, true); form.querySelector('#ptchk').appendChild(ptc);
      const dyn = form.querySelector('#pdyn');
      const drawDyn = ()=>{
        const niv = form.querySelector('#pj').selectedOptions[0].dataset.niveau; dyn.innerHTML = '';
        dyn.appendChild(niv==='Secondaire' ? el(`<div class="field"><label>Niveau</label><input id="pc" placeholder="ex : 3e secondaire"></div>`)

      };
      form.querySelector('#pj').onchange = drawDyn; drawDyn();
      form.querySelector('#pgo').onclick = async ()=>{
        const ids = ptc.checked(); if(!ids.length){ alert('Cochez au moins un professeur.'); return; }
        try{ await assignToMany('/api/project-assignments', {projectId:form.querySelector('#pj').value, classe:form.querySelector('#pc').value.trim(), groupe:form.querySelector('#pg')?form.querySelector('#pg').value.trim():''}, ids); render(); }catch(e){ alert(e.message); }
      };
      host.appendChild(form);
    }
  } else {
    const docs = (await api(`/api/peda/documents?type=${assignKind}`));
    if(!docs.length) host.appendChild(el(`<p class="muted">Aucun document de ce type pour le moment. Créez-en un dans « Documents pédagogiques ».</p>`));
    else {
      const form = el(`<div class="card">
        <div class="field"><label>${assignKind==='guide'?'Guide de révision':'Apprentissages attendus'}</label><select id="dd">${docs.map(d=>`<option value="${d.id}">${escapeHtml(pedaDocTitle(d))}${(d.assignees||[]).length?' (déjà assigné à '+d.assignees.length+')':''}</option>`).join('')}</select></div>

      form.querySelector('#dgo').onclick = ()=>assignDocModal(docs.find(d=>d.id===form.querySelector('#dd').value), render);
      host.appendChild(form);
    }
  }
  wrap.appendChild(await assignmentsOverview(teachers));
  return wrap;
}

/** Shows (or updates/removes) a prominent fixed banner listing every student
    currently away from the exam page, so the teacher notices immediately —
    even while a projection is on screen. One banner per polling context,
    tracked via a data attribute so repeated calls update it in place. */
let presenceBeepInterval = null;
function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.type = 'square'; osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
    osc.onended = ()=> ctx.close();
  }catch(e){}
}
function updatePresenceAlert(students){
  const away = (students||[]).filter(s=>s.away && !s.finished);
  let banner = document.querySelector('.presence-alert');
  if(away.length===0){
    banner?.remove();
    if(presenceBeepInterval){ clearInterval(presenceBeepInterval); presenceBeepInterval = null; }
    return;
  }
  const names = away.map(s=>s.nom).join(', ');
  const html = `⚠ ${away.length>1?'Des élèves ont':'Un élève a'} quitté la page d'examen<div class="names">${escapeHtml(names)}</div>`;
  if(!banner){
    banner = el(`<div class="presence-alert blink"></div>`); document.body.appendChild(banner);
    playBeep();
    presenceBeepInterval = setInterval(playBeep, 3500);
  }
  banner.innerHTML = html;
}

function showSessionPanel(session, panel){
  panel.innerHTML = '';
  const link = `${location.origin}${location.pathname}?session=${session.token}`;
  const box = el(`<div class="card" style="margin-top:1em;">
    <h3>Session — code ${session.token}</h3>

      const exam = await api(`/api/exams/${session.examId}`);
      drawProjectionView(panel, session, exam);
    }catch(e){ alert(e.message); }
  };
  try{ new QRCode(box.querySelector('#qrcode'), {text: link, width:128, height:128}); }catch(e){ box.querySelector('#qrcode').textContent = '(QR indisponible)'; }
  box.querySelector('#dlQr').onclick = ()=>{
    const qrDiv = box.querySelector('#qrcode');
    const canvas = qrDiv.querySelector('canvas'); const img = qrDiv.querySelector('img');
    const dataUrl = canvas ? canvas.toDataURL('image/png') : (img ? img.src : null);
    if(!dataUrl){ alert('QR code indisponible pour le téléchargement.'); return; }
    const a = document.createElement('a'); a.href = dataUrl; a.download = `session-${session.token}.png`; a.click();
  };
  box.querySelector('#copyLink').onclick = ()=>{ navigator.clipboard?.writeText(link); alert('Lien copié.'); };

  const statusControls = box.querySelector('#statusControls');
  async function setStatus(statut){
    try{
      await api(`/api/sessions/${session.id}/status`, {method:'PATCH', body:{statut}});
      session.statut = statut;
      box.querySelector('#statLabel').textContent = statut;
      drawStatusControls();
    }catch(e){ alert(e.message); }
  }
  function drawStatusControls(){
    statusControls.innerHTML = '';
    if(session.statut==='préparé'){
      const b = el(`<button class="btn btn-primary btn-sm">▶ Démarrer la session</button>`);
      b.onclick = ()=>setStatus('en_cours'); statusControls.appendChild(b);
    } else if(session.statut==='en_cours'){
      const p = el(`<button class="btn btn-ghost btn-sm">⏸ Mettre en pause</button>`);
      p.onclick = ()=>setStatus('en_pause'); statusControls.appendChild(p);
      const f = el(`<button class="btn btn-danger btn-sm">⏹ Fermer la session</button>`);
      f.onclick = ()=>{ if(confirm('Fermer la session ? Les élèves ne pourront plus la rejoindre.')) setStatus('terminé'); };
      statusControls.appendChild(f);
    } else if(session.statut==='en_pause'){
      const r = el(`<button class="btn btn-primary btn-sm">▶ Reprendre la session</button>`);
      r.onclick = ()=>setStatus('en_cours'); statusControls.appendChild(r);
      const f = el(`<button class="btn btn-danger btn-sm">⏹ Fermer la session</button>`);
      f.onclick = ()=>{ if(confirm('Fermer la session ? Les élèves ne pourront plus la rejoindre.')) setStatus('terminé'); };
      statusControls.appendChild(f);
    } else if(session.statut==='terminé'){
      const b = el(`<button class="btn btn-ghost btn-sm">↻ Redémarrer la session</button>`);
      b.onclick = ()=>setStatus('en_cours'); statusControls.appendChild(b);
    }
  }
  drawStatusControls();
  async function refreshCounts(){
    try{
      const live = await api(`/api/sessions/${session.id}/live`);
      const roster = box.querySelector('#roster');
      if(!live.students || live.students.length===0){ roster.innerHTML = '<p class="muted">Aucun élève connecté pour le moment.</p>'; return; }
      roster.innerHTML = `<h4 style="margin-bottom:.4em;">Élèves connectés (${live.students.length})</h4>`;
      live.students.forEach(s=>{
        const color = s.finished ? '#D97706' : (s.away ? 'var(--bad)' : 'var(--good)');
        const label = s.finished ? 'Terminé' : (s.away ? 'A quitté la page' : 'Actif');
        roster.appendChild(el(`<div class="row" style="align-items:center; gap:.5em; margin-bottom:.3em;">
          <span class="icon-dot" style="background:${color};"></span>
          <span>${escapeHtml(s.nom)}</span>
          <span class="tag" style="background:${color}22; color:${color}; font-size:.75rem;">${label}</span>
        </div>`));
      });
      updatePresenceAlert(live.students);
    }catch(e){}
  }
  refreshCounts();
  const iv = setInterval(refreshCounts, 4000);
  // Stop polling if the panel is removed from the page (route change).
  const observer = new MutationObserver(()=>{ if(!document.body.contains(box)){ clearInterval(iv); observer.disconnect(); document.querySelector('.presence-alert')?.remove(); } });
  observer.observe(document.body, {childList:true, subtree:true});
}

/** Answer-free version of the exam for the teacher to display on the classroom
    board/projector, with the QR code and link kept visible on the side, so the
    teacher can walk through the exam step by step with the class. */
function drawProjectionView(panel, session, exam){
  panel.innerHTML = '';
  const link = `${location.origin}${location.pathname}?session=${session.token}`;
  const flat = exam.sections.flatMap(sec=>sec.questions.map(q=>({...q, sectionTitre:sec.titre, sectionId:sec.id, sectionAudio:sec.audio, sectionConsigne:sec.consigne})));
  let qIndex = 0;

  const wrap = el(`<div class="row" style="align-items:flex-start; gap:1.5em; flex-wrap:nowrap;">
    <div style="flex:none; width:190px; text-align:center;">
      <div id="qrcode3"></div>
      <p class="muted" style="font-size:.85rem; margin-top:.4em;">Code : <strong>${session.token}</strong></p>
      <p class="muted" style="font-size:.75rem; word-break:break-all;">${link}</p>
      <button class="btn btn-ghost btn-sm" id="exitProj" style="margin-top:.6em;">&larr; Quitter la projection</button>
      <div id="rosterProj" style="margin-top:1em; text-align:left; font-size:.8rem;"></div>
    </div>
    <div style="flex:1; min-width:0;">
      <div class="card" id="projCard" style="min-height:280px;"></div>
      <div class="row" style="justify-content:space-between; margin-top:1em; align-items:center;">
        <button class="btn btn-ghost" id="pPrev">&larr; Précédent</button>
        <span class="muted" id="pCounter" style="font-size:.9rem;"></span>
        <button class="btn btn-ghost" id="pNext">Suivant &rarr;</button>
      </div>
    </div>
  </div>`);
  panel.appendChild(wrap);
  try{ new QRCode(wrap.querySelector('#qrcode3'), {text: link, width:110, height:110}); }catch(e){}
  wrap.querySelector('#exitProj').onclick = ()=>{ clearInterval(rosterIv); showSessionPanel(session, panel); };

  const rosterProj = wrap.querySelector('#rosterProj');
  async function refreshRosterProj(){
    try{
      const live = await api(`/api/sessions/${session.id}/live`);
      if(!live.students || live.students.length===0){ rosterProj.innerHTML = '<p class="muted">Aucun élève connecté.</p>'; updatePresenceAlert([]); return; }
      rosterProj.innerHTML = `<strong>Élèves connectés (${live.students.length})</strong>`;
      live.students.forEach(s=>{
        const color = s.finished ? '#D97706' : (s.away ? 'var(--bad)' : 'var(--good)');
        rosterProj.appendChild(el(`<div class="row" style="align-items:center; gap:.4em; margin-top:.3em;">
          <span class="icon-dot" style="background:${color};"></span><span>${escapeHtml(s.nom)}</span>
        </div>`));
      });
      updatePresenceAlert(live.students);
    }catch(e){}
  }
  refreshRosterProj();
  const rosterIv = setInterval(refreshRosterProj, 4000);

  const projCard = wrap.querySelector('#projCard');
  function draw(){
    const q = flat[qIndex];
    wrap.querySelector('#pCounter').textContent = `${qIndex+1} / ${flat.length}`;
    wrap.querySelector('#pPrev').disabled = qIndex===0;
    wrap.querySelector('#pNext').disabled = qIndex===flat.length-1;
    projCard.innerHTML = '';
    projCard.appendChild(el(`<p class="muted" style="font-size:.8rem; margin:0 0 .6em;">${escapeHtml(q.sectionTitre)} · ${qLabel(q.type)} · ${q.points} pt${q.points>1?'s':''}</p>`));
    const isFirstOfSectionProj = flat.findIndex(x=>x.sectionId===q.sectionId) === qIndex;
    if((q.sectionAudio || q.sectionConsigne) && isFirstOfSectionProj){
      const secBox = el(`<div class="passage-box">
        ${q.sectionConsigne ? `<p style="margin:0 0 .4em;">${escapeHtml(q.sectionConsigne).replace(/\n/g,'<br>')}</p>` : ''}
        ${q.sectionAudio ? `<audio src="${q.sectionAudio}" style="display:none;"></audio><button type="button" class="big-audio-btn">🔊 Écouter l'audio de la section</button>` : ''}</div>`);
      const pb = secBox.querySelector('button');
      if(pb) pb.onclick = ()=>{ const a=secBox.querySelector('audio'); a.currentTime=0; a.play(); };
      projCard.appendChild(secBox);
    }
    if(q.passage){ projCard.appendChild(el(`<div class="passage-box">${escapeHtml(q.passage)}</div>`)); }
    projCard.appendChild(el(`<h2 style="font-size:1.4rem;">${escapeHtml(q.enonce||'')}</h2>`));
    if(q.media){
      if(/\.(mp3|wav|m4a|ogg)(\?.*)?$/i.test(q.media)) projCard.appendChild(el(`<audio controls src="${q.media}" style="width:100%; margin:.6em 0;"></audio>`));
      else projCard.appendChild(el(`<img src="${q.media}" style="max-width:100%; border-radius:8px; margin:.6em 0;">`));
    }
    if(q.type==='choix_unique' || q.type==='choix_multiple'){
      (q.options||[]).forEach(o=> projCard.appendChild(el(`<div class="option-btn" style="cursor:default;">${escapeHtml(o)}</div>`)));
    } else if(q.type==='vrai_faux'){
      ['Vrai','Faux'].forEach(o=> projCard.appendChild(el(`<div class="option-btn" style="cursor:default;">${o}</div>`)));
    } else if(q.type==='image_choix'){
      const grid = el(`<div class="image-grid"></div>`);
      (q.options||[]).forEach(o=> grid.appendChild(el(`<div class="image-tile">${o.image?`<img src="${o.image}">`:''}${o.label?`<div class="cap">${escapeHtml(o.label)}</div>`:''}</div>`)));
      projCard.appendChild(grid);
    } else if(q.type==='classification'){
      projCard.appendChild(el(`<p class="muted">Catégories : ${(q.categories||[]).map(escapeHtml).join(' · ')}</p>`));
      const ul2 = el(`<ul></ul>`); (q.elements||[]).forEach(e=>ul2.appendChild(el(`<li>${escapeHtml(e.texte)}</li>`))); projCard.appendChild(ul2);
    } else if(q.type==='association' || q.type==='classement'){
      const items = q.type==='association' ? (q.pairs||[]).map(p=>`${p.left} → ${p.right}`) : (q.items||[]);
      const ul = el(`<ul></ul>`); items.forEach(i=>ul.appendChild(el(`<li>${escapeHtml(i)}</li>`))); projCard.appendChild(ul);
    } else if(q.type==='texte_trous'){
      projCard.appendChild(el(`<p style="font-size:1.1rem; line-height:2;">${escapeHtml(q.textTemplate||'').replace(/___/g,'<u>______</u>')}</p>`));
    } else if(q.type==='production_orale'){
      projCard.appendChild(el(`<p class="muted">Cette partie sera évaluée à l'oral, séparément.</p>`));
    } else if(q.type==='dessin'){
      projCard.appendChild(el(`<p class="muted">L'élève dessine ou colorie librement sur son appareil.</p>`));
    } else {
      projCard.appendChild(el(`<p class="muted">Réponse libre de l'élève (correction manuelle).</p>`));
    }
  }
  draw();
  wrap.querySelector('#pPrev').onclick = ()=>{ if(qIndex>0){ qIndex--; draw(); } };
  wrap.querySelector('#pNext').onclick = ()=>{ if(qIndex<flat.length-1){ qIndex++; draw(); } };
}

          <button class="btn btn-danger btn-sm" data-a="del">Supprimer</button>
        </div>
      </div>
      <div class="sub" style="margin-top:.6em;"></div>
    </div>`);
    const sub = card.querySelector('.sub');

    card.querySelector('[data-a="edit"]').onclick = ()=> drawProjectForm(wrap, p);
    card.querySelector('[data-a="dup"]').onclick = async ()=>{ try{ await api(`/api/projects/${p.id}/duplicate`,{method:'POST'}); render(); }catch(e){ alert(e.message); } };
    card.querySelector('[data-a="archive"]').onclick = async ()=>{ try{ await api(`/api/projects/${p.id}/archive`,{method:'PATCH'}); render(); }catch(e){ alert(e.message); } };
    card.querySelector('[data-a="del"]').onclick = async ()=>{
      if(!confirm(`Supprimer « ${p.titre} » ?`)) return;
      try{ await api(`/api/projects/${p.id}`,{method:'DELETE'}); render(); }catch(e){ alert(e.message); }
    };

    card.querySelector('[data-a="results"]').onclick = ()=> drawProjectResultsPanel(sub, p);
    list.appendChild(card);
  });
  return wrap;
}

function drawProjectForm(container, existing){
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : {titre:'', description:'', niveau:'Primaire', matiere:'Français', media:'', statut:'brouillon', criteria:[]};
  const wrap = el(`<div>
    <button class="link-btn" id="back">&larr; Retour aux projets</button>
    <h2 style="margin-top:.5em;">${existing?'Modifier le projet':'Créer un projet'}</h2>
    <div class="card">
      <div class="field"><label>Titre</label><input id="ptitre" value="${escapeHtml(draft.titre)}"></div>
      <div class="field"><label>Description (optionnel)</label><textarea id="pdesc" rows="2">${escapeHtml(draft.description||'')}</textarea></div>
      <div class="row">
        <div class="field" style="flex:1;"><label>Niveau</label><select id="pniveau"><option>Préscolaire</option><option>Primaire</option><option>Secondaire</option></select></div>
        <div class="field" style="flex:1;"><label>Matière</label><select id="pmatiere"><option>Français</option><option>Sciences</option></select></div>
      </div>
      <div class="field"><label>Image d'illustration (optionnel)</label><input id="pmedia" value="${escapeHtml(draft.media||'')}" placeholder="https://..."></div>
    </div>
    <div class="card" style="margin-top:1em;">
      <h3 style="margin-top:0;">Grille d'évaluation</h3>
      <p class="muted" style="font-size:.85rem;">Définissez vos propres critères et le nombre de points de chacun.</p>
      <div id="critList"></div>
      <button class="btn btn-ghost" id="addCrit">+ Ajouter un critère</button>
      <p class="muted" style="margin-top:.5em;">Total : <strong id="ptotalPts">0</strong> points</p>
    </div>
    <div class="row" style="margin-top:1.2em;">
      <button class="btn btn-primary" id="pSaveDraft">Enregistrer comme brouillon</button>
      <button class="btn btn-primary" id="pPublish" style="background:var(--good);">Publier le projet</button>
    </div>
  </div>`);
  container.innerHTML=''; container.appendChild(wrap);
  wrap.querySelector('#back').onclick = ()=>{ ROUTE.tab='projects'; render(); };
  wrap.querySelector('#pniveau').value = draft.niveau;
  wrap.querySelector('#pmatiere').value = draft.matiere;
  wrap.querySelector('#ptitre').oninput = e=>draft.titre = e.target.value;
  wrap.querySelector('#pdesc').oninput = e=>draft.description = e.target.value;
  wrap.querySelector('#pniveau').onchange = e=>draft.niveau = e.target.value;
  wrap.querySelector('#pmatiere').onchange = e=>draft.matiere = e.target.value;
  wrap.querySelector('#pmedia').oninput = e=>draft.media = e.target.value;
  attachUploadButton(wrap.querySelector('#pmedia'), 'image/*', ()=>{ draft.media = wrap.querySelector('#pmedia').value; });
  drawSchoolLogoControl(wrap.querySelector('.card'));

  const critList = wrap.querySelector('#critList');
  function refreshTotal(){ wrap.querySelector('#ptotalPts').textContent = draft.criteria.reduce((s,c)=>s+Number(c.points||0),0); }
  function drawCriteria(){
    critList.innerHTML='';
    draft.criteria.forEach((c,i)=>{
      const row = el(`<div class="row" style="align-items:center; margin-bottom:.4em;">
        <input style="flex:2;" placeholder="Nom du critère (ex : Participation)" value="${escapeHtml(c.titre)}">
        <input type="number" min="0" style="flex:1;" value="${c.points||0}" placeholder="Points">
        <button class="link-btn" style="color:var(--bad);">✕</button>
      </div>`);
      row.querySelectorAll('input')[0].oninput = e=>c.titre = e.target.value;
      row.querySelectorAll('input')[1].oninput = e=>{ c.points = Number(e.target.value); refreshTotal(); };
      row.querySelector('.link-btn').onclick = ()=>{ draft.criteria.splice(i,1); drawCriteria(); refreshTotal(); };
      critList.appendChild(row);
    });
  }
  drawCriteria(); refreshTotal();
  wrap.querySelector('#addCrit').onclick = ()=>{
    draft.criteria.push({id:'crit_'+Math.random().toString(36).slice(2,8), titre:'', points:10});
    drawCriteria(); refreshTotal();
  };

  async function commit(statut){
    if(!draft.titre.trim()){ alert('Donnez un titre au projet.'); return; }
    if(draft.criteria.length===0){ alert('Ajoutez au moins un critère.'); return; }
    for(const c of draft.criteria){ if(!c.titre.trim()){ alert('Chaque critère doit avoir un nom.'); return; } }
    draft.statut = statut;
    try{
      if(existing) await api(`/api/projects/${existing.id}`, {method:'PUT', body:draft});
      else await api('/api/projects', {method:'POST', body:draft});
      ROUTE.tab='projects'; render();
    }catch(e){ alert(e.message); }
  }
  wrap.querySelector('#pSaveDraft').onclick = ()=>commit('brouillon');
  wrap.querySelector('#pPublish').onclick = ()=>commit('publié');
}

function projectToWordHTML(p, logoUrl){
  let body = `${logoUrl ? `<img src="${logoUrl}" style="height:60px; float:right;">` : ''}<h1 style="font-family:Georgia,serif;">${escapeHtml(p.titre)}</h1>
  <p><em>Niveau : ${escapeHtml(p.niveau)} · Matière : ${escapeHtml(p.matiere)} — Total : ${p.maxTotal} points</em></p>`;
  if(p.description) body += `<p>${escapeHtml(p.description)}</p>`;
  body += `<h2 style="font-family:Georgia,serif; border-bottom:1px solid #999;">Grille d'évaluation</h2><ul>${(p.criteria||[]).map(c=>`<li>${escapeHtml(c.titre)} — /${c.points}</li>`).join('')}</ul>`;
  return `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${escapeHtml(p.titre)}</title></head>
  <body style="font-family:Calibri, Arial, sans-serif;">${body}</body></html>`;
}

async function drawProjectAssignPanel(sub, project, teachersRaw){

  sub.dataset.open='assign';
  sub.innerHTML = '<p class="muted">Chargement…</p>';
  const assignments = (await api('/api/project-assignments')).filter(a=>a.projectId===project.id);

      <option value="${SESSION.user.id}">Moi-même</option>
      ${teachers.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}
    </select></div>
    <div id="passignDyn"></div>
    <button class="btn btn-primary btn-sm" id="doAssignProj">Assigner</button>

  sub.appendChild(form);
  const dyn = form.querySelector('#passignDyn');
  if(project.niveau==='Secondaire'){
    dyn.appendChild(el(`<div class="field"><label>Niveau</label><input id="passignClasse" placeholder="ex : 3e secondaire"></div>`));
  } else {
    dyn.appendChild(el(`<div class="row">
      <div class="field" style="flex:1;"><label>Classe</label><input id="passignClasse"></div>
      <div class="field" style="flex:1;"><label>Groupe</label><input id="passignGroupe"></div>

  }
  form.querySelector('#doAssignProj').onclick = async ()=>{

      await api('/api/project-assignments', {method:'POST', body:{
